<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 접속자 감지 (모바일 최적화)</title>
    
    <!-- 이미지 사전 로드 -->
    <link rel="preload" as="image" href="https://media.ffycdn.net/eu/supercell/B9aSwkAt73UKJgmPgSun.png?width=2400" fetchpriority="high">

    <!-- Firebase SDK (실시간 데이터 동기화) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 🔥 [중요] 본인의 Firebase 설정값으로 교체해주세요!
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 1. 모바일 브라우저에서도 고유하게 나를 식별할 ID 부여 (로컬스토리지 활용)
        let myId = localStorage.getItem('user_uuid');
        if (!myId) {
            myId = 'm_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('user_uuid', myId);
        }

        const myPresenceRef = ref(db, 'presence/' + myId);

        // 2. [접속 신호 전송] 페이지에 들어오자마자 내 존재와 빈 닉네임("이름 없음")을 서버에 등록
        set(myPresenceRef, {
            id: myId,
            nickname: '',
            lastActive: Date.now()
        });

        // 3. [퇴장 감지] 사용자가 브라우저를 끄거나 나가면 서버에서 자동으로 내 데이터 삭제
        onDisconnect(myPresenceRef).remove();

        // 모바일 환경에서 브라우저를 숨기거나 닫을 때 확실하게 처리하기 위한 이벤트
        window.addEventListener('beforeunload', () => {
            set(myPresenceRef, null);
        });

        // 4. [닉네임 실시간 동기화] 입력창에 타이핑하는 즉시 새로고침 없이 서버와 타인에게 전송
        const nicknameInput = document.getElementById('nickname');
        nicknameInput.addEventListener('input', (e) => {
            const newName = e.target.value;
            update(myPresenceRef, {
                nickname: newName,
                lastActive: Date.now()
            });
        });

        // 5. [실시간 수신 및 동기화] 다른 사람이 들어오거나 이름을 바꿀 때 실시간 반영 (새로고침 불필요)
        const presenceRef = ref(db, 'presence');
        onValue(presenceRef, (snapshot) => {
            const data = snapshot.val();
            const userListContainer = document.getElementById('userListContainer');
            const onlineCountBadge = document.getElementById('onlineCount');

            if (!data) {
                onlineCountBadge.innerText = '접속중 0명';
                userListContainer.innerHTML = `<div class="empty-state">현재 접속 중인 사람이 없습니다.</div>`;
                return;
            }

            const users = Object.values(data);
            onlineCountBadge.innerText = `접속중 ${users.length}명`;

            userListContainer.innerHTML = users.map(user => {
                // 이름이 없거나 공백이면 무조건 "이름 없음"으로 표시
                const displayName = (user.nickname && user.nickname.trim() !== '') ? user.nickname : '이름 없음';
                const initial = displayName.charAt(0).toUpperCase();
                const isMe = user.id === myId ? ' (나)' : '';

                return `
                    <div class="user-item">
                        <div class="user-info">
                            <div class="user-avatar">${initial}</div>
                            <div>
                                <div class="user-name">${displayName}${isMe}</div>
                                <div class="user-status-text">실시간 접속중</div>
                            </div>
                        </div>
                        <span style="font-size: 12px; color: #34a853; font-weight: 600;">● 온라인</span>
                    </div>
                `;
            }).join('');
        });
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px;
            gap: 30px; 
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
        }

        /* 왼쪽 카드 UI (40% 확대) */
        .card {
            width: 336px;           
            height: 434px;          
            background-color: #ffffff;
            border-radius: 20px;    
            box-shadow: 0 11px 34px rgba(0, 0, 0, 0.08); 
            border: 1px solid #f0f0f0; 
            padding: 22px 20px;     
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            flex-shrink: 0; 
        }

        .card-image-container {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-6px); 
            overflow: hidden;
        }

        .card-image {
            max-width: 75%;
            max-height: 196px;      
            object-fit: contain;
        }

        .nickname-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;               
        }

        .nickname-label {
            font-size: 15px;        
            font-weight: 600;
            color: #555555;
        }

        .nickname-input {
            width: 100%;
            padding: 11px 14px;     
            font-size: 18px;        
            border: 1px solid #ddd;
            border-radius: 8px;     
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fafafa;
        }

        .nickname-input:focus {
            border-color: #007bff;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        /* 오른쪽 큰 카드 (실시간 실제 접속자 감지 영역) */
        .main-container-card {
            flex: 1; 
            height: 434px; 
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 11px 34px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f0;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .board-title {
            font-size: 18px;
            font-weight: bold;
            color: #333333;
        }

        .online-count-badge {
            background-color: #e6f4ea;
            color: #137333;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #34a853;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .user-list-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
        }

        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background-color: #f9f9f9;
            border-radius: 12px;
            border: 1px solid #eeeeee;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background-color: #e2e8f0;
            color: #475569;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .user-name {
            font-size: 15px;
            font-weight: 600;
            color: #333333;
        }

        .user-status-text {
            font-size: 12px;
            color: #888888;
        }

        .empty-state {
            margin: auto;
            text-align: center;
            color: #888888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 왼쪽 카드 UI -->
    <div class="card">
        <div class="card-image-container">
            <img src="https://media.ffycdn.net/eu/supercell/B9aSwkAt73UKJgmPgSun.png?width=2400" 
                 alt="캐릭터 이미지" 
                 class="card-image"
                 fetchpriority="high"
                 loading="eager">
        </div>
        <div class="nickname-section">
            <label for="nickname" class="nickname-label">닉네임</label>
            <input type="text" id="nickname" class="nickname-input" placeholder="이름을 입력하세요">
        </div>
    </div>

    <!-- 오른쪽 카드: 실제 실시간 접속자 현황 -->
    <div class="main-container-card">
        <div class="board-header">
            <div class="board-title">실시간 실제 접속자 현황</div>
            <div class="online-count-badge">
                <div class="live-dot"></div>
                <span id="onlineCount">접속중 0명</span>
            </div>
        </div>

        <div class="user-list-container" id="userListContainer">
            <div class="empty-state">접속자를 감지하는 중...</div>
        </div>
    </div>
</body>
</html>
