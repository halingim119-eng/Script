<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>접속자 정보 & 갤러리 대시보드</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
        }

        header h1 {
            font-size: 1.8rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent);
        }

        /* 접속자 정보 그리드 */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
        }

        .info-item {
            background-color: rgba(15, 23, 42, 0.6);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.3rem;
        }

        .info-value {
            font-size: 1.05rem;
            font-weight: 600;
            word-break: break-all;
        }

        .flag-img {
            height: 16px;
            vertical-align: middle;
            margin-left: 6px;
        }

        /* 갤러리 섹션 */
        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .btn-refresh {
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-refresh:hover {
            opacity: 0.9;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
        }

        .img-container {
            position: relative;
            width: 100%;
            height: 200px;
            background-color: #0f172a;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .img-container:hover img {
            transform: scale(1.05);
        }

        .loading-text {
            color: var(--accent);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>실시간 접속자 정보 & 이미지 로더</h1>
        <p>클라이언트 및 네트워크 상태 단일 페이지 확인 시스템</p>
    </header>

    <!-- 접속자 정보 카드 -->
    <section class="card">
        <div class="card-title">🌐 접속자 정보 (Network & Device)</div>
        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">IP 주소</div>
                <div class="info-value" id="ip-address"><span class="loading-text">불러오는 중...</span></div>
            </div>
            <div class="info-item">
                <div class="info-label">위치 (국가 / 도시)</div>
                <div class="info-value" id="location"><span class="loading-text">불러오는 중...</span></div>
            </div>
            <div class="info-item">
                <div class="info-label">인터넷 서비스 제공업체 (ISP)</div>
                <div class="info-value" id="isp"><span class="loading-text">불러오는 중...</span></div>
            </div>
            <div class="info-item">
                <div class="info-label">운영체제 / 브라우저</div>
                <div class="info-value" id="browser-info">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">화면 해상도</div>
                <div class="info-value" id="screen-res">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">시간대 및 언어</div>
                <div class="info-value" id="time-lang">-</div>
            </div>
        </div>
    </section>

    <!-- 이미지 갤러리 카드 -->
    <section class="card">
        <div class="gallery-header">
            <div class="card-title" style="margin-bottom:0;">🖼️ 고화질 이미지 갤러리</div>
            <button class="btn-refresh" onclick="loadImages()">이미지 새로고침</button>
        </div>
        <div class="gallery-grid" id="gallery-grid">
            <!-- 자바스크립트로 이미지 삽입 -->
        </div>
    </section>
</div>

<script>
    // 1. 브라우저 로컬 정보 즉시 로드 (네트워크 미연결 시에도 동작)
    function loadLocalDeviceInfo() {
        const ua = navigator.userAgent;
        let os = "Unknown OS";
        if (ua.includes("Win")) os = "Windows";
        else if (ua.includes("Mac")) os = "macOS";
        else if (ua.includes("Linux")) os = "Linux";
        else if (ua.includes("Android")) os = "Android";
        else if (ua.includes("iPhone") || ua.includes("iPad")) os = "iOS";

        let browser = "Unknown Browser";
        if (ua.includes("Chrome") && !ua.includes("Edg")) browser = "Chrome";
        else if (ua.includes("Edg")) browser = "Edge";
        else if (ua.includes("Safari") && !ua.includes("Chrome")) browser = "Safari";
        else if (ua.includes("Firefox")) browser = "Firefox";

        document.getElementById('browser-info').textContent = `${os} / ${browser}`;
        document.getElementById('screen-res').textContent = `${window.screen.width} x ${window.screen.height} (색상 깊이: ${window.screen.colorDepth}-bit)`;
        
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const lang = navigator.language;
        document.getElementById('time-lang').textContent = `${tz} (${lang})`;
    }

    // 2. 접속자 IP 및 위치 정보 가져오기 (이중 폴백)
    async function fetchVisitorNetworkInfo() {
        const ipEl = document.getElementById('ip-address');
        const locEl = document.getElementById('location');
        const ispEl = document.getElementById('isp');

        try {
            // 메인 API: ipwho.is (CORS 지원, HTTPS 안정적)
            const response = await fetch('https://ipwho.is/');
            if (!response.ok) throw new Error('Primary API failed');
            const data = await response.json();

            if (data.success) {
                ipEl.textContent = data.ip;
                locEl.innerHTML = `${data.country} (${data.city}) <img class="flag-img" src="${data.flag.img}" alt="flag" onerror="this.style.display='none'">`;
                ispEl.textContent = data.connection.isp || data.connection.org || '정보 없음';
                return;
            }
            throw new Error('IP API return unsuccessful');
        } catch (err) {
            console.warn('Primary IP API failed, trying fallback:', err);
            
            // 보조 API: ipify (IP 전용 백업)
            try {
                const fbRes = await fetch('https://api.ipify.org?format=json');
                const fbData = await fbRes.json();
                ipEl.textContent = fbData.ip;
                locEl.textContent = '위치 정보 제한됨';
                ispEl.textContent = 'ISP 정보 제한됨';
            } catch (fbErr) {
                ipEl.textContent = '불러오기 실패';
                locEl.textContent = '불러오기 실패';
                ispEl.textContent = '불러오기 실패';
            }
        }
    }

    // 3. 사진 불러오기 (안정적인 CDN 고화질 URL + Picsum 시드 조합)
    function loadImages() {
        const gallery = document.getElementById('gallery-grid');
        gallery.innerHTML = ''; // 기존 이미지 삭제

        // 실패 확률이 제로인 고화질 Unsplash CDN 이미지 및 랜덤 시드 URL 모음
        const timeStamp = Date.now();
        const imageUrls = [
            `https://picsum.photos/600/400?random=${timeStamp + 1}`,
            `https://picsum.photos/600/400?random=${timeStamp + 2}`,
            `https://picsum.photos/600/400?random=${timeStamp + 3}`,
            `https://picsum.photos/600/400?random=${timeStamp + 4}`,
            `https://picsum.photos/600/400?random=${timeStamp + 5}`,
            `https://picsum.photos/600/400?random=${timeStamp + 6}`
        ];

        imageUrls.forEach((url, idx) => {
            const container = document.createElement('div');
            container.className = 'img-container';
            
            const img = document.createElement('img');
            img.src = url;
            img.alt = `Gallery Image ${idx + 1}`;
            img.loading = "lazy";
            
            // 로딩 실패 시 대처
            img.onerror = function() {
                this.src = `https://via.placeholder.com/600x400/334155/f8fafc?text=Image+Load+Failed`;
            };

            container.appendChild(img);
            gallery.appendChild(container);
        });
    }

    // 페이지 로드 시 즉시 실행
    window.addEventListener('DOMContentLoaded', () => {
        loadLocalDeviceInfo();
        fetchVisitorNetworkInfo();
        loadImages();
    });
</script>

</body>
</html>
