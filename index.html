<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비례 퀴즈 배틀</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
*{font-family:'Galmuri11','Galmuri9','Malgun Gothic',sans-serif!important}
body{background:#f1f5f9;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.main-container{display:flex;align-items:center;justify-content:center;gap:20px;padding:6px;width:940px;height:530px;flex-shrink:0;transform-origin:center center}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 25px -5px rgba(0,0,0,.08);border:1px solid #e2e8f0;padding:20px;display:flex;flex-direction:column}
.left-card{width:320px;height:490px;flex-shrink:0;gap:8px}
.card-image-container{width:100%;height:170px;flex:none;display:flex;align-items:center;justify-content:center;transition:height .3s}
.left-card.playing .card-image-container{height:80px}
.card-image{width:85%;height:100%;object-fit:contain}
.card-section{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
#gameUI{justify-content:flex-start;gap:6px}
.nickname-section{width:100%;display:flex;flex-direction:column;gap:6px}
.nickname-label{font-size:14px;font-weight:600;color:#475569}
.nickname-input{width:100%;padding:10px 12px;font-size:15px;border:1px solid #cbd5e1;border-radius:8px;outline:none;background:#f8fafc}
.nickname-input:focus{border-color:#2563eb;background:#fff}
.game-title-badge{flex:none;font-size:13px;font-weight:bold;color:#1e293b;background:#e2e8f0;padding:4px 12px;border-radius:12px}
.btn{width:100%;padding:11px;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;transition:all .2s;margin-top:6px;flex:none}
.btn-red{background:#ef4444}.btn-red:hover{background:#dc2626}
.btn-outline{background:#f8fafc;color:#475569;border:1px solid #cbd5e1}.btn-outline:hover{background:#f1f5f9;color:#1e293b}
.hud{width:100%;flex:none}
.hud-top{display:flex;justify-content:space-between;font-size:13px;font-weight:bold;color:#475569;margin-bottom:3px}
.bar{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden}
#timeFill{height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#f59e0b);transition:width .2s linear}
.prob-box{flex:1;min-height:0;width:100%;background:#f8fafc;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px;text-align:center}
.prob-q{font-size:22px;font-weight:bold;color:#1e293b;line-height:1.5;word-break:keep-all}
.prob-q.big{font-size:30px;letter-spacing:2px}
.blank{display:inline-block;min-width:34px;padding:0 6px;border-bottom:4px solid #2563eb;color:#2563eb}
.rbar{display:flex;width:100%;height:34px;border-radius:8px;overflow:hidden;border:2px solid #1e293b}
.rbar i{display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:bold;font-size:15px;color:#1e293b;border-right:2px solid #1e293b}
.rbar i:last-child{border-right:none}
.right-card-container{flex:1 1 0;min-width:0;height:490px;max-height:490px;display:flex;flex-direction:column;position:relative}
.right-card{width:100%;height:100%;position:relative}
.board-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f1f5f9}
.board-title{font-size:16px;font-weight:bold;color:#1e293b}
.online-count-badge{background:#fee2e2;color:#b91c1c;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:6px}
.transparent-code-input{width:56px;border:none;background:transparent;outline:none;font-size:12px;color:#b91c1c;font-weight:600;text-align:center}
.live-dot{width:8px;height:8px;background:#ef4444;border-radius:50%}
.user-list-container{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.user-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#f8fafc;border-radius:10px;border:1px solid #f1f5f9}
.user-info{display:flex;align-items:center;gap:10px}
.user-avatar-mini{width:32px;height:32px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid #cbd5e1}
.user-name{font-size:14px;font-weight:600;color:#334155}
.empty-state{margin:auto;color:#94a3b8;font-size:13px}
.profile-grid-container{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
.profile-thumb-card{background:#f8fafc;border:2px solid #e2e8f0;border-radius:10px;padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.profile-thumb-card:hover{border-color:#2563eb;background:#eff6ff;transform:scale(1.03)}
.profile-thumb-img{width:100%;height:65px;object-fit:contain}
.game-right-layout{width:100%;height:100%;display:flex;flex-direction:column;gap:14px}
.tall-card{height:280px}
.short-card{height:196px;justify-content:space-between;align-items:center;text-align:center;position:relative}
.rank-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;flex:1;overflow-y:auto;padding-right:4px}
.rank-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#f8fafc;border-radius:8px;font-size:13px;font-weight:600;flex-shrink:0}
.rank-item.selectable{cursor:pointer;border:1px solid #cbd5e1;background:#fff}
.rank-item.selectable:hover{background:#f1f5f9;border-color:#2563eb}
.rank-badge{padding:2px 8px;border-radius:12px;color:#fff;font-size:11px}
.rank-1{background:#eab308}.rank-2{background:#94a3b8}.rank-3{background:#b45309}.rank-etc{background:#cbd5e1;color:#475569}
.quiz-title{font-size:15px;font-weight:bold;color:#1e293b}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.choice-grid.frozen{opacity:.35;pointer-events:none}
.choice-btn{padding:12px;font-size:16px;font-weight:bold;background:#f1f5f9;color:#334155;border:1px solid #cbd5e1;border-radius:8px;cursor:pointer;transition:all .2s}
.choice-btn:hover{background:#e2e8f0}
.choice-btn.correct{background:#22c55e!important;color:#fff!important;border-color:#16a34a!important}
.choice-btn.wrong{background:#ef4444!important;color:#fff!important;border-color:#dc2626!important}
.feedback-msg{font-size:13px;font-weight:bold;height:18px}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(8px);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.card-container{display:flex;gap:20px}
.reward-card{position:relative;width:200px;height:290px;background:#fff;border-radius:16px;box-shadow:0 20px 25px -5px rgba(0,0,0,.2);border:2px solid #e2e8f0;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;transition:transform .2s,border-color .2s}
.reward-card:hover{transform:translateY(-8px) scale(1.03);border-color:#2563eb}
.reward-card-title{font-size:16px;font-weight:bold;color:#0f172a;text-align:center;margin-top:18px}
.reward-card-img{width:100px;height:100px;object-fit:contain}
.reward-card-emoji{font-size:72px;line-height:100px}
.reward-card-desc{font-size:12px;color:#64748b;text-align:center;word-break:keep-all}
.rc-no{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:#2563eb;color:#fff;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center}
#cdOverlay{display:none;position:absolute;inset:0;z-index:5;background:rgba(255,255,255,.92);border-radius:12px;align-items:center;justify-content:center;font-size:90px;font-weight:900;color:#2563eb}
.left-card .prob-wrap{position:relative;flex:1;min-height:0;width:100%;display:flex}
#tauntOverlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;pointer-events:none;font-size:30vh}
#toastBox{position:absolute;bottom:8px;right:8px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none;max-width:96%}
.toast{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);color:#1e293b;padding:8px 16px 8px 10px;border-radius:12px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.12);border:1px solid #cbd5e1;border-left:4px solid var(--tc,#3b82f6)}
.toast img{width:36px;height:36px;border-radius:50%;background:#fff;object-fit:contain}
.toast span{font-size:13px;color:#475569}
#resultOverlay{position:fixed;inset:0;z-index:3000;display:none;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 25%,#fff 0%,#eef2ff 100%);overflow:hidden}
#resultOverlay.active{display:flex}
.res-title{color:#1e293b;font-size:4.5vh;font-weight:bold;margin-top:2vh}
.podium{width:min(900px,96vw);height:50vh;margin-top:2vh;display:flex;gap:1.5vh;justify-content:center;align-items:flex-end}
.pod-col{flex:1;max-width:30%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.pod-avatar{width:14vh;height:14vh;min-width:70px;min-height:70px;object-fit:contain;background:#fff;border-radius:50%;border:.7vh solid #facc15;opacity:0;transform:translateY(-6vh) scale(.5);transition:all .6s cubic-bezier(.2,1.5,.4,1)}
.r2 .pod-avatar{border-color:#cbd5e1}.r3 .pod-avatar{border-color:#fb923c}
.pod-name,.pod-score{color:#1e293b;font-weight:bold;opacity:0;transition:opacity .5s .2s;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod-name{font-size:2.8vh;margin-top:1vh}.pod-score{font-size:2.4vh;color:#b45309;margin-bottom:.8vh}
.pod-block{width:100%;height:0;border-radius:1.2vh 1.2vh 0 0;display:flex;align-items:center;justify-content:center;font-size:7vh;font-weight:900;color:#fff;transition:height .8s cubic-bezier(.2,1,.3,1)}
.r1 .pod-block{background:linear-gradient(#facc15,#a16207)}.r2 .pod-block{background:linear-gradient(#e2e8f0,#64748b)}.r3 .pod-block{background:linear-gradient(#fdba74,#9a3412)}
.pod-col.on .pod-avatar{opacity:1;transform:none}.pod-col.on .pod-name,.pod-col.on .pod-score{opacity:1}
.pod-col.on.r1 .pod-block{height:26vh}.pod-col.on.r2 .pod-block{height:19vh}.pod-col.on.r3 .pod-block{height:13vh}
.res-panel{width:min(900px,96vw);margin-top:1.5vh;flex:1;min-height:0;display:flex;flex-direction:column;gap:1vh;padding-bottom:1.5vh}
.res-list{flex:1;min-height:0;overflow-y:auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-content:start}
.res-lobby{padding:1.2vh;font-size:2vh;font-weight:bold;color:#fff;background:#2563eb;border:none;border-radius:10px;cursor:pointer}
.res-lobby:hover{background:#1d4ed8}
.t-box{width:100%;display:none;flex-direction:column;gap:6px;flex:none}
.t-box label{font-size:13px;color:#475569;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.t-box input{width:70px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;text-align:right}
</style>
</head>
<body>
<div class="main-container" id="mainContainer">
  <div class="card left-card" id="leftCard">
    <div class="card-image-container"><img id="cardImage" alt="캐릭터" class="card-image"></div>

    <div id="normalUI" class="card-section">
      <div class="nickname-section">
        <label for="nickname" class="nickname-label">닉네임</label>
        <input type="text" id="nickname" class="nickname-input" placeholder="익명" maxlength="12" autocomplete="off">
        <button id="changeProfileBtn" class="btn btn-outline">📸 프로필 바꾸기</button>
      </div>
    </div>

    <div id="gameUI" class="card-section" style="display:none;">
      <div class="game-title-badge" id="badge">비례 퀴즈</div>
      <div class="hud">
        <div class="hud-top"><span id="streakTxt">🔥 0연속</span><span id="scoreTxt">0점</span></div>
        <div class="bar"><div id="timeFill"></div></div>
      </div>
      <div class="prob-wrap">
        <div class="prob-box"><div class="prob-q" id="probQ"></div><div id="probBar" style="width:100%"></div></div>
        <div id="cdOverlay"></div>
      </div>
    </div>

    <div class="t-box" id="durBox"><label>제한 시간 (분) <input type="number" id="durMin" value="3" min="1" max="30"></label></div>
    <button id="startBtn" class="btn btn-red" style="display:none;">시작</button>
    <button id="endBtn" class="btn btn-red" style="display:none;">종료</button>
  </div>

  <div class="right-card-container">
    <div id="defaultUserListUI" class="card right-card">
      <div class="board-header">
        <div class="board-title">플레이어들</div>
        <div class="online-count-badge">
          <div class="live-dot"></div><span id="onlineCountText">0명</span>
          <input type="password" id="teacherCode" class="transparent-code-input" placeholder="코드" autocomplete="new-password">
        </div>
      </div>
      <div class="user-list-container" id="userListContainer"><div class="empty-state">불러오는 중...</div></div>
    </div>

    <div id="profilePickerUI" class="card right-card" style="display:none;">
      <div class="board-header">
        <div class="board-title">📸 프로필 고르기</div>
        <button id="closeProfilePickerBtn" style="border:none;background:none;cursor:pointer;font-size:13px;color:#64748b;font-weight:bold;">닫기 ✕</button>
      </div>
      <div class="profile-grid-container" id="profileGrid"></div>
    </div>

    <div id="gameRankingUI" class="game-right-layout" style="display:none;">
      <div class="card tall-card">
        <div class="board-title" id="rankingTitle">🏆 랭킹</div>
        <div class="rank-list" id="rankingList"></div>
      </div>
      <div class="card short-card">
        <div class="quiz-title" id="quizTitle">문제를 기다리는 중</div>
        <div class="choice-grid" id="choiceButtons"></div>
        <div id="feedbackMessage" class="feedback-msg"></div>
      </div>
    </div>
    <div id="toastBox"></div>
  </div>
</div>

<div class="modal-overlay" id="cardModalOverlay"><div class="card-container" id="cardContainer"></div></div>
<div id="resultOverlay">
  <div class="res-title">🏆 결과 발표</div>
  <div class="podium" id="podium"></div>
  <div class="res-panel"><div class="res-list" id="resList"></div><button class="res-lobby" id="lobbyBtn">로비로</button></div>
</div>
<div id="tauntOverlay">😝</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient("https://knjblcpgxcixfbzcrrqg.supabase.co", "sb_publishable_Xn2UjMtIkzXQU_6xPlMvrg_Rtc9VY0v");
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => [...a].sort(() => Math.random() - 0.5);
const gcd = (a, b) => b ? gcd(b, a % b) : a;

/* ===== 설정 (여기 숫자만 바꾸면 됩니다) ===== */
const CFG = { score: 10, streakBonus: 2, streakMax: 5, wrongMs: 1500, freezeSec: 3, tauntSec: 2.5, countMs: 3000, teacherCode: 'PANdA', channel: 'ratio-quiz-room-v1' };

/* ===== 프로필 이미지 ===== */
const SC = id => `https://media.ffycdn.net/eu/supercell/${id}.png?width=2400`;
const profileImages = ["fTRckDCnv8CLTEMDi3tt","B9aSwkAt73UKJgmPgSun","QnZRLnpy7ckitzeuASFz","S6nkFKmpdZs1c8qRUo8f","tTtXs4ftdtuBh85yq9tY","s83nEEJ4ZKPXzgKjDrF3","HDkXgubferFDkbkHJAXo","w6fRpxtAdEXsWLjHEzHD","aVJ7E8hmdXBjNbT9CHeM","m823rLr57CeLZdx2ivfZ","6PVSgKBY4KNpkabWr9bj","6jGjY3JAbFrkSx4FaiVH","Qmxk7V5tFcmLGeCVueWT","XTTrodLDSVQVrjhYbs2Z","ACfDodL3WGgMD3ybdHvn","7a6mrhbBHByusVgTvkoS"].map(SC);
const GAME_CARD_IMAGE = SC('w6fRpxtAdEXsWLjHEzHD');
let selectedImage = profileImages[0];
$('cardImage').src = selectedImage;

const newId = () => 'user_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const myId = (() => { try { let v = sessionStorage.getItem('ratioMyId'); if (!v) { v = newId(); sessionStorage.setItem('ratioMyId', v); } return v; } catch (e) { return newId(); } })();

/* ===== 효과음 (간단) ===== */
const SFX = (() => {
  let c; const A = () => { if (!c) c = new (window.AudioContext || window.webkitAudioContext)(); if (c.state === 'suspended') c.resume(); return c; };
  const T = (f, d, ty = 'square', v = .1, at = 0, to = 0) => { try { const a = A(), o = a.createOscillator(), g = a.createGain(), s = a.currentTime + at; o.type = ty; o.frequency.setValueAtTime(f, s); if (to) o.frequency.exponentialRampToValueAtTime(to, s + d); g.gain.setValueAtTime(.0001, s); g.gain.linearRampToValueAtTime(v, s + .01); g.gain.exponentialRampToValueAtTime(.0001, s + d); o.connect(g); g.connect(a.destination); o.start(s); o.stop(s + d + .02); } catch (e) {} };
  return {
    correct: () => { [1047, 1319, 1568, 2093].forEach((f, i) => T(f, i === 3 ? .3 : .1, 'square', .08, i * .055)); },
    wrong: () => { T(180, .3, 'sawtooth', .12, 0, 80); },
    pop: () => T(400, .1, 'sine', .1, 0, 1100),
    card: () => [659, 784, 1047].forEach((f, i) => T(f, .12, 'triangle', .08, i * .07)),
    start: () => [392, 523, 659, 784, 1047].forEach((f, i) => T(f, .16, 'square', .08, i * .08)),
    tick: () => T(1200, .05, 'square', .06),
    hit: () => { T(150, .15, 'square', .15, 0, 50); },
    win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => T(f, .25, 'sawtooth', .07, i * .12))
  };
})();

/* ===== 문제 생성기 (비례식 · 비례배분) ===== */
const COLORS = ['#93c5fd', '#fcd34d', '#86efac'];
const barHtml = parts => `<div class="rbar">${parts.map((p, i) => `<i style="flex:${p};background:${COLORS[i]}">${p}</i>`).join('')}</div>`;
function numOpts(ans, extras, unit = '') {
  let d = shuffle([...new Set(extras.filter(x => Number.isInteger(x) && x > 0 && x !== ans))]).slice(0, 3), g = 0;
  while (d.length < 3 && g++ < 100) { const v = ans + rnd(1, 4) * (Math.random() < .5 ? 1 : -1); if (v > 0 && v !== ans && !d.includes(v)) d.push(v); }
  return { ans: ans + unit, ch: shuffle([ans, ...d]).map(v => v + unit) };
}
function strOpts(ans, extras) {
  let d = shuffle([...new Set(extras.filter(x => x !== ans))]).slice(0, 3), g = 0;
  while (d.length < 3 && g++ < 100) { const v = `${rnd(1, 9)} : ${rnd(1, 9)}`; if (v !== ans && !d.includes(v)) d.push(v); }
  return { ans, ch: shuffle([ans, ...d]) };
}
function coprimePair(max = 9) { let a, b; do { a = rnd(1, max); b = rnd(1, max); } while (a === b || gcd(a, b) > 1); return [a, b]; }

const GEN = {
  prop() {   // 비례식에서 □ 구하기
    const [a, b] = coprimePair(), k = rnd(2, 9), c = a * k, d = b * k, hide = rnd(0, 3), v = [a, b, c, d];
    const ans = v[hide], show = v.map((x, i) => i === hide ? '<span class="blank">□</span>' : x);
    const mis = [c + b - a, d - b + a, a + d - c, b - d + c][hide];   // "더하기로 계산" 실수
    const o = numOpts(ans, [mis, ans + k, ans - k, ans + 1, ans - 1, hide < 2 ? v[hide + 2] : v[hide - 2]]);
    return { title: '□에 알맞은 수는?', q: `${show[0]} : ${show[1]} = ${show[2]} : ${show[3]}`, big: 1, ...o };
  },
  prod() {   // 외항의 곱 / 내항의 곱
    const [a, b] = coprimePair(), k = rnd(2, 6), c = a * k, d = b * k, outer = Math.random() < .5, P = a * d;
    const o = numOpts(P, [a * c, b * d, a + d, b + c, a * b, c * d]);

  },

    const ex = [`${b} : ${a}`, `${a + 1} : ${b}`, `${a} : ${b + 1}`, `${a + 1} : ${b + 1}`, `${x} : ${y}`.replace(/\./g, '') ];

    const [item, unit] = pick([['사탕', '개'], ['구슬', '개'], ['색종이', '장'], ['연필', '자루'], ['리본', 'cm']]);

/* ===== 상태 ===== */
let isTeacher = false, myNickname = '익명', myScore = 0, streak = 0, solved = 0;

let cur = null, hasGuessed = false, tripleNext = false, frozenUntil = 0;

let isSubscribed = false, room = null, presenceTimer = null, reconnectTimer = null, helloTimer = null, lastConnectAt = 0;
const joinedAt = Date.now(), roster = new Map();

/* ===== 접속자 동기화 ===== */
function getMyPayload() {
  const left = gameStarted ? Math.max(0, localEnd - Date.now()) : 0;
  return { id: myId, nickname: myNickname, avatarUrl: selectedImage, score: myScore, streak, isTeacher,
    gs: isTeacher && gameStarted ? session : 0, gl: isTeacher ? left : 0, gd: isTeacher ? dur : 0, res: isTeacher ? myRes : null,
    joinedAt, hb: Date.now() };
}
function syncNickname() {

}
function updatePresence() { renderAll(); clearTimeout(presenceTimer); presenceTimer = setTimeout(sendState, 150); }
async function sendState() { const ch = room; if (!isSubscribed || !ch) return; try { await ch.send({ type: 'broadcast', event: 'state', payload: getMyPayload() }); } catch (e) {} }
function receiveState(u) {

  roster.set(u.id, { user: u, at: Date.now() }); renderAll();
}
function collectUsers() {
  const now = Date.now(); roster.forEach((r, id) => { if (now - r.at > 12000) roster.delete(id); });
  return [...[...roster.values()].map(r => r.user), getMyPayload()].sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0) || String(a.id).localeCompare(String(b.id)));
}
let raBusy = false, raAgain = false;
function renderAll() { if (raBusy) { raAgain = true; return; } raBusy = true; try { renderInner(); } finally { raBusy = false; } if (raAgain) { raAgain = false; setTimeout(renderAll, 0); } }
function renderInner() {
  const users = collectUsers(); activeUsers = users;
  if (!isTeacher) {   // 선생님의 진행 상태를 따라감

    if (host) {

    } else if (gameStarted) {

/* ===== 게임 시작 / 종료 ===== */
function startLocal(sess, left, d) {

function teacherStart() {

  else {

/* ===== 문제 풀기 ===== */

  $('quizTitle').innerText = cur.title; $('feedbackMessage').innerText = '';

  if (val === cur.ans) {

/* ===== 보상 카드 ===== */
function cardPool() {

  return [
    { type: 'coin', title: `코인 ${c}개`, emoji: '🪙', desc: `바로 +${c}점`, val: c },
    { type: 'freeze', title: '얼음 카드', emoji: '❄️', desc: `상대가 ${CFG.freezeSec}초 동안 답을 못 눌러요` },
    { type: 'taunt', title: '놀리기 카드', emoji: '😝', desc: '상대 화면을 큰 그림으로 가려요' },

/* ===== 통신 ===== */
async function connect() {
  lastConnectAt = Date.now(); const old = room; room = null; isSubscribed = false;
  if (old) { try { await supabase.removeChannel(old); } catch (e) {} }
  const ch = room = supabase.channel(CFG.channel, { config: { broadcast: { self: false } } });
  ch.on('broadcast', { event: 'state' }, ({ payload }) => receiveState(payload));
  ch.on('broadcast', { event: 'hello' }, ({ payload }) => { if (!payload || payload.id === myId || helloTimer) return; helloTimer = setTimeout(() => { helloTimer = null; sendState(); }, Math.random() * 1500); });
  ch.on('broadcast', { event: 'bye' }, ({ payload }) => { if (payload && roster.delete(payload.id)) renderAll(); });
  ch.on('broadcast', { event: 'attack' }, ({ payload }) => onAttack(payload));
  ch.subscribe(status => {
    if (ch !== room) return;
    if (status === 'SUBSCRIBED') { clearTimeout(reconnectTimer); isSubscribed = true; Promise.resolve(ch.send({ type: 'broadcast', event: 'hello', payload: { id: myId } })).catch(() => {}); sendState(); renderAll(); }
    else if (['CLOSED', 'CHANNEL_ERROR', 'TIMED_OUT'].includes(status)) { isSubscribed = false; clearTimeout(reconnectTimer); reconnectTimer = setTimeout(connect, 4000); }
  });
}
setInterval(() => { if (!isSubscribed && Date.now() - lastConnectAt > 8000) connect(); else { sendState(); renderAll(); } }, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (!isSubscribed) connect(); else sendState(); } });

document.addEventListener('keydown', e => {   // 숫자키: 카드 / 선택지
  if (/INPUT|TEXTAREA/.test(e.target.tagName || '') || e.ctrlKey || e.altKey) return;
  const n = parseInt(e.key, 10); if (!(n >= 1 && n <= 4)) return;
  const m = $('cardModalOverlay');
  if (m.classList.contains('active')) { const c = m.querySelectorAll('.reward-card')[n - 1]; if (c) c.click(); }
  else if (gameStarted && !isTeacher) { const b = $('choiceButtons').children[n - 1]; if (b) b.click(); }
});

/* ===== 화면 크기에 맞춰 확대/축소 ===== */
function fitScreen() { const s = Math.max(0.4, Math.min(window.innerWidth / 940, window.innerHeight / 530, 3)); $('mainContainer').style.transform = `scale(${s})`; }
window.addEventListener('resize', fitScreen);

applyUI(false); syncNickname(); fitScreen(); connect();
</script>
</body>
