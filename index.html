<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PICO PARK</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden;font-family:'Jua','Malgun Gothic',sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#up{position:fixed;inset:0;background:#fffffff2;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9;color:#ff8a3d;text-align:center}
#up h1{font-size:52px;margin:0 0 8px}#up p{color:#aaa;margin:4px;font-size:16px}
#up button{margin-top:18px;font:inherit;font-size:24px;padding:10px 36px;border:0;border-radius:14px;background:#ff8a3d;color:#fff}
</style></head><body>
<canvas id="c" width="960" height="544"></canvas>
<div id="up"><h1>업데이트 됐어요!</h1><p id="sg"></p><button id="ok">확인</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== 설정 ===== */
// 서버 2개: 각 프로젝트의 anon(publishable) 키를 넣으세요. 안 넣으면 혼자 연습 모드.
const SERVERS=[
 {name:'시드니',url:'https://knjblcpgxcixfbzcrrqg.supabase.co',key:'여기에_시드니_anon키'},
 {name:'도쿄',url:'https://dtmakmsmahcimrjnhstg.supabase.co',key:'여기에_도쿄_anon키'}];
const ROOM=new URLSearchParams(location.search).get('room')||'6-2'; // 같은 주소(?room=...)로 들어오면 같은 방
const SIGNAL='pico-v1-1021a'; // 업데이트할 때마다 이 값을 바꾸면 "업데이트 됐어요!"가 다시 뜸

/* ===== 업데이트 알림 ===== */
const up=document.getElementById('up');
try{if(localStorage.getItem('pp_sig')!==SIGNAL)up.style.display='flex'}catch(e){up.style.display='flex'}
document.getElementById('sg').textContent='신호값: '+SIGNAL;
document.getElementById('ok').onclick=()=>{up.style.display='none';try{localStorage.setItem('pp_sig',SIGNAL)}catch(e){}};

/* ===== 기본값 ===== */
const T=32,W=960,H=544,PW=28,ROPE=84,OR='#ff8a3d';
const COL=['#b78cf0','#f5a468','#f8e25c','#4b8cf2','#f2796d','#72d872','#f48fdc','#d6d6d6'];
const SP=['#......#','##....##','########','########','##e##e##','########','########','ff....ff'];
const cv=document.getElementById('c'),g=cv.getContext('2d');
function cat(x,y,col,s){for(let j=0;j<8;j++)for(let i=0;i<8;i++){const c=SP[j][i];if(c=='.')continue;
 g.fillStyle=c=='e'?'#111':col;g.fillRect(x+i*s,y+j*s,s+.6,s+.6);
 if(c=='f'){g.fillStyle='rgba(255,255,255,.4)';g.fillRect(x+i*s,y+j*s,s+.6,s+.6)}}}
function doorShape(x,y,w,h,open){g.fillStyle=open?'#e6cfa8':'#c4a073';g.beginPath();g.moveTo(x,y+h);g.lineTo(x,y+14);g.quadraticCurveTo(x,y,x+14,y);g.lineTo(x+w-14,y);g.quadraticCurveTo(x+w,y,x+w,y+14);g.lineTo(x+w,y+h);g.fill();
 g.fillStyle='#6b4e32';g.fillRect(x+w*.2,y+h*.55,6,6)}
function keyShape(x,y){g.fillStyle='#f5c518';g.beginPath();g.arc(x+8,y+8,8,0,7);g.fill();g.fillStyle='#fff';g.fillRect(x+6,y+6,4,4);g.fillStyle='#f5c518';g.fillRect(x+14,y+6,12,5);g.fillRect(x+21,y+10,4,7)}

/* ===== 스테이지 (길이, 땅 구간, 블록[열,행,너비,높이], 열쇠, 문, 시작열) ===== */
const LV=[
 {w:70,g:[[0,70]],b:[[16,14,2,1],[24,13,3,2],[34,12,2,3],[48,13,3,2]],key:[25,11],door:[66],sp:3},
 {w:70,g:[[0,18],[21,36],[39,52],[55,70]],b:[[28,12,3,3]],key:[29,10],door:[66],sp:3},
 {w:70,g:[[0,70]],b:[[30,11,2,4]],key:[16,13],door:[66],sp:3}];
let L,grid,stage=0,clr=0,camX=0;
const id=Math.random().toString(36).slice(2,8),join=Date.now();
const me={i:id,j:join,x:0,y:0,vx:0,vy:0,f:1,k:0,d:0,n:0,s:0,g:0};
const P={};
function load(n){stage=n;me.s=n;L=LV[n];grid=[];for(let r=0;r<17;r++)grid.push(Array(L.w).fill(0));
 L.g.forEach(([a,b])=>{for(let c=a;c<b;c++){grid[15][c]=1;grid[16][c]=1}});
 L.b.forEach(([c,r,w,h])=>{for(let i=0;i<w;i++)for(let j=0;j<h;j++)grid[r+j][c+i]=1});
 respawn();me.d=0;me.n=0;clr=0}
function respawn(){me.x=L.sp*T;me.y=420;me.vx=me.vy=0;me.k=0}
const sol=(c,r)=>(c<0||c>=L.w)?1:(r<0||r>=17)?0:grid[r][c];
function hit(x,y){for(let c=Math.floor(x/T);c<=Math.floor((x+PW-.01)/T);c++)for(let r=Math.floor(y/T);r<=Math.floor((y+PW-.01)/T);r++)if(sol(c,r))return 1;return 0}
const ov=(a,b,w,h)=>a.x<b.x+w&&a.x+PW>b.x&&a.y<b.y+h&&a.y+PW>b.y;

/* ===== 네트워크: 서버 2개가 절반씩 맡음 ===== */
const chans=[],ok=[0,0];let lastSig='',lastT=0,solo=true;
function net(){if(typeof supabase=='undefined')return;
 SERVERS.forEach((s,i)=>{if(s.key.startsWith('여기'))return;solo=false;
  const cl=supabase.createClient(s.url,s.key,{realtime:{params:{eventsPerSecond:30}}});
  const ch=cl.channel('pp-'+ROOM,{config:{broadcast:{self:false}}});
  ch.on('broadcast',{event:'p'},({payload:p})=>{if(!p||p.i==id)return;const o=P[p.i]||(P[p.i]={rx:p.x,ry:p.y});Object.assign(o,p);o.t=performance.now()})
    .subscribe(st=>{ok[i]=st=='SUBSCRIBED'?1:0});chans[i]=ch})}
function send(now){const h=[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%2;
 const i=ok[h]?h:ok[1-h]?1-h:-1;if(i<0)return;   // 내 서버가 죽으면 다른 서버로 자동 전환
 const m={i:id,x:Math.round(me.x),y:Math.round(me.y),f:me.f,k:me.k,d:me.d,n:me.n,s:stage,j:join};
 const sg=[m.x,m.y,m.k,m.d,m.n,m.s].join();if(now-lastT<120||(sg==lastSig&&now-lastT<500))return;
 lastSig=sg;lastT=now;chans[i].send({type:'broadcast',event:'p',payload:m})}
function plist(){const t=performance.now();for(const k in P)if(t-P[k].t>3000)delete P[k];
 return[me,...Object.values(P)].sort((a,b)=>a.j-b.j||(a.i<b.i?-1:1))}

/* ===== 입력 ===== */
const K={};let started=false;
addEventListener('keydown',e=>{if(' ArrowUpArrowDownArrowLeftArrowRight'.includes(e.key))e.preventDefault();
 if(up.style.display=='flex')return;
 if(!started&&(e.key==' '||e.key=='Enter')){started=true;load(0);return}
 K[e.key.toLowerCase()]=1});
addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
cv.onclick=()=>{if(!started){started=true;load(0)}};

/* ===== 한 프레임 ===== */
function step(now){
 for(const k in P){const o=P[k];if(o.s>stage&&started)load(o.s)}
 const act=plist().filter(o=>o.s==stage&&!o.n||o===me);
 const all=plist().filter(o=>o.s==stage);
 const doorOpen=all.some(o=>o.d);
 if(doorOpen)me.d=1;
 const kx=L.key[0]*T,ky=L.key[1]*T,dx=L.door[0]*T,dy=480-64;
 if(!me.n){
  const ax=(K.arrowright||K.d?1:0)-(K.arrowleft||K.a?1:0);if(ax)me.f=ax;
  me.vx+=(ax*3.4-me.vx)*(me.g?.25:.12);me.vy=Math.min(me.vy+.5,12);
  if((K.arrowup||K.w||K[' '])&&me.g){me.vy=-10.5;me.g=0}
  // 줄: 앞뒤 이웃이 당김
  const ix=act.indexOf(me);[act[ix-1],act[ix+1]].forEach(o=>{if(!o)return;
   const ex=o.rx!=null?o.rx:o.x,ey=o.ry!=null?o.ry:o.y,ddx=ex-me.x,ddy=ey-me.y,d=Math.hypot(ddx,ddy);
   if(d>ROPE){const f=Math.min((d-ROPE)*.02,1.5);me.vx+=ddx/d*f;me.vy+=ddy/d*f*.6}});
  const py=me.y;
  me.x+=me.vx;if(hit(me.x,me.y)){me.x=me.vx>0?Math.floor((me.x+PW-.01)/T)*T-PW:(Math.floor(me.x/T)+1)*T;me.vx=0}
  me.y+=me.vy;me.g=0;
  if(hit(me.x,me.y)){if(me.vy>0){me.y=Math.floor((me.y+PW-.01)/T)*T-PW;me.g=1}else me.y=(Math.floor(me.y/T)+1)*T;me.vy=0}
  else if(me.vy>=0)for(const o of act){if(o===me)continue;const ox=o.rx!=null?o.rx:o.x,oy=o.ry!=null?o.ry:o.y;
   if(me.x+PW>ox+3&&me.x<ox+PW-3&&py+PW<=oy+8&&me.y+PW>=oy&&me.y+PW<=oy+16){me.y=oy-PW;me.vy=0;me.g=1}}
  if(me.y>H+60)respawn();
  const holder=all.some(o=>o.k);
  if(!holder&&!doorOpen&&ov(me,{x:kx,y:ky},24,20))me.k=1;
  if(me.k&&ov(me,{x:dx,y:dy},48,64)){me.k=0;me.d=1}
  if(me.d&&ov(me,{x:dx,y:dy},48,64))me.n=1;
 }
 for(const k in P){const o=P[k];o.rx+=(o.x-o.rx)*.35;o.ry+=(o.y-o.ry)*.35}
 if(doorOpen&&all.length&&all.every(o=>o.n)){if(!clr)clr=now+2200;else if(now>clr)load((stage+1)%LV.length)}
 const av=all.reduce((a,o)=>a+(o===me?me.x:o.rx),0)/(all.length||1);
 camX+=(av-W/2-camX)*.1;camX=Math.max(me.x-W+120,Math.min(me.x-60,camX));camX=Math.max(0,Math.min(L.w*T-W,camX));
 send(now)}

/* ===== 그리기 ===== */
function title(){g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle=OR;g.textAlign='center';
 g.font="900 130px 'Jua',sans-serif";g.fillText('PICO PARK',W/2,190);
 g.beginPath();g.roundRect(W/2-420,218,840,20,10);g.fill();
 g.fillStyle='#bbb';g.font="22px 'Jua',sans-serif";g.fillText('스페이스바 / 화면 클릭으로 시작',W/2,290);
 g.fillStyle=OR;g.fillRect(0,H-20,W,20);
 [.06,.18,.3,.41,0,.62,.73,.84,.95].forEach((f,n)=>{if(!f){doorShape(W/2-36,H-20-72,72,72,0);return}
  cat(f*W-22,H-20-44,COL[n<4?n:n-1],5.5)})}
function draw(){
 if(!started){title();return}
 g.fillStyle='#fff';g.fillRect(0,0,W,H);g.save();g.translate(-Math.round(camX),0);
 g.fillStyle=OR;for(let r=0;r<17;r++)for(let c=Math.max(0,Math.floor(camX/T));c<Math.min(L.w,Math.ceil((camX+W)/T));c++)if(grid[r][c])g.fillRect(c*T,r*T,T+.5,T+.5);
 const all=plist().filter(o=>o.s==stage),open=all.some(o=>o.d);
 doorShape(L.door[0]*T,416,48,64,open);
 const act=all.filter(o=>!o.n||o===me&&!me.n),pos=o=>o===me?[me.x,me.y]:[o.rx,o.ry];
 const holder=all.find(o=>o.k);
 if(!holder&&!open)keyShape(L.key[0]*T,L.key[1]*T);
 g.strokeStyle='#8b6b4a';g.lineWidth=3;
 for(let i=0;i<act.length-1;i++){const[a,b]=[pos(act[i]),pos(act[i+1])],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
  g.beginPath();g.moveTo(a[0]+14,a[1]+18);g.quadraticCurveTo((a[0]+b[0])/2+14,(a[1]+b[1])/2+18+Math.max(0,ROPE-d)*.6+6,b[0]+14,b[1]+18);g.stroke()}
 plist().forEach((o,n)=>{if(o.s!=stage||o.n)return;const[x,y]=pos(o);cat(x,y,COL[n%8],3.5);
  if(o.k)keyShape(x+2,y-24);
  if(o===me){g.fillStyle=OR;g.beginPath();g.moveTo(x+8,y-12);g.lineTo(x+20,y-12);g.lineTo(x+14,y-5);g.fill()}});
 g.restore();
 g.textAlign='left';g.fillStyle='#999';g.font="16px 'Jua',sans-serif";
 g.fillText(`STAGE ${stage+1}/${LV.length} · ${all.length}명 · `+(solo?'혼자 연습 중 (서버 키 미입력)':SERVERS.map((s,i)=>s.name+(ok[i]?' 🟢':' ⚪')).join(' ')),12,24);
 if(clr){g.textAlign='center';g.fillStyle=OR;g.font="900 96px 'Jua',sans-serif";g.fillText('CLEAR!',W/2,H/2)}}

net();
let last=performance.now(),acc=0;
(function loop(now){acc+=Math.min(now-last,100);last=now;
 while(acc>=16.67){acc-=16.67;if(started)step(now)}
 draw();requestAnimationFrame(loop)})(last);
</script></body></html>
