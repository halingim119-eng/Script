<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미니 게임</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@latest/neodgm/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
*{font-family:'Galmuri11','Galmuri9','NeoDunggeunmo','Neo둥근모','DungGeunMo','Malgun Gothic',sans-serif!important}
body{background:#f1f5f9;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Malgun Gothic',sans-serif;overflow:hidden}
/* 940x530 기준 레이아웃을 JS가 화면 크기에 맞춰 확대/축소함 */
.main-container{display:flex;align-items:center;justify-content:center;gap:20px;padding:20px;width:940px;height:530px;flex-shrink:0;transform-origin:center center}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 25px -5px rgba(0,0,0,.08);border:1px solid #e2e8f0;padding:20px;display:flex;flex-direction:column}
.left-card{width:320px;height:490px;flex-shrink:0;gap:8px}
.card-image-container{width:100%;height:170px;flex:none;display:flex;align-items:center;justify-content:center}
.card-image{width:85%;height:100%;object-fit:contain}
.card-section{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
#gameUI{justify-content:flex-start}
.nickname-section{width:100%;display:flex;flex-direction:column;gap:6px}
.nickname-label{font-size:14px;font-weight:600;color:#475569}
.nickname-input{width:100%;padding:10px 12px;font-size:15px;border:1px solid #cbd5e1;border-radius:8px;outline:none;background:#f8fafc}
.nickname-input:focus{border-color:#2563eb;background:#fff}
#threeContainer{width:100%;flex:1;min-height:0;position:relative;border-radius:12px;overflow:hidden;background:#f8fafc}
#threeContainer canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.game-title-badge{flex:none;font-size:13px;font-weight:bold;color:#1e293b;background:#e2e8f0;padding:4px 12px;border-radius:12px;margin-bottom:6px}
.btn{width:100%;padding:11px;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;transition:all .2s;margin-top:6px;flex:none}
.btn-red{background:#ef4444}.btn-red:hover{background:#dc2626}
.btn-outline{background:#f8fafc;color:#475569;border:1px solid #cbd5e1}.btn-outline:hover{background:#f1f5f9;color:#1e293b}
.teacher-btn-group{width:100%;display:flex;gap:8px;flex:none}
.right-card-container{flex:1 1 0;min-width:0;height:490px;max-height:490px;display:flex;flex-direction:column}
.right-card-container>.card{min-width:0;max-width:100%}
.cfg-body{overflow-x:hidden}
.right-card{width:100%;height:100%;position:relative}
.board-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f1f5f9}
.board-title{font-size:16px;font-weight:bold;color:#1e293b}
.online-count-badge{background:#fee2e2;color:#b91c1c;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:6px}
.transparent-code-input{width:56px;border:none;background:transparent;outline:none;font-size:12px;color:#b91c1c;font-weight:600;text-align:center}
.live-dot{width:8px;height:8px;background:#ef4444;border-radius:50%}
.cfg-open-btn{display:none;border:none;background:transparent;color:#b91c1c;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;padding:0 2px}
.cfg-open-btn.on{text-decoration:underline}
.right-card-container.split{gap:10px}
.right-card-container.split>.card{min-height:0;min-width:0;overflow:hidden}
.right-card-container.split #defaultUserListUI{height:auto;flex:0 0 36%;min-height:0;padding:14px 16px}
.right-card-container.split #settingsUI{height:auto;flex:1;min-height:0;padding:12px 14px}
.right-card-container.split #settingsUI .board-header{margin-bottom:6px;padding-bottom:4px}
#settingsUI .cfg-tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:4px}
#settingsUI .cfg-tab{flex:none;white-space:nowrap;padding:3px 8px;font-size:11px}
.fk-row{display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center;padding:5px 0;border-bottom:1px solid #f1f5f9;font-size:11px;color:#334155}
.fk-row label{display:flex;align-items:center;gap:3px}
.fk-row input[type=number]{width:44px;padding:2px 3px;border:1px solid #cbd5e1;border-radius:5px;font-size:11px;text-align:right}
.fk-row input[type=text]{padding:2px 4px;border:1px solid #cbd5e1;border-radius:5px;font-size:11px}
#resBanner{color:#7c3aed;text-shadow:0 2px 0 #fde68a}
#resBanner.on.c3{background:linear-gradient(90deg,#f43f5e,#f59e0b,#22c55e,#06b6d4,#8b5cf6,#f43f5e);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:bnr .25s ease-in-out infinite alternate,rbs .8s linear infinite}
.troll-pod.tfx-a .pod-block{filter:brightness(1.15)}
@keyframes tBlk{from{filter:brightness(1) saturate(1)}to{filter:brightness(1.4) saturate(1.8)}}
.troll-pod.tfx-b .pod-col.on .pod-avatar{animation:tBounce .45s ease-in-out infinite alternate;will-change:transform}
.troll-pod.tfx-c .pod-col.on .pod-avatar{animation:tBounce .3s ease-in-out infinite alternate;will-change:transform}
@keyframes tHue{to{filter:hue-rotate(360deg)}}
#trollPodium.show.tfx-c{animation:tZoom .6s ease-in-out infinite alternate;will-change:transform}
@keyframes tZoom{from{transform:scale(1)}to{transform:scale(1.07) rotate(.6deg)}}
.user-list-container{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.user-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#f8fafc;border-radius:10px;border:1px solid #f1f5f9}
.user-info{display:flex;align-items:center;gap:10px}
.user-avatar-mini{width:32px;height:32px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid #cbd5e1}
.user-name{font-size:14px;font-weight:600;color:#334155}
.profile-scroll{flex:1;min-height:0;overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;gap:10px}
.profile-grid-container{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.profile-scroll>.cp-box{margin-top:4px;margin-bottom:4px}
.profile-thumb-card{background:#f8fafc;border:2px solid #e2e8f0;border-radius:10px;padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.profile-thumb-card:hover{border-color:#2563eb;background:#eff6ff;transform:scale(1.03)}
.profile-thumb-img{width:100%;height:65px;object-fit:contain}
.game-right-layout{width:100%;height:100%;display:flex;flex-direction:column;gap:14px}
.tall-card{height:280px}
.short-card{height:196px;justify-content:space-between;align-items:center;text-align:center}
.rank-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;flex:1;overflow-y:auto;padding-right:4px}
.rank-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#f8fafc;border-radius:8px;font-size:13px;font-weight:600;flex-shrink:0}
.rank-item.selectable{cursor:pointer;border:1px solid #cbd5e1;background:#fff}
.rank-item.selectable:hover{background:#f1f5f9;border-color:#2563eb}
.rank-badge{padding:2px 8px;border-radius:12px;color:#fff;font-size:11px}
.rank-1{background:#eab308}.rank-2{background:#94a3b8}.rank-3{background:#b45309}.rank-etc{background:#cbd5e1;color:#475569}
.quiz-title{font-size:15px;font-weight:bold;color:#1e293b}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.choice-btn{padding:12px;font-size:15px;font-weight:bold;background:#f1f5f9;color:#334155;border:1px solid #cbd5e1;border-radius:8px;cursor:pointer;transition:all .2s}
.choice-btn:hover{background:#e2e8f0}
@keyframes btnGlowAnim{0%{box-shadow:0 0 5px #3b82f6;border-color:#3b82f6}50%{box-shadow:0 0 15px #60a5fa,0 0 10px #2563eb;border-color:#2563eb}100%{box-shadow:0 0 5px #3b82f6;border-color:#3b82f6}}
.choice-btn.glowing-choice{animation:btnGlowAnim 1.2s infinite alternate;background:#eff6ff!important;color:#1d4ed8!important}
.choice-btn.correct{background:#22c55e!important;color:#fff!important;border-color:#16a34a!important;animation:none!important}
.choice-btn.wrong{background:#ef4444!important;color:#fff!important;border-color:#dc2626!important;animation:none!important}
.feedback-msg{font-size:13px;font-weight:bold;height:18px}
.empty-state{margin:auto;color:#94a3b8;font-size:13px}
/* 모드 투표 오버레이 (접속자 카드를 하얗게 덮음) */
.vote-overlay{position:absolute;inset:0;background:#fff;border-radius:16px;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.vote-title{font-size:18px;font-weight:bold;color:#1e293b}
.left-card,.short-card{position:relative}
.spec-btn{position:absolute;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:none;background:#2563eb;color:#fff;font-size:18px;font-weight:bold;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.spec-btn:hover{background:#1d4ed8}
.ko-hud{width:100%;margin-bottom:6px;flex:none}
.ko-lives{font-size:16px;text-align:center;margin-bottom:3px}
.ko-bar{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden}
#koBarFill{height:100%;width:100%;background:linear-gradient(90deg,#ef4444,#f59e0b);transition:width .1s linear}
.vote-stage{display:none;flex-direction:column;gap:14px;align-items:center}
.vote-row{display:flex;gap:16px;justify-content:center}
.mode-btn{width:200px;height:150px;border-radius:14px;border:3px solid #cbd5e1;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:bold;color:#334155;cursor:pointer;transition:all .2s;font-family:inherit}
.mode-btn img{width:90px;height:90px;object-fit:contain}
.mode-btn:not(.locked):hover{border-color:#2563eb;background:#eff6ff}
.mode-btn.voted{border-color:#2563eb;background:#dbeafe}
.mode-btn.locked{opacity:.45;cursor:not-allowed}
.mode-lock{font-size:36px}
.vote-count{font-size:12px;color:#2563eb}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(8px);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.card-container{display:flex;gap:20px}
.reward-card{width:200px;height:290px;background:#fff;border-radius:16px;box-shadow:0 20px 25px -5px rgba(0,0,0,.2);border:2px solid #e2e8f0;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;transition:transform .2s,border-color .2s}
.reward-card:hover{transform:translateY(-8px) scale(1.03);border-color:#2563eb}
.reward-card-title{font-size:16px;font-weight:bold;color:#0f172a;text-align:center}
.reward-card-img{width:100px;height:100px;object-fit:contain}
.reward-card-desc{font-size:12px;color:#64748b;text-align:center;word-break:keep-all}
#resultOverlay{--pw:min(1140px,98vw);position:fixed;inset:0;z-index:3000;display:none;flex-direction:column;align-items:center;justify-content:flex-start;background:radial-gradient(ellipse at 50% 25%,#ffffff 0%,#eef2ff 100%);overflow:hidden;font-family:'Malgun Gothic',sans-serif}
#resultOverlay.active{display:flex;animation:resFade 1s ease}
@keyframes resFade{from{opacity:0}to{opacity:1}}
#fxCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
.res-title{color:#1e293b;font-size:4.5vh;font-weight:bold;margin-top:2vh;height:6vh;text-shadow:0 2px 0 #fde68a}
.podium{position:relative;width:var(--pw);height:60vh;margin-top:3vh;display:flex;gap:1.5vh;justify-content:center;align-items:flex-end}
.pod-col{position:relative;flex:1 1 0;max-width:calc((var(--pw) - 3vh) / 3);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.beam{position:absolute;left:50%;top:0;bottom:0;width:170%;transform:translateX(-50%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);background:linear-gradient(to bottom,rgba(250,204,21,.55),rgba(250,204,21,0) 92%);opacity:0;transition:opacity .7s;pointer-events:none}
.r2 .beam{background:linear-gradient(to bottom,rgba(96,165,250,.5),rgba(96,165,250,0) 92%)}
.r3 .beam{background:linear-gradient(to bottom,rgba(251,146,60,.5),rgba(251,146,60,0) 92%)}
.pod-col.on .beam{opacity:1}
.pod-avatar{position:relative;z-index:2;width:18vh;height:18vh;min-width:80px;min-height:80px;object-fit:contain;background:#fff;border-radius:50%;border:.7vh solid #facc15;opacity:0;transform:translateY(-8vh) scale(.5);transition:all .7s cubic-bezier(.2,1.5,.4,1)}
.r2 .pod-avatar{border-color:#cbd5e1}.r3 .pod-avatar{border-color:#fb923c}
.pod-name,.pod-score{position:relative;z-index:2;color:#1e293b;font-weight:bold;text-align:center;opacity:0;transition:opacity .6s .3s;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod-name{font-size:3vh;margin-top:1vh}.pod-score{font-size:2.6vh;color:#b45309;margin-bottom:.8vh}
.pod-col.on .pod-avatar{opacity:1;transform:none;box-shadow:0 0 30px 8px rgba(250,204,21,.6)}
.pod-col.on .pod-name,.pod-col.on .pod-score{opacity:1}
.pod-block{position:relative;z-index:2;width:100%;height:0;border-radius:1.2vh 1.2vh 0 0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:8vh;font-weight:900;color:rgba(255,255,255,.95);text-shadow:0 2px 6px rgba(0,0,0,.25);transition:height .9s cubic-bezier(.2,1,.3,1)}
.r1 .pod-block{background:linear-gradient(#facc15,#a16207)}.r2 .pod-block{background:linear-gradient(#e2e8f0,#64748b)}.r3 .pod-block{background:linear-gradient(#fdba74,#9a3412)}
.pod-col.on.r1 .pod-block{height:32vh}.pod-col.on.r2 .pod-block{height:24vh}.pod-col.on.r3 .pod-block{height:17vh}
/* 조명: 단상 높이에 따라 시작/끝 위치를 다르게 (1등 가장 위, 3등 가장 아래) */
.r1 .beam{top:0;bottom:32vh}
.r2 .beam{top:8vh;bottom:24vh}
.r3 .beam{top:15vh;bottom:17vh}
.res-panel{position:relative;z-index:6;width:var(--pw);margin-top:1vh;height:28vh;display:flex;flex-direction:column;gap:1vh;opacity:0;transform:translateY(5vh);transition:all .7s;pointer-events:none}
.res-panel.on{opacity:1;transform:none;pointer-events:auto}
.res-list{flex:1;min-height:0;overflow-y:auto;background:#fff;border:1px solid #e2e8f0;box-shadow:0 8px 20px rgba(0,0,0,.1);border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-content:start}
.res-team{display:flex;flex-direction:column;gap:6px;min-width:0}
.res-list .rank-item{flex-shrink:0}
.res-lobby{width:100%;padding:1.2vh;font-size:2vh;font-weight:bold;color:#fff;background:#2563eb;border:none;border-radius:10px;cursor:pointer}
.res-lobby:hover{background:#1d4ed8}
#tauntOverlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
#tauntOverlay img{width:95vw;height:95vh;max-width:1400px;max-height:1400px;object-fit:contain;transform:scale(1.8)}
/* 알림: 오른쪽 아래, 흰색 반투명, 클릭은 뒤로 통과 */
#toastBox{position:fixed;bottom:12px;right:12px;z-index:8000;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.75);color:#1e293b;padding:6px 16px 6px 8px;border-radius:12px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.12);border:1px solid rgba(203,213,225,.7);border-left:4px solid var(--tc,#3b82f6);animation:toastIn .25s ease;white-space:nowrap;pointer-events:none}
.toast img{width:30px;height:30px;border-radius:50%;background:#fff;object-fit:contain;flex:none}
.toast b{font-size:13px}.toast span{font-size:12px;color:#475569}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
/* 선택지 알림 (버튼만 클릭 가능) */
.toast.ask{white-space:normal;flex-direction:column;align-items:stretch;gap:8px;padding:10px 14px;background:rgba(255,255,255,.88)}
.toast.ask .ask-btns{display:flex;gap:6px}
.toast.ask button{pointer-events:auto;flex:1;padding:6px 10px;border:none;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer;color:#fff;background:#2563eb;font-family:inherit}
.toast.ask button.no{background:#94a3b8}
.pw-box{background:#fff;border-radius:16px;padding:22px 26px;box-shadow:0 20px 25px -5px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px;align-items:center;min-width:300px}
.pw-title{font-size:16px;font-weight:bold;color:#0f172a;text-align:center;line-height:1.5}
.pw-btn{width:100%;padding:13px;font-family:Consolas,monospace;font-size:18px;font-weight:bold;letter-spacing:2px;background:#0f172a;color:#4ade80;border:none;border-radius:10px;cursor:pointer;transition:all .15s}
.pw-btn:hover{background:#1e293b;transform:scale(1.03)}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:90px;height:90px}
.mode-btn .mini-grid img{width:43px;height:43px}
.mini-grid span{display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;color:#64748b;background:#e2e8f0;border-radius:8px}
.mini-grid span.em{background:#fff;border:1px solid #cbd5e1;font-size:22px}
.mode-emoji{font-size:56px;height:90px;line-height:90px}
#stackView{display:none;flex:1;min-height:0;width:100%;position:relative;border-radius:10px;overflow:hidden;background:#f8fafc}
#stackView #threeContainer{position:absolute;inset:0;width:auto;height:auto;border-radius:0}
.stack-mode .tall-card{height:150px}.stack-mode .short-card{height:326px}
#topView{position:absolute;top:6px;right:6px;z-index:3;background:rgba(255,255,255,.93);border:1px solid #cbd5e1;border-radius:8px;padding:5px 6px;pointer-events:none}
.tv-title{font-size:10px;font-weight:bold;color:#475569;text-align:center;margin-bottom:3px}
.tv-grid{display:grid;grid-template-columns:repeat(3,22px);gap:2px}
.tv-cell{height:22px;background:#e2e8f0;border-radius:3px;font-size:12px;font-weight:bold;color:#1e293b;display:flex;align-items:center;justify-content:center;border:2px solid transparent}
.tv-cell.ok{background:#bbf7d0}.tv-cell.cur{border-color:#f59e0b}
/* 쌓기 모드 조작 패드: 왼쪽 카드 안에 딱 맞게 */
.left-card.stack-left .card-image-container{height:100px}
#stackPad{display:none;flex:1;min-height:0;width:100%;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.pad-row{display:flex;gap:6px}
.pad-btn{width:50px;height:50px;font-size:18px;font-weight:bold;border-radius:12px;border:2px solid #cbd5e1;background:#f8fafc;color:#334155;cursor:pointer;transition:all .1s;flex:none;user-select:none}
.pad-btn:hover{background:#eff6ff;border-color:#2563eb}.pad-btn:active{transform:scale(.92);background:#dbeafe}
.pad-act .pad-btn{width:96px;height:38px;font-size:13px}
.pad-hint{font-size:10px;color:#94a3b8;text-align:center;line-height:1.4}
#bpView{display:none;flex:1;min-height:0;width:100%;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#f8fafc;border-radius:12px}

#voteStage3{flex-direction:row!important;flex-wrap:wrap;justify-content:center;width:430px;gap:8px 16px}
#voteStage3 .vote-row{display:contents}
#voteStage3 .mode-btn{height:96px}
#voteStage3 .mode-emoji{font-size:38px;height:50px;line-height:50px}
#chatBox{display:none;flex:1;min-height:0;flex-direction:column;gap:6px;margin-top:6px}
#chatMsgs{flex:1;min-height:0;overflow-y:auto;background:#f1f2f4;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.chat-row{display:flex;gap:6px;align-items:flex-start}
.chat-row.me{justify-content:flex-end}

/* 콤보 시상대 CSS 삭제됨 */
@keyframes tIn{from{transform:scale(.1) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes tSpin{to{transform:rotate(360deg)}}
#resultOverlay.troll{}
#resultOverlay.troll::before{display:none;content:"";position:absolute;left:50%;top:50%;width:250vmax;height:250vmax;margin:-125vmax 0 0 -125vmax;background:conic-gradient(#f43f5e,#f59e0b,#facc15,#4ade80,#22d3ee,#6366f1,#d946ef,#f43f5e);opacity:.45;animation:tSpin 8s linear infinite;z-index:0;pointer-events:none}
#resultOverlay.troll::after{display:none;content:"";position:absolute;left:50%;bottom:-60vmax;width:120vmax;height:120vmax;margin-left:-60vmax;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.4) 0 8deg,transparent 8deg 20deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 70%);mask:radial-gradient(circle,#000 10%,transparent 70%);animation:tSpin 12s linear infinite reverse;z-index:1;pointer-events:none}
.troll-pod .pod-avatar{width:15vh;height:15vh;min-width:70px;min-height:70px;border-color:#fff}
.troll-pod .pod-col.on .pod-avatar{animation:tBounce .6s ease-in-out infinite alternate;will-change:transform;box-shadow:0 0 24px 6px rgba(217,70,239,.55)}
@keyframes tBounce{from{transform:translateY(0) scale(1)}to{transform:translateY(-2vh) scale(1.1) rotate(5deg)}}
@keyframes tGlow{0%,100%{box-shadow:0 0 30px 10px #f0f}33%{box-shadow:0 0 30px 10px #0ff}66%{box-shadow:0 0 30px 10px #ff0}}
.troll-pod .pod-name{color:#1e293b}

.troll-pod .r1 .pod-block{background:linear-gradient(#f0abfc,#c026d3 50%,#4c1d95);box-shadow:0 0 40px 6px #e879f9}
.troll-pod .r2 .pod-block{background:linear-gradient(#a5f3fc,#06b6d4 50%,#155e75);box-shadow:0 0 30px 4px #22d3ee}
.troll-pod .r3 .pod-block{background:linear-gradient(#fed7aa,#f97316 50%,#7c2d12);box-shadow:0 0 30px 4px #fb923c}

.inf-th button.on{border-color:#2563eb;background:#eff6ff;transform:translateY(-2px)}
@keyframes infP{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes infS{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes infB{from{width:0}to{width:100%}}
/* ===== 튜토리얼: 버튼/설정 시연 화면 ===== */
#tcUi{position:absolute;inset:0;display:none;gap:6px;padding:6px;background:#f1f5f9;border:1px solid #cbd5e1;border-radius:9px;overflow:hidden}
#tcUi.on{display:flex;animation:tutF .3s ease}
.tm-l{width:92px;flex:none;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;font-size:9px;color:#475569}

.tm-r{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}

.tm-c.sm{flex:0 0 40px}

.tm-h em{font-style:normal;font-size:9px;color:#b91c1c;background:#fee2e2;border-radius:10px;padding:0 6px}
.tm-h u{text-decoration:none}
.tm-u{display:flex;align-items:center;gap:5px}
.tm-u img{width:14px;height:14px;border-radius:50%}
.tm-u i{margin-left:auto;font-style:normal;font-size:8px;color:#22c55e}
.tm-b{width:100%;padding:4px 0;border-radius:6px;background:#94a3b8;color:#fff;font-weight:bold;text-align:center;font-size:11px;transition:transform .15s}
.tm-b.red{background:#ef4444}
.prs{transform:scale(.9)}
.tm-vg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.tm-vg div{border:1px solid #e2e8f0;border-radius:6px;text-align:center;font-size:8px;padding:1px;line-height:1.2;transition:all .3s}
.tm-vg img{width:20px;height:20px}
.tm-vg div.top{border-color:#2563eb;background:#dbeafe}
.tm-tabs{display:flex;gap:2px;white-space:nowrap;overflow:hidden}

.tm-tabs b.on{background:#0f172a;color:#fff;border-color:#0f172a}
.tm-rw{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9;padding:2px 0;font-size:10px}
.tm-rw u{text-decoration:none;min-width:28px;text-align:center;border:1px solid #cbd5e1;border-radius:4px;padding:0 4px;transition:all .2s}
.tm-rw u.hl{background:#fef08a;border-color:#eab308}
.tm-pod{display:flex;align-items:flex-end;justify-content:center;gap:4px;flex:1}
.tm-pod div{width:42px;border-radius:4px 4px 0 0;color:#fff;font-weight:bold;text-align:center;height:0;transition:height .7s cubic-bezier(.2,1,.3,1)}
.tm-pod.up .p1{height:46px;background:#eab308}
.tm-pod.up .p2{height:32px;background:#94a3b8}
.tm-pod.up .p3{height:22px;background:#b45309}
.tm-note{position:absolute;right:8px;bottom:6px;background:#22c55e;color:#fff;border-radius:8px;padding:2px 8px;font-size:10px;font-weight:bold;animation:tutF .3s}
.tm-cur{position:absolute;left:0;top:0;z-index:9;pointer-events:none;transform:translate(300px,110px);transition:transform .4s cubic-bezier(.3,.7,.3,1)}
.tkb{display:inline-block;padding:1px 8px;border-radius:6px;background:#0f172a;color:#fff;font-size:10px;font-weight:bold}
.tkb.r{background:#ef4444}
.tdot:nth-child(5){margin-right:6px}
/* ===== 커스텀 프로필 ===== */
.cp-box{flex:none;margin-top:8px;padding:8px 10px;border-radius:14px;background:linear-gradient(135deg,#eef2ff,#fdf4ff);border:1px solid #e0e7ff;display:flex;flex-direction:column;gap:6px}
.cp-head{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:bold;color:#4338ca}
.cp-head span{font-size:10px;font-weight:normal;color:#94a3b8}
.cp-body{display:flex;gap:10px}
.cp-guide{width:216px;flex:none;display:flex;flex-direction:column;gap:4px;align-items:center}
.cp-frame{position:relative;width:100%;height:96px;border-radius:10px;background:#fff;border:2px dashed #c7d2fe;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cp-frame>img{width:100%;height:100%;object-fit:contain;animation:cpIn .35s ease}
.cp-ph{font-size:30px;text-align:center;color:#6366f1;line-height:1.2;animation:cpIn .35s ease}
.cp-ph small{display:block;font-size:10px;color:#64748b}
.cp-cap{font-size:11px;line-height:1.35;color:#334155;text-align:center;min-height:30px;word-break:keep-all}
.cp-dots{display:flex;gap:5px}
.cp-dots i{width:7px;height:7px;border-radius:4px;background:#c7d2fe;cursor:pointer;transition:all .25s}
.cp-dots i.on{width:18px;background:#6366f1}
.cp-mock{width:100%;height:100%;padding:6px 8px;display:flex;flex-direction:column;gap:4px;background:#f8fafc}
.cp-mock-l{font-size:9px;font-weight:bold;color:#64748b}
.cp-mock-in{height:20px;flex:none;border:1px solid #a5b4fc;border-radius:6px;background:#fff;display:flex;align-items:center;padding:0 6px;font:9px Consolas,monospace;color:#0f172a;overflow:hidden;white-space:nowrap}
.cp-car{flex:none;width:1px;height:11px;background:#6366f1;margin-left:1px;animation:tcb 1s steps(1) infinite}
.cp-mock-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.cp-mock-img img{width:38px;height:38px;border-radius:50%;object-fit:contain;background:#fff;border:2px solid #6366f1;box-shadow:0 0 10px rgba(99,102,241,.45)}
.cp-fade{animation:cpIn .35s ease}
.cp-pop{animation:cpPop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes cpIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes cpPop{from{opacity:0;transform:scale(.2) rotate(-15deg)}to{opacity:1;transform:none}}
.cp-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.cp-row{display:flex;gap:6px;align-items:center}
.cp-pv{width:38px;height:38px;border-radius:50%;object-fit:contain;background:#fff;border:2px solid #c7d2fe;flex:none}
.cp-url{flex:1;min-width:0;padding:8px 10px;border:1px solid #c7d2fe;border-radius:8px;font-size:12px;outline:none;background:#fff;margin:0}
.cp-url:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.cp-msg{min-height:28px;font-size:11px;line-height:1.3;color:#64748b;word-break:keep-all}
.cp-msg.ok{color:#16a34a;font-weight:bold}.cp-msg.er{color:#dc2626;font-weight:bold}
.cp-apply{padding:9px;border:none;border-radius:8px;background:linear-gradient(90deg,#6366f1,#8b5cf6);color:#fff;font-weight:bold;font-size:13px;cursor:pointer;font-family:inherit}
.cp-apply:hover{filter:brightness(1.1)}
.cp-site{padding:7px;border:1px solid #c7d2fe;background:#fff;color:#4338ca;border-radius:8px;font-size:12px;font-weight:bold;cursor:pointer;font-family:inherit}
.cp-site:hover{background:#eef2ff}
/* ===== 모드 설명창 개편 ===== */
.right-card-container.info-split>#defaultUserListUI{flex:0 0 56%}
#defaultUserListUI .board-header{justify-content:flex-end;gap:6px}
#defaultUserListUI .board-header .board-title{margin-right:auto}
#infoUI .inf-st{margin-bottom:26px;padding:8px 36px;background:#f8fafc}

#infoUI .inf-st img{width:72px;height:72px}
.inf-x,.inf-open,.inf-all{border:1px solid #cbd5e1;background:#f8fafc;color:#475569;border-radius:10px;font-size:11px;font-weight:bold;padding:2px 10px;cursor:pointer;font-family:inherit}
.inf-x:hover,.inf-open:hover,.inf-all:hover{background:#eff6ff;border-color:#2563eb}
.inf-all{position:absolute;right:12px;bottom:8px;padding:3px 12px}
.inf-grid{display:none;grid-template-columns:repeat(3,1fr);gap:4px;flex:1;min-height:0;overflow-y:auto;margin-bottom:26px;align-content:start}
.inf-cell{display:flex;align-items:center;gap:5px;padding:3px 5px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;min-width:0}
.inf-cell img{width:28px;height:28px;object-fit:contain;flex:none}
.inf-cell b{display:block;font-size:10.5px;color:#1e293b}
/* ===== 로비 채팅 ===== */
#lcBox{display:none;position:relative;flex:1;min-height:0;flex-direction:column;gap:6px}
#lcMsgs{flex:1;min-height:0;overflow-y:auto;background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
#lcMsgs .chat-bub{background:#fff;border-color:#e2e8f0}
#lcMsgs .chat-bub.me{background:#eff6ff;border-color:#bfdbfe}
.lc-in{display:flex;gap:6px;flex:none}
.lc-in input{flex:1;min-width:0;padding:6px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:12px;outline:none;background:#fff;margin:0}
.lc-in button{flex:none;padding:6px 10px;border:none;border-radius:8px;background:#e4e6ea;color:#334155;font-weight:bold;font-size:12px;cursor:pointer;font-family:inherit}
#lcSend{min-width:46px}
#lcEmoPanel{display:none;position:absolute;left:0;right:0;bottom:36px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:8px;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:5}
#lcEmoPanel.on{display:block}
.lc-emo-t{font-size:11px;font-weight:bold;color:#475569;margin-bottom:6px}
.lc-emo-g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.lc-emo-g div{height:34px;border:2px dashed #cbd5e1;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:16px;cursor:pointer}
.lc-emo-g div:hover{border-color:#2563eb;color:#2563eb}
.lc-emo-n{font-size:10px;color:#94a3b8;margin-top:6px}
.right-card-container.info-split>#defaultUserListUI{transition:flex-basis .45s cubic-bezier(.6,0,.3,1),padding .45s,opacity .35s,margin .45s}
.right-card-container.info-split.lc-max>#defaultUserListUI{flex:0 0 0px;padding-top:0;padding-bottom:0;margin-bottom:-10px;opacity:0;pointer-events:none}

#lcEmoPanel{border-radius:14px;border:1px solid #e2e8f0;box-shadow:0 8px 24px rgba(15,23,42,.18);padding:8px;bottom:38px}
#lcEmoPanel.on{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.lc-ec{position:relative;aspect-ratio:1;border:none;border-radius:12px;background:#f1f5f9;padding:4px;cursor:pointer;transition:transform .12s,background .12s}
.lc-ec:hover{background:#dbeafe;transform:translateY(-2px) scale(1.06)}
.lc-ec:active{transform:scale(.94)}
.lc-ec img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.lc-ec i{position:absolute;right:3px;bottom:3px;font-style:normal;font-size:8px;font-weight:bold;color:#fff;background:#64748b;border-radius:6px;padding:0 4px;line-height:12px}
#lcMsgs .chat-row{gap:8px}
.lc-col{display:flex;flex-direction:column;gap:3px;min-width:0;align-items:flex-start}
.lc-col.me{align-items:flex-end}
.lc-col .chat-bub{border-radius:12px}
.lc-col .chat-name + .chat-bub{border-top-left-radius:4px}
.lc-col.me .chat-bub:first-child{border-top-right-radius:4px}
.lc-emo{position:relative;width:84px;height:84px;flex:none}

.lc-emo img,.lc-emo canvas{width:100%;height:100%;object-fit:contain;display:block}
.lc-emo.gif:not(.pl)::after{content:"▶ 재생";position:absolute;right:2px;bottom:2px;font-size:9px;background:rgba(15,23,42,.65);color:#fff;border-radius:8px;padding:1px 6px;pointer-events:none}
/* ===== 카드 번호 · 아이북 질문 · 2인용 ===== */

.ib-t{font-size:20px;font-weight:900;color:#1e293b;line-height:1.5;word-break:keep-all}

.ib-b{display:flex;gap:10px;width:100%;min-height:46px}
.ib-b button{flex:1;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:bold;color:#fff;background:#2563eb;cursor:pointer;font-family:inherit}
.ib-b button.no{background:#94a3b8}
#p2Frame{position:fixed;top:0;right:0;width:50vw;height:100vh;border:none;z-index:50;background:#f1f5f9}
#p2Line{position:fixed;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;background:#334155;z-index:60;pointer-events:none}
#p2Stop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70;padding:8px 12px;border:3px solid #334155;border-radius:20px;background:#fff;color:#b91c1c;font-size:13px;font-weight:bold;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#p2Stop:hover{background:#fee2e2}
body.p2on .modal-overlay,body.p2on #tauntOverlay,body.p2on #resultOverlay{right:50vw}

.inf-cell span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:8.5px;line-height:1.25;color:#64748b;word-break:keep-all}
/* ===== 2인용: 왼쪽 90도 · 오른쪽 270도 (마주 보고 하는 화면) ===== */
body.p2on .modal-overlay,body.p2on #resultOverlay,body.p2on #tauntOverlay,body.p2on #modeReveal,body.p2on #updSplash,
body.p2me .modal-overlay,body.p2me #resultOverlay,body.p2me #tauntOverlay,body.p2me #modeReveal,body.p2me #updSplash{inset:auto!important;right:auto!important;bottom:auto!important;top:50%!important;width:125vh!important;height:100vh!important;--pw:120vh!important}

    const best = mx === 0 ? 'showdown' : top[Math.floor(Math.random() * top.length)];   // 무투표는 쇼다운, 동점은 랜덤
    if (best === 'showdown') { phase = 'vote2'; voteEnd = now + S.voteSec * 1000; sendSoon(); }
    else startMode(best, users);
  }
  else if (phase === 'vote2' && now >= voteEnd) finishVote(users);
  /**/
  else if (gameStarted && gameMode === 'speedrun') { if (users.some(u => !u.inf && (u.score || 0) >= S.score * 15)) teacherEndGame(); }
  /* 숨바꼭질 삭제됨 */
else if (gameStarted && gameMode === 'onehit' && S.koAutoEnd && users.length >= 2) {   // 생존자가 1명 이하면 자동 종료
    if (users.filter(u => !u.dead).length <= 1) { koEndAt = koEndAt || now + 2500; if (now >= koEndAt) { koEndAt = 0; teacherEndGame(); } }
    else koEndAt = 0;
  }
  else if (gameStarted && gameMode === 'bomb') bombHost(users);
  else if (gameStarted && gameMode === 'liar') { if (liarState && !liarState.winner && Date.now() >= liarState.roundEnd) liarResolve(users); }
  else if (gameStarted && gameMode === 'duo') {      // 중간에 들어온 사람은 인원이 적은 팀에 배정
    let changed = false;
    users.forEach(u => {
      if (teams[u.id] !== undefined) return;
      const c = {}; users.forEach(x => { if (teams[x.id] !== undefined) c[teams[x.id]] = (c[teams[x.id]] || 0) + 1; }); const one = Object.keys(c).find(k => c[k] < 2);
      teams[u.id] = one !== undefined ? +one : Math.max(-1, ...Object.keys(c).map(Number)) + 1; changed = true;
    });
    if (changed) sendSoon();
  }
}

/* 숨바꼭질 삭제됨 */
function startMode(mode, users) {
  if (!isTeacher) return;
  gameMode = mode;
  teams = {};
  if (mode === 'duo') {   // 2명씩 팀 (홀수면 남는 1명은 마지막 팀에 합류 → 3명)
    const ids = users.map(u => u.id).sort(() => Math.random() - 0.5), nt = Math.max(1, Math.floor(ids.length / 2));
    ids.forEach((id, i) => { teams[id] = ids.length < 4 ? i % 2 : Math.min(Math.floor(i / 2), nt - 1); });   // 3명 이하면 2팀으로 (서로 공격할 상대가 있게)
  }
  if (mode === 'knockout') {                               // 랜덤으로 섞어 반반 (홀수면 남는 1명은 랜덤 팀)
    const off = Math.random() < 0.5 ? 0 : 1;
    users.map(u => u.id).sort(() => Math.random() - 0.5).forEach((id, i) => { teams[id] = (i + off) % 2; });
  }
  runEnd = 0;
  const session = Date.now();
  koState = mode === 'knockout' ? { session, round: 1, wins: [0, 0], startAt: session, msg: '', over: '' } : null;

  if (mode === 'liar') {
    const ps = users.slice(0, S.liarMax).map(u => u.id);
    liarState = { session, players: ps, liarId: ps[Math.floor(Math.random() * ps.length)], bp: Math.random() * 100 < S.liarBp, round: 1, roundEnd: Date.now() + liarMs(), out: [], msg: '', winner: '', pts: {} };
  }

  if (mode === 'bomb') {
    const al = users.filter(u => !u.dead);
    if (al.length) { const h = al[Math.floor(Math.random() * al.length)]; bombState = { session, holder: h.id, passes: 0, end: Date.now() + 18000, cand: bombCand(users, h.id, 0), seq: 1, msg: '💣 폭탄 모드 시작! 첫 폭탄: ' + (h.nickname || '익명'), kind: '' }; }
  }
  /* 숨바꼭질 삭제됨 */
if (mode === 'coop') {   // 2명씩 팀: 한 명은 설명, 한 명은 쌓기 (홀수면 남는 1명은 마지막 팀의 쌓기)
    const ids = users.map(u => u.id).sort(() => Math.random() - 0.5), ts = [];
    for (let i = 0; i + 1 < ids.length; i += 2) ts.push({ d: ids[i], b: [ids[i + 1]] });
    if (ids.length % 2 && ts.length) ts[ts.length - 1].b.push(ids[ids.length - 1]); else if (ids.length % 2) ts.push({ d: ids[0], b: [] });
    coopState = { session, teams: ts };
  }
  startLocal(session);
  updatePresence();
  try { room.send({ type: 'broadcast', event: 'game_control', payload: { action: 'start', session, mode: gameMode, teams, runEnd, liar: liarState, bomb: bombState, coop: coopState, ko: koState, cfg: cfgDiff() } }); } catch (e) {}
}

  ch.on('broadcast', { event: 'bombboom' }, ({ payload }) => {

}

function generateValidBlocks(lo = S.blkLo, hi = S.blkHi) {
  const blocks = [], grid = {};
  const target = lo + Math.floor(Math.random() * (hi - lo + 1));
  const sx = Math.floor(Math.random() * 2), sy = Math.floor(Math.random() * 2);
  blocks.push({ x: sx, y: sy, z: 0 }); grid[`${sx},${sy},0`] = true;
  while (blocks.length < target) {
    const cands = [];
    for (const b of blocks) {
      for (const n of [{x:b.x+1,y:b.y,z:b.z},{x:b.x-1,y:b.y,z:b.z},{x:b.x,y:b.y+1,z:b.z},{x:b.x,y:b.y-1,z:b.z},{x:b.x,y:b.y,z:b.z+1},{x:b.x,y:b.y,z:b.z-1}]) {
        if (n.x < 0 || n.x > 2 || n.y < 0 || n.y > 2 || n.z < 0 || n.z > 2) continue;
        if (grid[`${n.x},${n.y},${n.z}`]) continue;
        if (n.z !== 0 && !grid[`${n.x},${n.y},${n.z - 1}`]) continue;
        if (!cands.some(c => c.x === n.x && c.y === n.y && c.z === n.z)) cands.push(n);
      }
    }
    if (!cands.length) break;
    const next = cands[Math.floor(Math.random() * cands.length)];
    blocks.push(next); grid[`${next.x},${next.y},${next.z}`] = true;
  }
  return blocks;
}

const emptyH = () => [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
function nextStackProblem() {

function renderStack() {
  if (!blockGroup || !stackGroup) return;

    m.rotation.x = -Math.PI / 2; m.position.set(x, -0.49, y); stackGroup.add(m);
  }

function stackAct(k) {
  if (!stackish() || (gameMode === 'coop' && coopRole() !== 'b') || !gameStarted || isDead || hasGuessed || modalOpen()) return;
  if (['w', 'a', 's', 'd'].includes(k)) {               // 화면(카메라) 기준 방향으로 커서 이동
    const fx = -Math.cos(cameraAngle), fz = -Math.sin(cameraAngle);
    const f = Math.abs(fx) > Math.abs(fz) ? [Math.sign(fx), 0] : [0, Math.sign(fz)], r = [-f[1], f[0]];
    const d = { w: f, s: [-f[0], -f[1]], d: r, a: [-r[0], -r[1]] }[k];
    stackCur.x = Math.max(0, Math.min(2, stackCur.x + d[0])); stackCur.y = Math.max(0, Math.min(2, stackCur.y + d[1]));
  } else if (k === 'add') { if (stackH[stackCur.x][stackCur.y] < 3) stackH[stackCur.x][stackCur.y]++; }

/* ---------- 도면보고 맞추기 ---------- */
function bpCountSet(bl) {   // 위·앞·옆 도면만으로 가능한 블록 개수들 (1개뿐이어야 공정한 문제)
  const H = emptyH(); bl.forEach(b => { H[b.x][b.y]++; });
  const F = [0, 1, 2].map(x => Math.max(...H[x])), S = [0, 1, 2].map(y => Math.max(H[0][y], H[1][y], H[2][y]));
  const cells = []; for (let x = 0; x < 3; x++) for (let y = 0; y < 3; y++) if (H[x][y] > 0) cells.push([x, y, Math.min(F[x], S[y])]);
  const counts = new Set(), cur = emptyH();
  (function rec(i, sum) {
    if (counts.size > 1) return;
    if (i === cells.length) {
      for (let x = 0; x < 3; x++) if (Math.max(...cur[x]) !== F[x]) return;
      for (let y = 0; y < 3; y++) if (Math.max(cur[0][y], cur[1][y], cur[2][y]) !== S[y]) return;
      counts.add(sum); return;
    }
    const [x, y, u] = cells[i];
    for (let h = 1; h <= u; h++) { cur[x][y] = h; rec(i + 1, sum + h); }
    cur[x][y] = 0;
  })(0, 0);
  return counts;
}
function generateBlueprintBlocks() {
  let bl;
  for (let i = 0; i < 300; i++) { bl = generateValidBlocks(); if (bpCountSet(bl).size === 1) return bl; }
  return bl;
}
function drawBlueprint(bl) {
  const H = emptyH(); bl.forEach(b => { H[b.x][b.y]++; });
  const F = [0, 1, 2].map(x => Math.max(...H[x])), S = [0, 1, 2].map(y => Math.max(H[0][y], H[1][y], H[2][y]));
  const C = 26, sq = (c, r, on) => `<rect x="${c * C}" y="${r * C}" width="${C}" height="${C}" fill="${on ? '#60a5fa' : '#fff'}" stroke="${on ? '#1e3a8a' : '#cbd5e1'}" stroke-width="${on ? 2 : 1}"/>`;
  let top = '', front = '', side = '';
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    top += sq(c, r, H[c][2 - r] > 0);      // 위: 가로 x, 세로 y(위쪽이 뒤쪽)
    front += sq(c, r, F[c] >= 3 - r);      // 앞: 가로 x, 세로는 높이
    side += sq(c, r, S[c] >= 3 - r);       // 옆(오른쪽): 가로 y, 세로는 높이
  }
  const panel = (t, cells) => `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="font-size:12px;font-weight:bold;color:#475569;">${t}</div><svg width="${3 * C}" height="${3 * C}">${cells}</svg></div>`;
  $('bpView').innerHTML = `<div style="display:flex;gap:10px;">${panel('위', top)}${panel('앞', front)}${panel('옆', side)}</div><div style="font-size:11px;color:#64748b;">위 · 앞 · 옆(오른쪽)에서 본 모양</div>`;
}
function showBlueprint(on) {
  $('bpView').style.display = on ? 'flex' : 'none';
  $('threeContainer').style.display = on ? 'none' : '';
  $('cameraStatusBadge').innerText = on ? '📐 도면을 보고 맞혀보세요' : defaultBadge();
}
function nextBlueprintProblem() {
  currentBlocks = generateBlueprintBlocks();

  rebuildBlocks(currentBlocks); drawBlueprint(currentBlocks); showBlueprint(true);

/* ===== 폭탄 모드: 폭탄을 넘기다가 시간이 다 되면 터짐 (넘길 때마다 시간 -30%, 최대 8번) ===== */
const bombCand = (us, id, passes, ex) => {   // 살아있는 사람의 1/5만 후보로 보여줌
  if (passes >= 8) return [];
  const al = us.filter(u => !u.dead && u.id !== id && u.id !== ex).map(u => u.id).sort(() => Math.random() - .5);
  return al.slice(0, Math.max(1, Math.ceil(al.length / 5)));
};
function bombNew(us, msg, kind, ex) {
  const al = us.filter(u => !u.dead && u.id !== ex); if (!al.length || !bombState) return;
  const h = al[Math.floor(Math.random() * al.length)];
  bombState = { ...bombState, holder: h.id, passes: 0, end: Date.now() + 15000, cand: bombCand(us, h.id, 0, ex), seq: bombState.seq + 1, msg: msg + ' 새 폭탄: ' + (h.nickname || '익명'), kind }; sendSoon();
}
function bombApply(from, to) {
  const B = bombState; if (!B || B.holder !== from || !B.cand.includes(to) || Date.now() >= B.end) return;
  const passes = B.passes + 1;
  bombState = { ...B, holder: to, passes, end: Date.now() + 15000 * Math.pow(.7, passes), cand: bombCand(activeUsers, to, passes), seq: B.seq + 1, msg: '💣 ' + nameOf(from) + ' → ' + nameOf(to) + ' (' + passes + '번째 · 시간 -30%)', kind: '' }; sendSoon();
}
function bombPass(from, to) {
  if (iAmHost) bombApply(from, to);
  else try { Promise.resolve(room.send({ type: 'broadcast', event: 'bombpass', payload: { from, to, s: currentSession } })).catch(() => {}); } catch (e) {}
}
function bombGive(to) { const B = bombState; if (!B || B.holder !== myId || isDead || !B.cand.includes(to) || hostNow() >= B.end) return; SFX.send(); bombPass(myId, to); }
function bombBoom(id) {
  const f = fakes.find(x => x.id === id); if (f) { f.dead = true; f.lives = 0; f.diedAt = Date.now(); sendSoon(); return; }
  if (id === myId) return bombDie();
  try { Promise.resolve(room.send({ type: 'broadcast', event: 'bombboom', payload: { to: id, s: currentSession } })).catch(() => {}); } catch (e) {}
}
function bombDie() { bombFx(); if (godMode) { bigNotice('🛡 무적으로 버텼어요!', '#22c55e'); return; } forceDie(); }
function bombHost(us) {
  const B = bombState; if (!B) return;
  const now = Date.now(), alive = us.filter(u => !u.dead);
  if (us.length >= 2 && alive.length <= 1) { koEndAt = koEndAt || now + 2500; if (now >= koEndAt) { koEndAt = 0; teacherEndGame(); } return; }
  koEndAt = 0;
  const h = us.find(u => u.id === B.holder);
  if (!h || h.dead) return bombNew(us, '💀 ' + nameOf(B.holder) + ' 탈락!', 'boom', B.holder);
  if (now >= B.end) { bombBoom(B.holder); bombNew(us, '💥 ' + nameOf(B.holder) + ' 님이 폭탄에 터졌어요!', 'boom', B.holder); }
}
function bombTick() {
  const B = bombState; if (!B) return;
  if (B.seq !== lastBombSeq) { lastBombSeq = B.seq; if (B.msg) bigNotice(B.msg, B.kind === 'boom' ? '#b91c1c' : '#f59e0b'); }
  const dur = 15000 * Math.pow(.7, B.passes), l = Math.max(0, B.end - hostNow()), me = B.holder === myId;
  $('koBarFill').style.width = Math.min(100, l / dur * 100) + '%';
  $('koLives').innerText = isDead ? '💀 탈락 · 관전 중' : (me ? '💣 당신이 폭탄! ' : '💣 ' + nameOf(B.holder) + ' · ') + Math.ceil(l / 1000) + '초';
  const sc = Math.ceil(l / 1000); if (me && !isDead && l > 0 && sc <= 5 && sc !== lastTk) { lastTk = sc; SFX.tick(); }
}
function bombRank(users) {
  const B = bombState, me = B.holder === myId && !isDead, T = $('rankingTitle');
  const av = u => `<img src="${esc(u.avatarUrl || characterImages[0])}" class="user-avatar-mini" style="width:24px;height:24px;" alt="">`;
  let html;
  if (me) {
    T.innerHTML = `<span style="color:#ef4444;">💣 넘길 사람을 고르세요! (${8 - B.passes}번 남음)</span>`;
    html = B.cand.map(id => { const u = users.find(x => x.id === id); return u ? `<div class="rank-item selectable" data-bomb="${esc(id)}"><div class="user-info">${av(u)}<span>${esc(u.nickname || '익명')}</span></div><span style="color:#ef4444;font-size:11px;font-weight:bold;">[넘기기]</span></div>` : ''; }).join('') || '<div class="empty-state">더 못 넘겨요! 곧 터져요 💥</div>';
  } else {
    T.innerHTML = '🏆 랭킹';
    html = [...users].sort((a, b) => (a.dead ? 1 : 0) - (b.dead ? 1 : 0) || (b.score || 0) - (a.score || 0)).map((u, i) => `<div class="rank-item"><div class="user-info"><span class="rank-badge ${['rank-1', 'rank-2', 'rank-3'][i] || 'rank-etc'}">${i + 1}등</span>${av(u)}<span>${esc(u.nickname || '익명')}</span></div><span style="color:#64748b;font-size:12px;">${u.dead ? '💀 ' : (u.id === B.holder ? '💣 ' : '')}${fs(u.score)}점</span></div>`).join('');
  }
  const key = 'B' + html; if (key !== lastRankHtml) { $('rankingList').innerHTML = html; lastRankHtml = key; }
}

  const el = document.createElement('div'); el.className = 'toast ask'; el.dataset.p = p.id; el.style.setProperty('--tc', '#2563eb');
  el.innerHTML = `<div style="display:flex;align-items:center;gap:10px"><img src="${esc(p.a || characterImages[0])}" alt=""><div><b>${esc(p.n || '익명')}</b><br><span>2인용으로 하고 싶대요 (아이북 1대로 2명)</span></div></div><div class="ask-btns"><button class="yes">예</button><button class="no">아니요</button></div>`;
  box.appendChild(el); SFX.cardOpen();
  const ans = ok => { el.remove(); try { Promise.resolve(room.send({ type: 'broadcast', event: 'p2ans', payload: { to: p.id, ok } })).catch(() => {}); } catch (e) {} };
  el.querySelector('.yes').onclick = () => ans(true);
  el.querySelector('.no').onclick = () => ans(false);
  setTimeout(() => el.remove(), 30000);
}
function p2Start() {
  if (P2 || p2On) return;
  const f = document.createElement('iframe'); f.id = 'p2Frame';
  const u = new URL(location.href); u.searchParams.set('p2', '1'); u.hash = ''; f.src = u.href;
  document.body.appendChild(f);
  const ln = document.createElement('div'); ln.id = 'p2Line'; document.body.appendChild(ln);
  const b = document.createElement('button'); b.id = 'p2Stop'; b.textContent = '2인용 그만하기'; b.onclick = p2Stop; document.body.appendChild(b);
  p2On = true; document.body.classList.add('p2on'); SFX.unlock(); fitScreen();
  showToast(null, '2인용', '오른쪽에 두 번째 플레이어가 생겼어요!', '#22c55e');
}
function p2Stop() {
  if (!p2On) return;
  const f = $('p2Frame');
  if (f) { f.style.visibility = 'hidden'; try { f.contentWindow.postMessage({ t: 'p2bye' }, '*'); } catch (e) {} }
  ['p2Line', 'p2Stop'].forEach(id => { const x = $(id); if (x) x.remove(); });
  p2On = false; document.body.classList.remove('p2on'); fitScreen(); SFX.pop();
  setTimeout(() => {   // 오른쪽 플레이어가 나갔다고 알린 뒤 화면을 치움 → 유저는 다시 1명
    let pid = ''; try { pid = sessionStorage.getItem('blocksMyId_p2') || ''; } catch (e) {}
    if (f) f.remove(); if (pid && roster.delete(pid)) renderAll();
  }, 700);
}
if (P2) addEventListener('message', e => {   // (오른쪽 화면 쪽) 그만하기 신호를 받으면 접속을 끊음
  if (!e.data || e.data.t !== 'p2bye' || !room) return;
  const r = room; room = null; isSubscribed = false; clearTimeout(reconnectTimer);
  try { Promise.resolve(r.send({ type: 'broadcast', event: 'bye', payload: { id: myId, t: Date.now() } })).catch(() => {}).then(() => supabase.removeChannel(r)); } catch (er) {}
});
addEventListener('keydown', e => {   // 학생이 Ctrl+1 → 선생님께 허락 요청
  if (!(e.ctrlKey && !e.shiftKey && !e.altKey && (e.code === 'Digit1' || e.code === 'Numpad1' || e.key === '1'))) return;
  if (isTeacher || P2) return;
  e.preventDefault(); p2Request();
}, true);
/* ===== "Powered by Netlify" 가 붙은 디스플레이·프레임·버튼 자동 삭제 ===== */
try {
  const RX = /powered\s*by\s*netlify/i, RT = /^\s*powered\s*by\s*netlify\s*$/i;
  document.head.appendChild(Object.assign(document.createElement('style'), { textContent: '[title*="powered by netlify" i],[aria-label*="powered by netlify" i],[alt*="powered by netlify" i]{display:none!important}' }));
  const hit = el => RX.test((el.getAttribute('title') || '') + '|' + (el.getAttribute('aria-label') || '') + '|' + (el.getAttribute('alt') || ''));
  const kill = el => {
    if (!el || !el.isConnected || el === document.body || el === document.documentElement || el === document.head) return;
    const root = el.getRootNode(), par = el.parentElement;
    el.remove();
    if (par && par.tagName === 'A' && !par.children.length && !par.textContent.trim()) par.remove();   // 빈 링크 껍데기도 같이 삭제
    if (root && root.host && !root.children.length) root.host.remove();                                   // 그림자 DOM 껍데기도 같이 삭제
  };
  const sweep = root => {
    try {
      root.querySelectorAll('[title],[aria-label],[alt]').forEach(el => { if (hit(el)) kill(el); });
      root.querySelectorAll('svg > title').forEach(t => { if (RX.test(t.textContent)) kill(t.closest('a,button') || t.parentNode); });
      root.querySelectorAll('a,button,span,div,p,small,footer').forEach(el => { if (el.children.length < 3 && RT.test(el.textContent)) kill(el); });
      root.querySelectorAll('*').forEach(el => { if (el.shadowRoot) sweep(el.shadowRoot); });
    } catch (e) {}
  };
  let tm = 0;
  const later = () => { if (!tm) tm = setTimeout(() => { tm = 0; sweep(document); }, 50); };
  new MutationObserver(ms => { for (const m of ms) if (m.type === 'attributes' || [...m.addedNodes].some(n => n.nodeType === 1)) { later(); break; } })
    .observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['title', 'aria-label', 'alt'] });
  setInterval(() => sweep(document), 1500);
  sweep(document);
} catch (e) { console.error(e); }
/* ===== 비밀 선생님 모드: Ctrl+F1 → 화면 아래에 작게 빛나는 점 → PANdA 입력 → 선생님 권한 (닉네임에 (선생님) 없음 · 내 콘솔 채팅은 다른 선생님에게 안 보냄) ===== */
var stealth = false;
try {
  if (!P2) {
    document.head.appendChild(Object.assign(document.createElement('style'), { textContent:
      '#stDot{position:fixed;left:50%;bottom:6px;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:#7dd3fc;box-shadow:0 0 6px 2px #38bdf8,0 0 16px 4px rgba(56,189,248,.5);z-index:99999;display:none;animation:stGlow 1.5s ease-in-out infinite alternate;transition:background .25s,box-shadow .25s}' +
      '#stDot.on{display:block}' +
      '#stDot.ok{background:#86efac;box-shadow:0 0 8px 3px #22c55e,0 0 24px 8px rgba(34,197,94,.6);animation:none}' +
      '#stDot input{position:absolute;left:-12px;top:-12px;width:31px;height:31px;margin:0;padding:0;border:0;opacity:0;font-size:16px;cursor:pointer}' +
      '@keyframes stGlow{from{opacity:.4;transform:scale(.75)}to{opacity:1;transform:scale(1.3)}}' }));
    const dot = document.createElement('div'); dot.id = 'stDot';
    dot.innerHTML = '<input id="stIn" type="password" autocomplete="off" aria-hidden="true" tabindex="-1">';
    document.body.appendChild(dot);
    const inp = $('stIn'); let hideT = 0;
    const hide = () => { clearTimeout(hideT); dot.className = ''; inp.value = ''; inp.blur(); };
    const arm = () => { clearTimeout(hideT); hideT = setTimeout(hide, 25000); };
    const show = () => { dot.className = 'on'; inp.value = ''; arm(); setTimeout(() => inp.focus(), 0); };
    const stealthOn = () => {
      stealth = true; isTeacher = true;
      $('teacherCode').style.display = 'none'; $('cfgBtn').style.display = 'inline-block';
      if (!hostTeacher(activeUsers)) becomeHost();
      syncNickname(); applyUIState(gameStarted);
      cmdLog('🤫 비밀 선생님 모드: 닉네임에 (선생님) 이 안 붙고, 여기 적는 채팅은 다른 선생님에게 보내지 않아요', 'ok');
    };
    addEventListener('keydown', e => {
      if (!e.ctrlKey || e.shiftKey || e.altKey || e.metaKey || (e.key !== 'F1' && e.code !== 'F1')) return;
      e.preventDefault(); e.stopPropagation();
      if (isTeacher) return hide();
      if (dot.classList.contains('on')) hide(); else show();
    }, true);
    inp.addEventListener('input', () => {
      arm();
      if (isTeacher) return hide();
      if (inp.value.endsWith(TEACHER_CODE)) { inp.value = ''; dot.className = 'on ok'; inp.blur(); stealthOn(); setTimeout(hide, 1200); }
      else if (inp.value.length > 12) inp.value = inp.value.slice(-6);
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Escape') { e.preventDefault(); hide(); } });
  }
} catch (e) { console.error(e); }
applyUIState(false); syncNickname(); fitScreen(); connect(); showUpdate();
