<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 쌓기나무 실시간 클래스</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f1f5f9;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Malgun Gothic',sans-serif;overflow:hidden}
/* 940x530 기준 레이아웃을 JS가 화면 크기에 맞춰 확대/축소함 */
.main-container{display:flex;align-items:center;justify-content:center;gap:20px;padding:20px;width:940px;height:530px;flex-shrink:0;transform-origin:center center}
.card{background:#fff;border-radius:16px;box-shadow:0 10px 25px -5px rgba(0,0,0,.08);border:1px solid #e2e8f0;padding:20px;display:flex;flex-direction:column}
.left-card{width:320px;height:490px;flex-shrink:0;gap:8px}
.card-image-container{width:100%;height:170px;flex:none;display:flex;align-items:center;justify-content:center}
.card-image{width:85%;height:100%;object-fit:contain}
.card-section{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
#gameUI{justify-content:flex-start}
.nickname-section{width:100%;display:flex;flex-direction:column;gap:6px}
.nickname-label{font-size:14px;font-weight:600;color:#475569}
.nickname-input{width:100%;padding:10px 12px;font-size:15px;border:1px solid #cbd5e1;border-radius:8px;outline:none;background:#f8fafc}
.nickname-input:focus{border-color:#2563eb;background:#fff}
#threeContainer{width:100%;flex:1;min-height:0;position:relative;border-radius:12px;overflow:hidden;background:#f8fafc}
#threeContainer canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.game-title-badge{flex:none;font-size:13px;font-weight:bold;color:#1e293b;background:#e2e8f0;padding:4px 12px;border-radius:12px;margin-bottom:6px}
.btn{width:100%;padding:11px;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;transition:all .2s;margin-top:6px;flex:none}
.btn-red{background:#ef4444}.btn-red:hover{background:#dc2626}
.btn-outline{background:#f8fafc;color:#475569;border:1px solid #cbd5e1}.btn-outline:hover{background:#f1f5f9;color:#1e293b}
.teacher-btn-group{width:100%;display:flex;gap:8px;flex:none}
.right-card-container{flex:1;height:490px;display:flex;flex-direction:column}
.right-card{width:100%;height:100%;position:relative}
.board-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f1f5f9}
.board-title{font-size:16px;font-weight:bold;color:#1e293b}
.online-count-badge{background:#fee2e2;color:#b91c1c;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;display:flex;align-items:center;gap:6px}
.transparent-code-input{width:56px;border:none;background:transparent;outline:none;font-size:12px;color:#b91c1c;font-weight:600;text-align:center}
.live-dot{width:8px;height:8px;background:#ef4444;border-radius:50%}
.user-list-container{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.user-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#f8fafc;border-radius:10px;border:1px solid #f1f5f9}
.user-info{display:flex;align-items:center;gap:10px}
.user-avatar-mini{width:32px;height:32px;border-radius:50%;object-fit:contain;background:#fff;border:1px solid #cbd5e1}
.user-name{font-size:14px;font-weight:600;color:#334155}
.profile-grid-container{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-right:4px}
.profile-thumb-card{background:#f8fafc;border:2px solid #e2e8f0;border-radius:10px;padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.profile-thumb-card:hover{border-color:#2563eb;background:#eff6ff;transform:scale(1.03)}
.profile-thumb-img{width:100%;height:65px;object-fit:contain}
.game-right-layout{width:100%;height:100%;display:flex;flex-direction:column;gap:14px}
.tall-card{height:280px}
.short-card{height:196px;justify-content:space-between;align-items:center;text-align:center}
.rank-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;flex:1;overflow-y:auto;padding-right:4px}
.rank-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#f8fafc;border-radius:8px;font-size:13px;font-weight:600;flex-shrink:0}
.rank-item.selectable{cursor:pointer;border:1px solid #cbd5e1;background:#fff}
.rank-item.selectable:hover{background:#f1f5f9;border-color:#2563eb}
.rank-badge{padding:2px 8px;border-radius:12px;color:#fff;font-size:11px}
.rank-1{background:#eab308}.rank-2{background:#94a3b8}.rank-3{background:#b45309}.rank-etc{background:#cbd5e1;color:#475569}
.quiz-title{font-size:15px;font-weight:bold;color:#1e293b}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.choice-btn{padding:12px;font-size:15px;font-weight:bold;background:#f1f5f9;color:#334155;border:1px solid #cbd5e1;border-radius:8px;cursor:pointer;transition:all .2s}
.choice-btn:hover{background:#e2e8f0}
@keyframes btnGlowAnim{0%{box-shadow:0 0 5px #3b82f6;border-color:#3b82f6}50%{box-shadow:0 0 15px #60a5fa,0 0 10px #2563eb;border-color:#2563eb}100%{box-shadow:0 0 5px #3b82f6;border-color:#3b82f6}}
.choice-btn.glowing-choice{animation:btnGlowAnim 1.2s infinite alternate;background:#eff6ff!important;color:#1d4ed8!important}
.choice-btn.correct{background:#22c55e!important;color:#fff!important;border-color:#16a34a!important;animation:none!important}
.choice-btn.wrong{background:#ef4444!important;color:#fff!important;border-color:#dc2626!important;animation:none!important}
.feedback-msg{font-size:13px;font-weight:bold;height:18px}
.empty-state{margin:auto;color:#94a3b8;font-size:13px}
/* 모드 투표 오버레이 (접속자 카드를 하얗게 덮음) */
.vote-overlay{position:absolute;inset:0;background:#fff;border-radius:16px;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.vote-title{font-size:18px;font-weight:bold;color:#1e293b}
.vote-stage{display:none;flex-direction:column;gap:14px;align-items:center}
.vote-row{display:flex;gap:16px;justify-content:center}
.mode-btn{width:200px;height:150px;border-radius:14px;border:3px solid #cbd5e1;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:bold;color:#334155;cursor:pointer;transition:all .2s;font-family:inherit}
.mode-btn img{width:90px;height:90px;object-fit:contain}
.mode-btn:not(.locked):hover{border-color:#2563eb;background:#eff6ff}
.mode-btn.voted{border-color:#2563eb;background:#dbeafe}
.mode-btn.locked{opacity:.45;cursor:not-allowed}
.mode-lock{font-size:36px}
.vote-count{font-size:12px;color:#2563eb}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(8px);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.card-container{display:flex;gap:20px}
.reward-card{width:200px;height:290px;background:#fff;border-radius:16px;box-shadow:0 20px 25px -5px rgba(0,0,0,.2);border:2px solid #e2e8f0;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;transition:transform .2s,border-color .2s}
.reward-card:hover{transform:translateY(-8px) scale(1.03);border-color:#2563eb}
.reward-card-title{font-size:16px;font-weight:bold;color:#0f172a;text-align:center}
.reward-card-img{width:100px;height:100px;object-fit:contain}
.reward-card-desc{font-size:12px;color:#64748b;text-align:center;word-break:keep-all}
#resultOverlay{position:fixed;inset:0;z-index:3000;display:none;flex-direction:column;align-items:center;justify-content:flex-start;background:radial-gradient(ellipse at 50% 25%,#ffffff 0%,#eef2ff 100%);overflow:hidden;font-family:'Malgun Gothic',sans-serif}
#resultOverlay.active{display:flex;animation:resFade 1s ease}
@keyframes resFade{from{opacity:0}to{opacity:1}}
#fxCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.res-title{color:#1e293b;font-size:4.5vh;font-weight:bold;margin-top:2vh;height:6vh;text-shadow:0 2px 0 #fde68a}
.podium{position:relative;width:min(1200px,98vw);height:58vh;display:flex;gap:1.5vh;justify-content:center;align-items:flex-end}
.pod-col{position:relative;flex:1 1 0;max-width:380px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.beam{position:absolute;left:50%;top:0;bottom:0;width:170%;transform:translateX(-50%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);background:linear-gradient(to bottom,rgba(250,204,21,.55),rgba(250,204,21,0) 92%);opacity:0;transition:opacity .7s;pointer-events:none}
.r2 .beam{background:linear-gradient(to bottom,rgba(96,165,250,.5),rgba(96,165,250,0) 92%)}
.r3 .beam{background:linear-gradient(to bottom,rgba(251,146,60,.5),rgba(251,146,60,0) 92%)}
.pod-col.on .beam{opacity:1}
.pod-avatar{position:relative;z-index:2;width:17vh;height:17vh;min-width:80px;min-height:80px;object-fit:contain;background:#fff;border-radius:50%;border:.7vh solid #facc15;opacity:0;transform:translateY(-8vh) scale(.5);transition:all .7s cubic-bezier(.2,1.5,.4,1)}
.r2 .pod-avatar{border-color:#cbd5e1}.r3 .pod-avatar{border-color:#fb923c}
.pod-name,.pod-score{position:relative;z-index:2;color:#1e293b;font-weight:bold;text-align:center;opacity:0;transition:opacity .6s .3s;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod-name{font-size:3vh;margin-top:1vh}.pod-score{font-size:2.6vh;color:#b45309;margin-bottom:.8vh}
.pod-col.on .pod-avatar{opacity:1;transform:none;box-shadow:0 0 30px 8px rgba(250,204,21,.6)}
.pod-col.on .pod-name,.pod-col.on .pod-score{opacity:1}
.pod-block{position:relative;z-index:2;width:100%;height:0;border-radius:1.2vh 1.2vh 0 0;display:flex;align-items:center;justify-content:center;font-size:8vh;font-weight:900;color:rgba(255,255,255,.95);text-shadow:0 2px 6px rgba(0,0,0,.25);transition:height .9s cubic-bezier(.2,1,.3,1)}
.r1 .pod-block{background:linear-gradient(#facc15,#a16207)}.r2 .pod-block{background:linear-gradient(#e2e8f0,#64748b)}.r3 .pod-block{background:linear-gradient(#fdba74,#9a3412)}
.pod-col.on.r1 .pod-block{height:30vh}.pod-col.on.r2 .pod-block{height:22vh}.pod-col.on.r3 .pod-block{height:16vh}
.res-panel{position:relative;z-index:6;width:min(640px,94vw);margin-top:1vh;height:24vh;display:flex;flex-direction:column;gap:1vh;opacity:0;transform:translateY(5vh);transition:all .7s;pointer-events:none}
.res-panel.on{opacity:1;transform:none;pointer-events:auto}
.res-list{flex:1;min-height:0;overflow-y:auto;background:#fff;border:1px solid #e2e8f0;box-shadow:0 8px 20px rgba(0,0,0,.1);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.res-list .rank-item{flex-shrink:0}
.res-lobby{width:100%;padding:1.2vh;font-size:2vh;font-weight:bold;color:#fff;background:#2563eb;border:none;border-radius:10px;cursor:pointer}
.res-lobby:hover{background:#1d4ed8}
#tauntOverlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
#tauntOverlay img{width:95vw;height:95vh;max-width:1400px;max-height:1400px;object-fit:contain;transform:scale(1.8)}
</style>
</head>
<body>
<div class="main-container" id="mainContainer">
  <div class="card left-card">
    <div class="card-image-container"><img id="cardImage" alt="캐릭터" class="card-image"></div>

    <div id="normalUI" class="card-section">
      <div class="nickname-section">
        <label for="nickname" class="nickname-label">닉네임</label>
        <input type="text" id="nickname" class="nickname-input" placeholder="이름을 입력하세요" maxlength="12" autocomplete="off">
        <button id="changeProfileBtn" class="btn btn-outline">📸 프로필 사진 변경</button>
      </div>
    </div>

    <div id="gameUI" class="card-section" style="display:none;">
      <div class="game-title-badge" id="cameraStatusBadge">3D 관찰 카메라 회전 중</div>
      <div id="threeContainer"></div>
    </div>

    <div id="teacherControls" class="teacher-btn-group" style="display:none;">
      <button id="endBtn" class="btn btn-red">종료</button>
    </div>
    <button id="startBtn" class="btn btn-red" style="display:none;">시작</button>
  </div>

  <div class="right-card-container">
    <div id="defaultUserListUI" class="card right-card">
      <div class="board-header">
        <div class="board-title">실시간 실제 접속자 현황</div>
        <div class="online-count-badge">
          <div class="live-dot"></div>
          <span id="onlineCountText">접속중 0명</span>
          <input type="password" id="teacherCode" class="transparent-code-input" placeholder="코드" autocomplete="new-password">
        </div>
      </div>
      <div class="user-list-container" id="userListContainer"><div class="empty-state">접속자를 감지하는 중...</div></div>

      <div class="vote-overlay" id="voteOverlay">
        <div class="vote-title">게임 모드 투표 ⏱ <span id="voteTimer">3</span>초</div>
        <div class="vote-stage" id="voteStage1">
          <div class="vote-row">
            <button class="mode-btn" id="showdownBtn"><img src="https://media.ffycdn.net/eu/supercell/jMsj2Hr31RAw62EHKQQn.png?width=2400" alt="쇼다운"><span>쇼다운</span><span class="vote-count" id="showdownCount">0표</span></button>
            <button class="mode-btn locked" disabled><span class="mode-lock">🔒</span><span>준비중</span></button>
          </div>
          <div class="vote-row"><button class="mode-btn locked" disabled><span class="mode-lock">🔒</span><span>준비중</span></button></div>
        </div>
        <div class="vote-stage" id="voteStage2">
          <div class="vote-row">
            <button class="mode-btn" id="soloBtn"><img src="https://media.ffycdn.net/eu/supercell/jMsj2Hr31RAw62EHKQQn.png?width=2400" alt="솔로 쇼다운"><span>솔로 쇼다운</span><span class="vote-count" id="soloCount">0표</span></button>
            <button class="mode-btn" id="duoBtn"><img src="https://gcdnb.pbrd.co/images/B1HRT4kn89U_.png" alt="듀오 쇼다운"><span>듀오 쇼다운</span><span class="vote-count" id="duoCount">0표</span></button>
          </div>
        </div>
      </div>
    </div>

    <div id="profilePickerUI" class="card right-card" style="display:none;">
      <div class="board-header">
        <div class="board-title">📸 프로필 사진 선택</div>
        <button id="closeProfilePickerBtn" style="border:none;background:none;cursor:pointer;font-size:13px;color:#64748b;font-weight:bold;">닫기 ✕</button>
      </div>
      <div class="profile-grid-container" id="profileGrid"></div>
    </div>

    <div id="gameRankingUI" class="game-right-layout" style="display:none;">
      <div class="card tall-card">
        <div class="board-title" id="rankingTitle">플레이어 랭킹</div>
        <div class="rank-list" id="rankingList"></div>
      </div>
      <div class="card short-card">
        <div class="quiz-title">쌓기나무는 모두 몇 개일까요?</div>
        <div class="choice-grid" id="choiceButtons"></div>
        <div id="feedbackMessage" class="feedback-msg"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="cardModalOverlay"><div class="card-container" id="cardContainer"></div></div>
<div id="resultOverlay">
  <canvas id="fxCanvas"></canvas>
  <div class="res-title"> </div>
  <div class="podium" id="podium"></div>
  <div class="res-panel" id="resPanel"><div class="res-list" id="resList"></div><button class="res-lobby" id="lobbyBtn">로비로</button></div>
</div>
<div id="tauntOverlay"><img src="https://media.tenor.com/dpjhz7THIK8AAAAj/brawl-stars-thumbs-down.gif" alt="야유"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient("https://knjblcpgxcixfbzcrrqg.supabase.co", "sb_publishable_Xn2UjMtIkzXQU_6xPlMvrg_Rtc9VY0v", { realtime: { worker: true } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const myId = 'user_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const GAME_CARD_IMAGE = "https://media.ffycdn.net/eu/supercell/w6fRpxtAdEXsWLjHEzHD.png?width=2400";
const characterImages = [
  "B9aSwkAt73UKJgmPgSun","QnZRLnpy7ckitzeuASFz","S6nkFKmpdZs1c8qRUo8f","tTtXs4ftdtuBh85yq9tY",
  "s83nEEJ4ZKPXzgKjDrF3","HDkXgubferFDkbkHJAXo","w6fRpxtAdEXsWLjHEzHD","aVJ7E8hmdXBjNbT9CHeM",
  "m823rLr57CeLZdx2ivfZ","6PVSgKBY4KNpkabWr9bj","fTRckDCnv8CLTEMDi3tt","6jGjY3JAbFrkSx4FaiVH",
  "Qmxk7V5tFcmLGeCVueWT","XTTrodLDSVQVrjhYbs2Z","ACfDodL3WGgMD3ybdHvn","7a6mrhbBHByusVgTvkoS"
].map(id => `https://media.ffycdn.net/eu/supercell/${id}.png?width=2400`);

const SC = id => `https://media.ffycdn.net/eu/supercell/${id}.png?width=2400`;
const cardImages = [SC('XMEic2GRdS2qq7GJaEiB'), SC('TGQBtafzmsdeiJwZSmpo'), SC('ET4DYhvXCLzJPiw96NtX'),
  'https://media1.tenor.com/m/ZINlqqwHYQ4AAAAC/brawl-stars-brawl-stars-emoji.gif',
  'https://media.tenor.com/dpjhz7THIK8AAAAj/brawl-stars-thumbs-down.gif',
  SC('6UFbyzBNqp1V5z9EASqM'), SC('Cz9rD81f7Qrva9kzgZvA'), SC('Y7xeUH3uBvNkQBzSXkA6')];
const profileImages = [...characterImages, ...cardImages];
let selectedImage = characterImages[Math.floor(Math.random() * characterImages.length)];
$('cardImage').src = selectedImage;

let isTeacher = false, myNickname = '익명', gameStarted = false, myScore = 0;
let currentBlocks = [], currentSession = 0, hasGuessed = false, activeUsers = [];
let pendingAttackType = null, isTargetSelectMode = false;
let isCameraFrozen = false, hasTripleScoreMultiplier = false, hasShiningEyesBuff = false, activeShiningEyesRound = false;
// 모드 투표 상태
let phase = '', voteEnd = 0, myVote = '', curStage = '', gameMode = 'solo', teams = {}, resultData = null;
const TEAM_NAMES = ['🔴 레드팀', '🔵 블루팀'], TEAM_COLORS = ['#ef4444', '#2563eb'];
let uiScale = 1;

const joinedAt = Date.now();
const HEARTBEAT_MS = 10000, STALE_MS = 25000;
let isSubscribed = false, room = null, presenceTimer = null, reconnectTimer = null, helloTimer = null;
let lastCollectAt = 0, graceUntil = 0, lastConnectAt = 0, hiddenAt = 0, noTeacherSince = 0;
let lastListHtml = '', lastRankHtml = '';
const roster = new Map();

/* ---------- 화면 크기에 맞춰 UI 확대/축소 ---------- */
function fitScreen() {
  uiScale = Math.min(window.innerWidth / 960, window.innerHeight / 550);
  uiScale = Math.max(0.4, Math.min(uiScale, 3));
  $('mainContainer').style.transform = `scale(${uiScale})`;
  if (renderer) { renderer.setPixelRatio(Math.min((window.devicePixelRatio || 1) * uiScale, 3)); if (resizeThree) resizeThree(); }
}
window.addEventListener('resize', fitScreen);

/* ---------- 접속자 동기화 ---------- */
function getMyPayload() {
  return {
    id: myId, nickname: myNickname, avatarUrl: selectedImage, score: myScore,
    isTeacher, gameStarted: isTeacher && gameStarted,
    phase: isTeacher ? phase : '', voteEnd: isTeacher ? voteEnd : 0, session: isTeacher ? currentSession : 0,
    mode: isTeacher ? gameMode : '', teams: isTeacher ? teams : null, result: isTeacher ? resultData : null,
    vote: myVote,
    joinedAt, hb: Date.now()
  };
}

function syncNickname() {
  const base = $('nickname').value.trim();
  const name = base || (isTeacher ? '선생님' : '익명');
  myNickname = isTeacher ? `(선생님) ${name}` : name;
  updatePresence();
}

function updatePresence() {
  renderAll();
  clearTimeout(presenceTimer);
  presenceTimer = setTimeout(sendState, 200);
}

async function sendState() {
  const ch = room;
  if (!isSubscribed || !ch) return;
  try { await ch.send({ type: 'broadcast', event: 'state', payload: getMyPayload() }); }
  catch (e) { console.warn('상태 전송 실패', e); }
}

function receiveState(u) {
  if (!u || !u.id || u.id === myId) return;
  const prev = roster.get(u.id);
  if (prev && (prev.user.hb || 0) > (u.hb || 0)) return;
  roster.set(u.id, { user: u, at: Date.now() });
  renderAll();
}

function collectUsers() {
  const now = Date.now();
  if (now - lastCollectAt > 4000 || now < graceUntil) roster.forEach(r => { r.at = now; });
  lastCollectAt = now;
  roster.forEach((r, id) => { if (now - r.at > STALE_MS) roster.delete(id); });
  const list = [...roster.values()].map(r => r.user);
  list.push(getMyPayload());
  return list.sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0) || String(a.id).localeCompare(String(b.id)));
}

function renderAll() {
  const users = collectUsers();
  activeUsers = users;
  if (!isTeacher) {
    const t = users.find(u => u.isTeacher);
    if (t) {
      noTeacherSince = 0;
      if (t.gameStarted) { gameMode = t.mode || 'solo'; teams = t.teams || {}; if (t.session && t.session !== currentSession) startLocal(t.session); }
      else { if (gameStarted) endGameLocal(); if (t.result && t.result.session === currentSession) showResult(t.result); }
    } else if (gameStarted) {
      noTeacherSince = noTeacherSince || Date.now();
      if (Date.now() - noTeacherSince > 30000) endGameLocal();
    }
  }
  teacherTick(users);
  renderVote(users);
  renderUserList(users);
  renderRankingList(users);
}

/* 게임 시작(각자 자기 문제로 진행) */
function startLocal(session) {
  currentSession = session;
  gameStarted = true; myVote = ''; phase = isTeacher ? 'play' : phase; myScore = 0; resultData = null; isTargetSelectMode = false;
  applyUIState(true);
  nextProblem();
}

/* 나만의 다음 문제 */
function nextProblem() {
  if (!gameStarted) return;
  currentBlocks = generateValidBlocks();
  activeShiningEyesRound = hasShiningEyesBuff;
  hasShiningEyesBuff = false;
  rebuildBlocks(currentBlocks);
  setupChoices(currentBlocks.length);
}

function endGameLocal() {
  gameStarted = false; currentBlocks = []; phase = ''; myVote = ''; teams = {}; gameMode = 'solo';
  $('cardModalOverlay').classList.remove('active'); isTargetSelectMode = false; pendingAttackType = null;
  activeShiningEyesRound = false; hasShiningEyesBuff = false;
  applyUIState(false);
}

/* ---------- 모드 투표 (선생님 화면의 워커 타이머로 진행 → 다른 앱에 있어도 진행됨) ---------- */
function sendSoon() { clearTimeout(presenceTimer); presenceTimer = setTimeout(sendState, 200); }

function teacherTick(users) {
  if (!isTeacher) return;
  const now = Date.now();
  if (phase === 'vote1' && now >= voteEnd) { phase = 'vote2'; voteEnd = now + 3000; sendSoon(); }
  else if (phase === 'vote2' && now >= voteEnd) finishVote(users);
  else if (gameStarted && gameMode === 'duo') {      // 중간에 들어온 사람은 인원이 적은 팀에 배정
    let changed = false;
    users.forEach(u => {
      if (teams[u.id] !== undefined) return;
      const c = [0, 0]; users.forEach(x => { if (teams[x.id] !== undefined) c[teams[x.id]]++; });
      teams[u.id] = c[0] <= c[1] ? 0 : 1; changed = true;
    });
    if (changed) sendSoon();
  }
}

function renderVote(users) {
  const t = users.find(u => u.isTeacher);
  const stage = (t && !gameStarted) ? t.phase : '';
  const active = stage === 'vote1' || stage === 'vote2';
  curStage = active ? stage : '';
  $('voteOverlay').style.display = active ? 'flex' : 'none';
  $('startBtn').style.display = (isTeacher && !gameStarted && !active) ? 'block' : 'none';
  if (!active) return;
  $('profilePickerUI').style.display = 'none';
  $('defaultUserListUI').style.display = 'flex';
  $('voteStage1').style.display = stage === 'vote1' ? 'flex' : 'none';
  $('voteStage2').style.display = stage === 'vote2' ? 'flex' : 'none';
  $('voteTimer').innerText = Math.max(0, Math.ceil((t.voteEnd - Date.now()) / 1000));
  const cnt = k => users.filter(u => u.vote === stage + ':' + k).length + '표';
  const mark = (id, k) => $(id).classList.toggle('voted', myVote === stage + ':' + k);
  if (stage === 'vote1') { $('showdownCount').innerText = cnt('showdown'); mark('showdownBtn', 'showdown'); }
  else { $('soloCount').innerText = cnt('solo'); $('duoCount').innerText = cnt('duo'); mark('soloBtn', 'solo'); mark('duoBtn', 'duo'); }
}

function finishVote(users) {
  if (!isTeacher || phase !== 'vote2') return;
  const c = k => users.filter(u => u.vote === 'vote2:' + k).length;
  gameMode = c('duo') > c('solo') ? 'duo' : 'solo';   // 동점/무투표는 솔로
  teams = {};
  if (gameMode === 'duo') {                           // 랜덤으로 섞어 반반 (홀수면 남는 1명은 랜덤 팀)
    const off = Math.random() < 0.5 ? 0 : 1;
    users.map(u => u.id).sort(() => Math.random() - 0.5).forEach((id, i) => { teams[id] = (i + off) % 2; });
  }
  const session = Date.now();
  startLocal(session);
  updatePresence();
  try { room.send({ type: 'broadcast', event: 'game_control', payload: { action: 'start', session, mode: gameMode, teams } }); } catch (e) {}
}

async function connect() {
  lastConnectAt = Date.now(); graceUntil = lastConnectAt + 6000;
  const old = room;
  room = null; isSubscribed = false;
  if (old) { try { await supabase.removeChannel(old); } catch (e) {} }
  const ch = room = supabase.channel('blocks-class-room-v4', { config: { broadcast: { self: false } } });

  ch.on('broadcast', { event: 'state' }, ({ payload }) => receiveState(payload));
  ch.on('broadcast', { event: 'hello' }, ({ payload }) => {
    if (!payload || payload.id === myId || helloTimer) return;
    helloTimer = setTimeout(() => { helloTimer = null; sendState(); }, Math.random() * 2500);
  });
  ch.on('broadcast', { event: 'bye' }, ({ payload }) => { if (payload && roster.delete(payload.id)) renderAll(); });

  ch.on('broadcast', { event: 'game_control' }, ({ payload }) => {
    if (isTeacher) return;
    if (payload.action === 'end') { endGameLocal(); if (payload.result && payload.result.session === currentSession) showResult(payload.result); }
    else if (payload.action === 'start' && payload.session !== currentSession) { gameMode = payload.mode || 'solo'; teams = payload.teams || {}; startLocal(payload.session); }
  });

  ch.on('broadcast', { event: 'attack_event' }, ({ payload }) => {
    if (payload.targetId !== myId) return;
    if (gameMode === 'duo' && teams[payload.fromId] === teams[myId]) return;   // 같은 팀은 공격 불가
    if (payload.type === 'glitch') triggerGlitchEffect();
    else if (payload.type === 'taunt') triggerTauntEffect();
    else if (payload.type === 'freeze') triggerFreezeEffect();
  });

  ch.subscribe(status => {
    if (ch !== room) return;
    if (status === 'SUBSCRIBED') {
      clearTimeout(reconnectTimer); isSubscribed = true;
      Promise.resolve(ch.send({ type: 'broadcast', event: 'hello', payload: { id: myId } })).catch(() => {});
      sendState(); renderAll();
    } else if (['CLOSED', 'CHANNEL_ERROR', 'TIMED_OUT'].includes(status)) {
      isSubscribed = false;
      clearTimeout(reconnectTimer); reconnectTimer = setTimeout(connect, 4000);
    }
  });
}

function onTick(t) {
  if (t === 'h') { if (!isSubscribed && Date.now() - lastConnectAt > 8000) connect(); else sendState(); }
  else renderAll();
}
function startTicker() {
  let fell = false;
  const fallback = () => { if (fell) return; fell = true; setInterval(() => onTick('r'), 1000); setInterval(() => onTick('h'), HEARTBEAT_MS); };
  try {
    const src = `setInterval(()=>postMessage('r'),1000);setInterval(()=>postMessage('h'),${HEARTBEAT_MS});`;
    const w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    w.onmessage = e => onTick(e.data);
    w.onerror = () => { try { w.terminate(); } catch (e) {} fallback(); };
  } catch (e) { fallback(); }
}
startTicker();

function revive() {
  const away = hiddenAt ? Date.now() - hiddenAt : 0; hiddenAt = 0;
  if (!isSubscribed || away > 5000) connect(); else { sendState(); renderAll(); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) hiddenAt = Date.now(); else revive(); });
window.addEventListener('online', () => connect());
window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
window.addEventListener('pagehide', () => {

});

/* ---------- 문제 / 카드 ---------- */
function generateValidBlocks() {
  const blocks = [], grid = {};
  const target = Math.floor(Math.random() * 5) + 5;
  const sx = Math.floor(Math.random() * 2), sy = Math.floor(Math.random() * 2);
  blocks.push({ x: sx, y: sy, z: 0 }); grid[`${sx},${sy},0`] = true;
  while (blocks.length < target) {
    const cands = [];
    for (const b of blocks) {
      for (const n of [{x:b.x+1,y:b.y,z:b.z},{x:b.x-1,y:b.y,z:b.z},{x:b.x,y:b.y+1,z:b.z},{x:b.x,y:b.y-1,z:b.z},{x:b.x,y:b.y,z:b.z+1},{x:b.x,y:b.y,z:b.z-1}]) {
        if (n.x < 0 || n.x > 2 || n.y < 0 || n.y > 2 || n.z < 0 || n.z > 2) continue;
        if (grid[`${n.x},${n.y},${n.z}`]) continue;
        if (n.z !== 0 && !grid[`${n.x},${n.y},${n.z - 1}`]) continue;
        if (!cands.some(c => c.x === n.x && c.y === n.y && c.z === n.z)) cands.push(n);
      }
    }
    if (!cands.length) break;
    const next = cands[Math.floor(Math.random() * cands.length)];
    blocks.push(next); grid[`${next.x},${next.y},${next.z}`] = true;
  }
  return blocks;
}

  [...set].sort(() => Math.random() - 0.5).forEach(num => {

    btn.innerText = `${num}개`;
    btn.addEventListener('click', () => {

        else fb.innerText = '정답입니다! 카드 보상을 선택하세요.';

/* ---------- 공격 효과 ---------- */
let glitchTimer = null;
function triggerGlitchEffect() {
  if (!scene || !glitchGroup) return;
  while (glitchGroup.children.length) glitchGroup.remove(glitchGroup.children[0]);
  glitchMeshes = [];
  const geo = new THREE.BoxGeometry(1, 1, 1), count = (Math.floor(Math.random() * 8) + 5) * 3;

    m.position.set(Math.random() * 4 - 1, Math.random() * 3, Math.random() * 4 - 1);
    glitchGroup.add(m); glitchMeshes.push(m);
  }
  clearTimeout(glitchTimer);
  glitchTimer = setTimeout(() => { while (glitchGroup.children.length) glitchGroup.remove(glitchGroup.children[0]); glitchMeshes = []; }, 4000);
}
function triggerTauntEffect() {

function triggerFreezeEffect() {

/* ---------- 3D ---------- */
let scene, camera, renderer, blockGroup, outlineGroup, glitchGroup, glitchMeshes = [], cameraAngle = 0, isThreeInitialized = false, resizeThree = null;

function initThreeOnce() {
  if (isThreeInitialized) return;
  isThreeInitialized = true;
  const container = $('threeContainer');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf8fafc);
  camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min((window.devicePixelRatio || 1) * uiScale, 3));
  container.appendChild(renderer.domElement);
  resizeThree = () => {
    const w = container.clientWidth, h = container.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  };
  resizeThree();
  new ResizeObserver(resizeThree).observe(container);

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dir = new THREE.DirectionalLight(0xffffff, 0.5);
  dir.position.set(10, 20, 15); scene.add(dir);

  blockGroup = new THREE.Group(); outlineGroup = new THREE.Group(); glitchGroup = new THREE.Group();
  scene.add(blockGroup, outlineGroup, glitchGroup);
  if (currentBlocks.length) rebuildBlocks(currentBlocks);

  (function animate() {
    requestAnimationFrame(animate);
    if (!isCameraFrozen) cameraAngle += 0.012;
    const r = 9.5;
    camera.position.set(1 + r * Math.cos(cameraAngle), 6.5, 1 + r * Math.sin(cameraAngle));
    camera.lookAt(1, 0.9, 1);
    glitchMeshes.forEach(m => m.material.color.setHex(Math.random() * 0xffffff));
    renderer.render(scene, camera);
  })();
}

function rebuildBlocks(blocks) {
  if (!blockGroup || !outlineGroup) return;
  [blockGroup, outlineGroup].forEach(g => { while (g.children.length) g.remove(g.children[0]); });
  const geo = new THREE.BoxGeometry(1, 1, 1), edges = new THREE.EdgesGeometry(geo), t = activeShiningEyesRound;
  const boxMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: .3, metalness: .1, transparent: t, opacity: t ? .6 : 1, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
  const edgeMat = new THREE.LineBasicMaterial({ color: 0x0f172a });
  const glowMat = new THREE.LineBasicMaterial({ color: 0x00ffff, depthTest: false });
  blocks.forEach(b => {
    const mesh = new THREE.Mesh(geo, boxMat); mesh.position.set(b.x, b.z, b.y); blockGroup.add(mesh);
    const edge = new THREE.LineSegments(edges, edgeMat); edge.position.copy(mesh.position); blockGroup.add(edge);
    const glow = new THREE.LineSegments(edges, glowMat); glow.position.copy(mesh.position); glow.visible = t; outlineGroup.add(glow);
  });
}

function toggleOutline(visible) {
  if (outlineGroup) outlineGroup.children.forEach(c => { c.visible = visible; });
}

/* ---------- 게임 종료: 시상식 ---------- */
let shownSession = 0, fxTimers = [], fxOn = false, fxConfetti = false, parts = [];
const later = (ms, fn) => fxTimers.push(setTimeout(fn, ms));

function buildResult() {
  const us = collectUsers().map(u => ({ n: u.nickname || '익명', a: u.avatarUrl, s: u.score || 0, t: teams[u.id] })).sort((a, b) => b.s - a.s);
  const res = { session: currentSession, mode: gameMode, podium: us.slice(0, 3) };   // 듀오도 개인 기여 점수 순
  if (gameMode === 'duo') res.teams = [0, 1].map(k => { const m = us.filter(u => u.t === k); return { k, s: m.reduce((x, u) => x + u.s, 0), m }; }).sort((a, b) => b.s - a.s);
  else res.full = us;
  return res;
}

function showResult(res) {
  if (!res || shownSession === res.session) return;
  shownSession = res.session;
  closeResult(true);
  const duo = res.mode === 'duo', ov = $('resultOverlay');
  const av = (u, sz) => `<img src="${esc(u.a || characterImages[0])}" class="user-avatar-mini" style="width:${sz}px;height:${sz}px;" alt="">`;
  $('podium').innerHTML = [2, 1, 3].filter(r => res.podium[r - 1]).map(r => {
    const p = res.podium[r - 1];
    const tag = duo && p.t !== undefined ? `<div class="pod-name" style="font-size:2.2vh;color:${['#dc2626', '#2563eb'][p.t]}">${TEAM_NAMES[p.t]}</div>` : '';
    return `<div class="pod-col r${r}" data-rank="${r}"><div class="beam"></div><img class="pod-avatar" src="${esc(p.a || characterImages[0])}" alt=""><div class="pod-name">${esc(p.n)}</div>${tag}<div class="pod-score">${p.s}점</div><div class="pod-block"><span>${r}</span></div></div>`;
  }).join('');
  const row = (u, i, badge) => `<div class="rank-item"><div class="user-info">${badge ? `<span class="rank-badge ${['rank-1', 'rank-2', 'rank-3'][i] || 'rank-etc'}">${i + 1}등</span>` : ''}${av(u, 24)}<span>${esc(u.n)}</span></div><span style="color:#64748b;font-size:12px;">${u.s}점</span></div>`;
  $('resList').innerHTML = duo
    ? res.teams.map((t, i) => `<div class="rank-item" style="border:2px solid ${TEAM_COLORS[t.k]};background:#f8fafc;"><div class="user-info"><span class="rank-badge ${['rank-1', 'rank-2'][i]}">${i + 1}등</span><span>${TEAM_NAMES[t.k]}</span></div><span style="font-size:14px;">${t.s}점</span></div>` + t.m.map(u => row(u, 0, false)).join('')).join('')
    : res.full.map((u, i) => row(u, i, true)).join('');
  $('resPanel').classList.remove('on');
  ov.classList.add('active');
  fxOn = true; fxLoop();
  const order = [3, 2, 1].filter(r => res.podium[r - 1]);
  order.forEach((r, i) => later(1200 + i * 1700, () => revealPlace(r)));   // 3등 → 2등 → 1등
  later(1200 + Math.max(order.length - 1, 0) * 1700 + 1000, () => $('resPanel').classList.add('on'));   // 1등 1초 뒤 전체 랭킹
}

function revealPlace(r) {
  const col = document.querySelector(`#podium .r${r}`); if (!col) return;
  col.classList.add('on');
  const rc = col.getBoundingClientRect();
  burst(rc.left + rc.width / 2, rc.bottom - rc.height * 0.45, r);
  later(500, () => burst(rc.left + rc.width * 0.3, rc.bottom - rc.height * 0.55, r));
  if (r === 1) { later(400, () => burst(rc.left + rc.width * 0.7, rc.bottom - rc.height * 0.6, 1)); fxConfetti = true; }
}

function burst(x, y, r) {
  const cols = { 1: ['#facc15', '#eab308', '#f97316', '#ec4899', '#8b5cf6'], 2: ['#94a3b8', '#64748b', '#3b82f6', '#60a5fa'], 3: ['#fb923c', '#f97316', '#b45309', '#ea580c'] }[r];
  const n = r === 1 ? 150 : 90;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (Math.random() * 7 + 3) * (r === 1 ? 1.3 : 1);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 5, life: 1, decay: .008 + Math.random() * .01, size: 3 + Math.random() * 5, c: cols[i % cols.length] });
  }
}

function fxLoop() {
  const cv = $('fxCanvas'), ctx = cv.getContext('2d');
  if (cv.width !== innerWidth || cv.height !== innerHeight) { cv.width = innerWidth; cv.height = innerHeight; }
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (fxConfetti && Math.random() < .5) parts.push({ x: Math.random() * cv.width, y: -10, vx: Math.random() * 2 - 1, vy: 2 + Math.random() * 3, life: 1, decay: .003, size: 4 + Math.random() * 4, c: ['#facc15', '#f472b6', '#60a5fa', '#4ade80', '#a78bfa'][Math.floor(Math.random() * 5)] });
  parts = parts.filter(p => p.life > 0 && p.y < cv.height + 20);
  parts.forEach(p => {
    p.vy += .16; p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.size, p.size * .6);
  });
  ctx.globalAlpha = 1;
  if (fxOn) requestAnimationFrame(fxLoop);
}

function closeResult(keepShown) {
  fxTimers.forEach(clearTimeout); fxTimers = []; fxOn = false; fxConfetti = false; parts = [];
  $('resultOverlay').classList.remove('active'); $('resPanel').classList.remove('on');
}

/* ---------- 이벤트 ---------- */
function initUI() {
  fitScreen();
  $('lobbyBtn').addEventListener('click', closeResult);
  $('nickname').addEventListener('input', syncNickname);
  $('nickname').addEventListener('change', syncNickname);
  $('nickname').addEventListener('blur', syncNickname);

  $('changeProfileBtn').addEventListener('click', () => {
    $('defaultUserListUI').style.display = 'none';
    $('profilePickerUI').style.display = 'flex';
    $('profileGrid').innerHTML = profileImages.map(u => `<div class="profile-thumb-card" data-img="${u}"><img src="${u}" class="profile-thumb-img" alt="프로필선택"></div>`).join('');
    $('profileGrid').querySelectorAll('.profile-thumb-card').forEach(c => c.addEventListener('click', () => {
      selectedImage = c.getAttribute('data-img');
      $('cardImage').src = selectedImage;
      $('profilePickerUI').style.display = 'none';
      $('defaultUserListUI').style.display = 'flex';
      updatePresence();
    }));
  });
  $('closeProfilePickerBtn').addEventListener('click', () => {
    $('profilePickerUI').style.display = 'none';
    $('defaultUserListUI').style.display = 'flex';
  });

  $('rankingList').addEventListener('click', async e => {
    const el = e.target.closest('.selectable');
    if (!el || !isTargetSelectMode) return;
    const targetId = el.dataset.userid;
    if (targetId && pendingAttackType) {
      try { await room.send({ type: 'broadcast', event: 'attack_event', payload: { targetId, fromId: myId, type: pendingAttackType } }); } catch (err) {}
    }
    isTargetSelectMode = false; pendingAttackType = null;
    renderRankingList(activeUsers);
  });

  $('teacherCode').addEventListener('input', e => {
    const ok = e.target.value.trim() === 'PANdA';
    if (ok === isTeacher) return;
    isTeacher = ok; syncNickname(); applyUIState(gameStarted);
  });

  // 투표 버튼 (현재 단계 + 선택지로 기록)
  const vote = k => { if (!curStage) return; myVote = curStage + ':' + k; updatePresence(); };
  $('showdownBtn').addEventListener('click', () => vote('showdown'));
  $('soloBtn').addEventListener('click', () => vote('solo'));
  $('duoBtn').addEventListener('click', () => vote('duo'));

  // 선생님: 시작 → 1차(10초) → 2차(5초) 투표. 진행은 renderAll의 워커 타이머가 처리
  $('startBtn').addEventListener('click', () => {
    if (!isTeacher || phase.startsWith('vote')) return;
    phase = 'vote1'; voteEnd = Date.now() + 3000; myVote = '';
    updatePresence();
  });
  $('endBtn').addEventListener('click', async () => {
    if (!isTeacher) return;
    resultData = buildResult(); const res = resultData;
    endGameLocal(); showResult(res); updatePresence();
    try { await room.send({ type: 'broadcast', event: 'game_control', payload: { action: 'end', result: res } }); } catch (err) {}
  });

  syncNickname();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initUI); else initUI();
connect();
</script>
</body>
</html>
