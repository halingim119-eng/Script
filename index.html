### 1. 닉네임 입력창 버그 (다른 곳 클릭 시 무시되는 현상)
*   **원인:** 입력창(InputField)의 데이터 갱신을 `OnEndEdit`(엔터 키를 칠 때나 입력창 밖을 클릭할 때 발동) 이벤트에만 의존하고 있을 확률이 높습니다. 다른 곳을 클릭하면서 포커스를 잃을 때 변수 저장이 꼬인 것입니다.
*   **해결 방법:**
    *   **방법 A:** 닉네임을 확정하는 '시작' 또는 '확인' 버튼을 누르는 순간, 스크립트에서 **직접 `InputField.text` 값을 가져오도록** 로직을 변경하세요.
    *   **방법 B:** InputField의 이벤트 중 `OnValueChanged`(값이 바뀔 때마다 실시간 저장)를 사용하여 닉네임 변수를 계속 업데이트하게 만드세요.

### 2. 쌓기나무 세로/가로 크기가 안 일정한 현상 (비율 찌그러짐)
*   **원인:** 쌓기나무 오브젝트 자체의 크기가 문제라기보다는, **부모 오브젝트(Parent)의 스케일(Scale)이 1, 1, 1이 아니기 때문**에 자식 오브젝트인 쌓기나무들이 회전하거나 배치될 때 찌그러지는 것입니다.
*   **해결 방법:**
    *   쌓기나무들을 묶어둔 **최상위 부모 오브젝트의 Scale 값을 반드시 (X:1, Y:1, Z:1)로 초기화**하세요.
    *   크기를 키우고 싶다면 부모를 키우지 말고, 쌓기나무 프리팹(Prefab) 자체의 크기를 조절해야 비율이 망가지지 않습니다.

### 3. 카메라 회전으로 뷰 변경하기 (쌓기나무 대신 카메라가 돌기)
*   **원인/해결:** 오브젝트 자체를 돌리면 멀티플레이나 물리 엔진에서 위치 계산이 복잡해집니다. 카메라를 돌리는 것이 정석입니다.
*   **구현 방법 (카메라 피벗 기법):**
    1.  쌓기나무들의 정중앙(Center)에 빈 게임 오브젝트를 하나 만듭니다. (이름: `CameraPivot`)
    2.  메인 카메라를 이 `CameraPivot`의 자식(Child)으로 넣고, 적당한 거리와 각도로 뒤로 빼서 쌓기나무를 바라보게 세팅합니다.
    3.  `CameraPivot`을 스크립트로 회전시키면, 카메라는 자연스럽게 쌓기나무 주변을 궤도(Orbit) 회전하게 됩니다.
    ```csharp
    // CameraPivot에 들어갈 회전 스크립트 예시
    public float rotateSpeed = 20f;
    void Update() {
        transform.Rotate(Vector3.up, rotateSpeed * Time.deltaTime);
    }
    ```

### 4. 세로 긴 카드 (실시간 랭킹 보드)
*   **구현 로직:**
    *   UI에서 세로로 긴 패널(Panel)을 하나 만듭니다.
    *   그 안에 'Vertical Layout Group'을 추가하여 등수 텍스트(1~5등)가 자동으로 세로로 정렬되게 합니다.
    *   게임 매니저 스크립트에서 접속한 유저들의 점수를 `List`나 `Dictionary`로 관리합니다.
    *   점수가 변동될 때마다 리스트를 **점수 내림차순으로 정렬(Sort)**하고, 상위 5명의 닉네임과 점수(또는 점수차)를 텍스트로 업데이트해 줍니다.

### 5. 세로 짧은 카드 (4지 선다형 퀴즈 버튼)
*   **구현 로직:**
    *   실제 쌓기나무의 개수(`answer`)를 구합니다.
    *   오답 3개를 헷갈리게 만듭니다. (예: `answer + 1`, `answer - 1`, `answer + 2`). 만약 정답이 너무 작아서 마이너스가 나오면 안 되니 최소값 예외 처리만 해줍니다.
    *   이 4개의 숫자를 리스트에 넣고 **랜덤하게 섞습니다(Shuffle).**
    *   섞인 숫자를 4개의 버튼 텍스트에 각각 할당하고, 버튼 클릭 이벤트에 정답 체크 로직을 연결합니다.
    ```csharp
    // 오답 생성 로직 예시
    int answer = 15; // 실제 정답
    List<int> options = new List<int> { answer, answer + 1, answer - 1, answer + 2 };
    // 리스트를 랜덤으로 섞은 뒤 버튼 1~4번 Text에 할당
    ```

### 6. 정답 확인 시 가려진 쌓기나무까지 테두리 빛나게 하기
*   이 부분이 가장 시각적으로 중요한 포인트입니다. 앞에 있는 나무에 가려진 뒤쪽 나무도 윤곽선(Outline)이 보여야 합니다.
*   **구현 방법 (X-Ray 아웃라인):**
    *   유니티 기준으로 이를 구현하려면 **메테리얼/셰이더(Shader) 조작**이 필요합니다.
    *   테두리를 그리는 아웃라인 셰이더를 만들거나 에셋(무료 에셋 스토어에 'Outline Shader' 검색)을 다운로드합니다.
    *   여기서 핵심은 셰이더 설정에서 **Z-Test(깊이 테스트) 옵션을 'Always(항상 렌더링)'**로 바꾸는 것입니다. 이렇게 하면 다른 오브젝트 뒤에 숨어 있어도 테두리가 화면의 최상단에 겹쳐서 그려집니다.
    *   오답을 누르면 아무 변화가 없고, 정답을 누르는 순간 보상 지급 로직을 실행함과 동시에 모든 쌓기나무 오브젝트의 컴포넌트(Outline Script)를 켜주면(Enable = true) 됩니다.
