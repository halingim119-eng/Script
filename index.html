<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영상 옮기기</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Malgun Gothic',-apple-system,sans-serif}
body{background:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:420px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 10px 25px -5px rgba(0,0,0,.08);padding:22px;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;color:#1e293b;text-align:center}
.tabs{display:flex;gap:8px}
.tab{flex:1;padding:10px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;color:#475569;font-weight:bold;font-size:15px;cursor:pointer}
.tab.on{background:#0f172a;color:#fff;border-color:#0f172a}
.pane{display:none;flex-direction:column;gap:12px}
.pane.on{display:flex}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:#2563eb;color:#fff;font-size:15px;font-weight:bold;cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn:disabled{background:#cbd5e1;cursor:not-allowed}
.btn.green{background:#22c55e}
.drop{border:2px dashed #cbd5e1;border-radius:12px;padding:26px 10px;text-align:center;color:#64748b;font-size:14px;cursor:pointer;background:#f8fafc}
.drop:hover{border-color:#2563eb;background:#eff6ff}
.code{font-size:40px;font-weight:900;letter-spacing:6px;text-align:center;color:#0f172a;font-family:Consolas,monospace}
.sub{font-size:12px;color:#64748b;text-align:center;line-height:1.5;word-break:keep-all}
.file{font-size:13px;color:#334155;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;word-break:break-all}
#qr{display:flex;justify-content:center}
#qr img,#qr canvas{border:6px solid #fff;border-radius:6px}
.bar{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#2563eb;transition:width .15s}
input.codein{width:100%;padding:14px;border:2px solid #cbd5e1;border-radius:10px;font-size:28px;text-align:center;letter-spacing:6px;font-family:Consolas,monospace;outline:none}
input.codein:focus{border-color:#2563eb}
.msg{font-size:13px;text-align:center;font-weight:bold;min-height:18px;color:#64748b}
.msg.er{color:#dc2626}.msg.ok{color:#16a34a}
.hide{display:none!important}
.linkbox{font-size:11px;color:#2563eb;word-break:break-all;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>📹 영상 옮기기</h1>
  <div class="tabs">
    <button class="tab" id="tabSend">보내기 (노트북)</button>
    <button class="tab" id="tabGet">받기 (핸드폰)</button>
  </div>

  <!-- 보내기 -->
  <div class="pane" id="paneSend">
    <div class="drop" id="drop">여기를 눌러 영상 고르기<br><small>(끌어다 놓아도 돼요)</small></div>
    <input type="file" id="fileIn" accept="video/*,*/*" class="hide">
    <div id="sendInfo" class="hide" style="display:none;flex-direction:column;gap:12px">
      <div class="file" id="sendFile"></div>
      <div class="sub">핸드폰에서 이 사이트를 열고 아래 코드를 입력하거나, QR을 찍으세요.</div>
      <div class="code" id="codeBig">------</div>
      <div id="qr"></div>
      <div class="linkbox" id="linkTxt"></div>
      <div class="msg" id="sendMsg">연결 준비 중…</div>
      <div class="bar"><i id="sendBar"></i></div>
      <div class="sub">⚠️ 받는 쪽이 다 받을 때까지 이 창을 닫지 마세요.</div>
    </div>
  </div>

  <!-- 받기 -->
  <div class="pane" id="paneGet">
    <input class="codein" id="codeIn" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">
    <button class="btn" id="connBtn">연결하기</button>
    <div class="msg" id="getMsg"></div>
    <div id="getInfo" class="hide" style="display:none;flex-direction:column;gap:12px">
      <div class="file" id="getFile"></div>
      <button class="btn green" id="dlBtn">다운로드 시작</button>
      <div class="bar"><i id="getBar"></i></div>
      <a class="btn green hide" id="saveLink" style="display:none">💾 핸드폰에 저장</a>
    </div>
  </div>

  <div class="sub">파일은 서버에 올라가지 않고 두 기기가 직접 주고받아요.<br>두 기기 모두 인터넷에 연결돼 있어야 해요.</div>
</div>

<script>
const $ = id => document.getElementById(id);
const CHUNK = 32 * 1024;
const fmt = b => b >= 1073741824 ? (b/1073741824).toFixed(2)+' GB' : b >= 1048576 ? (b/1048576).toFixed(1)+' MB' : Math.ceil(b/1024)+' KB';
const show = (el, on, d='flex') => { el.style.display = on ? d : 'none'; };

/* ---------- 탭 ---------- */
function tab(w) {
  $('tabSend').classList.toggle('on', w === 'send'); $('tabGet').classList.toggle('on', w === 'get');
  $('paneSend').classList.toggle('on', w === 'send'); $('paneGet').classList.toggle('on', w === 'get');
}
$('tabSend').onclick = () => tab('send'); $('tabGet').onclick = () => tab('get');

/* ---------- 보내기 ---------- */
let sPeer = null, sFile = null, sConns = 0;
$('drop').onclick = () => $('fileIn').click();
$('drop').ondragover = e => { e.preventDefault(); };
$('drop').ondrop = e => { e.preventDefault(); if (e.dataTransfer.files[0]) startSend(e.dataTransfer.files[0]); };
$('fileIn').onchange = e => { if (e.target.files[0]) startSend(e.target.files[0]); };

function startSend(f) {
  sFile = f; if (sPeer) { try { sPeer.destroy(); } catch (e) {} }
  $('sendFile').textContent = f.name + ' · ' + fmt(f.size);
  show($('sendInfo'), true); $('sendMsg').className = 'msg'; $('sendMsg').textContent = '연결 준비 중…'; $('sendBar').style.width = '0';
  openPeer();
}
function openPeer() {
  const code = String(Math.floor(100000 + Math.random() * 900000));
  const p = new Peer('vt-' + code);
  sPeer = p;
  p.on('open', () => {
    $('codeBig').textContent = code;
    const url = location.origin + location.pathname + '?c=' + code;
    $('linkTxt').textContent = location.protocol === 'file:' ? '(인터넷에 올린 주소에서 열어야 핸드폰이 접속할 수 있어요)' : url;
    $('qr').innerHTML = '';
    try { if (location.protocol !== 'file:') new QRCode($('qr'), { text: url, width: 150, height: 150 }); } catch (e) {}
    $('sendMsg').textContent = '받는 사람을 기다리는 중…';
  });
  p.on('error', e => {
    if (e.type === 'unavailable-id') return openPeer();
    $('sendMsg').className = 'msg er'; $('sendMsg').textContent = '연결 오류: ' + e.type;
  });
  p.on('disconnected', () => { try { p.reconnect(); } catch (e) {} });
  p.on('connection', conn => {
    conn.on('open', () => {
      conn.send(JSON.stringify({ t: 'meta', name: sFile.name, size: sFile.size, type: sFile.type }));
      $('sendMsg').className = 'msg ok'; $('sendMsg').textContent = '받는 기기가 연결됐어요';
    });
    conn.on('data', d => { try { if (JSON.parse(d).t === 'get') sendFile(conn); } catch (e) {} });
    conn.on('close', () => { $('sendMsg').className = 'msg'; $('sendMsg').textContent = '받는 사람을 기다리는 중…'; });
  });
}
async function sendFile(conn) {
  const f = sFile, dc = conn.dataChannel; let off = 0;
  dc.bufferedAmountLowThreshold = 512 * 1024;
  $('sendMsg').className = 'msg'; $('sendMsg').textContent = '보내는 중…';
  while (off < f.size) {
    if (!conn.open) return;
    if (dc.bufferedAmount > 2 * 1024 * 1024) { await new Promise(r => { dc.onbufferedamountlow = () => { dc.onbufferedamountlow = null; r(); }; setTimeout(r, 300); }); continue; }
    const buf = await f.slice(off, off + CHUNK).arrayBuffer();
    conn.send(buf); off += buf.byteLength;
    $('sendBar').style.width = (off / f.size * 100) + '%';
  }
  conn.send(JSON.stringify({ t: 'done' }));
  $('sendMsg').className = 'msg ok'; $('sendMsg').textContent = '✅ 전송 완료!';
}

/* ---------- 받기 ---------- */
let rPeer = null, rConn = null, rParts = [], rGot = 0, rMeta = null;
$('codeIn').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); if (e.target.value.length === 6) connect(); });
$('connBtn').onclick = connect;
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
function gmsg(t, c) { $('getMsg').textContent = t; $('getMsg').className = 'msg ' + (c || ''); }

function connect() {
  const code = $('codeIn').value.trim(); if (code.length !== 6) return gmsg('6자리 코드를 입력하세요', 'er');
  if (rPeer) { try { rPeer.destroy(); } catch (e) {} }
  gmsg('연결 중…'); show($('getInfo'), false);
  const p = rPeer = new Peer();
  let ok = false;
  const to = setTimeout(() => { if (!ok) gmsg('찾을 수 없어요. 코드를 확인하고, 보내는 창이 열려 있는지 확인하세요', 'er'); }, 12000);
  p.on('error', e => { clearTimeout(to); gmsg(e.type === 'peer-unavailable' ? '찾을 수 없어요. 코드를 다시 확인하세요' : '연결 오류: ' + e.type, 'er'); });
  p.on('open', () => {
    const c = rConn = p.connect('vt-' + code, { reliable: true, serialization: 'raw' });
    c.on('data', async d => {
      if (typeof d === 'string') {
        const m = JSON.parse(d);
        if (m.t === 'meta') { ok = true; clearTimeout(to); rMeta = m; $('getFile').textContent = m.name + ' · ' + fmt(m.size); show($('getInfo'), true); $('dlBtn').disabled = false; $('dlBtn').textContent = '다운로드 시작'; gmsg('연결됐어요!', 'ok'); }
        else if (m.t === 'done') finish();
      } else {
        const buf = d instanceof ArrayBuffer ? d : (d.arrayBuffer ? await d.arrayBuffer() : d.buffer);
        rParts.push(buf); rGot += buf.byteLength;
        $('getBar').style.width = (rGot / rMeta.size * 100) + '%';
        $('dlBtn').textContent = Math.floor(rGot / rMeta.size * 100) + '% (' + fmt(rGot) + ')';
      }
    });
    c.on('close', () => { if (rGot < (rMeta ? rMeta.size : 1) && rParts.length) gmsg('연결이 끊겼어요. 다시 시도하세요', 'er'); });
  });
}
$('dlBtn').onclick = () => {
  if (!rConn || !rMeta) return;
  rParts = []; rGot = 0; $('getBar').style.width = '0'; show($('saveLink'), false);
  $('dlBtn').disabled = true; gmsg('받는 중… 이 화면을 켜 두세요');
  rConn.send(JSON.stringify({ t: 'get' }));
};
function finish() {
  const blob = new Blob(rParts, { type: rMeta.type || 'video/mp4' }), url = URL.createObjectURL(blob);
  const a = $('saveLink'); a.href = url; a.download = rMeta.name; show(a, true, 'block');
  $('dlBtn').textContent = '✅ 다 받았어요'; gmsg('아래 버튼을 눌러 저장하세요', 'ok');
  rParts = [];
}

/* ---------- 시작 ---------- */
const q = new URLSearchParams(location.search).get('c');
if (q) { tab('get'); $('codeIn').value = q.replace(/\D/g, '').slice(0, 6); if ($('codeIn').value.length === 6) connect(); }
else tab(/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'get' : 'send');
</script>
</body>
</html>
