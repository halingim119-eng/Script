<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 접속자 감지 UI</title>
    
    <!-- 이미지 사전 로드 -->
    <link rel="preload" as="image" href="https://media.ffycdn.net/eu/supercell/B9aSwkAt73UKJgmPgSun.png?width=2400" fetchpriority="high">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px;
            gap: 30px; /* 왼쪽 카드와 오른쪽 큰 카드 사이의 간격 */
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
        }

        /* 1. 왼쪽 카드 UI (40% 확대된 기존 스타일) */
        .card {
            width: 336px;           
            height: 434px;          
            background-color: #ffffff;
            border-radius: 20px;    
            box-shadow: 0 11px 34px rgba(0, 0, 0, 0.08); 
            border: 1px solid #f0f0f0; 
            padding: 22px 20px;     
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            flex-shrink: 0; /* 크기 줄어듦 방지 */
        }

        .card-image-container {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-6px); 
            overflow: hidden;
        }

        .card-image {
            max-width: 75%;
            max-height: 196px;      
            object-fit: contain;
        }

        .nickname-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;               
        }

        .nickname-label {
            font-size: 15px;        
            font-weight: 600;
            color: #555555;
        }

        .nickname-input {
            width: 100%;
            padding: 11px 14px;     
            font-size: 18px;        
            border: 1px solid #ddd;
            border-radius: 8px;     
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fafafa;
        }

        .nickname-input:focus {
            border-color: #007bff;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        /* 2. 나머지 공간을 채우는 큰 카드 (실시간 접속자 감지 영역) */
        .main-container-card {
            flex: 1; /* 남은 가로 공간을 모두 채움 */
            height: 434px; /* 왼쪽 카드와 동일한 높이 맞춤 */
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 11px 34px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f0;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .board-title {
            font-size: 18px;
            font-weight: bold;
            color: #333333;
        }

        /* 접속자 수 배지 */
        .online-count-badge {
            background-color: #e6f4ea;
            color: #137333;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #34a853;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* 동적 접속자 목록 스크롤 영역 */
        .user-list-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
        }

        /* 개별 접속자 카드 아이템 */
        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background-color: #f9f9f9;
            border-radius: 12px;
            border: 1px solid #eeeeee;
            transition: transform 0.2s, background-color 0.2s;
        }

        .user-item:hover {
            background-color: #f1f3f4;
            transform: translateY(-2px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background-color: #d1e7dd;
            color: #0f5132;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .user-name {
            font-size: 15px;
            font-weight: 600;
            color: #333333;
        }

        .user-status-text {
            font-size: 13px;
            color: #666666;
        }

        /* 데이터가 없을 때 표시 */
        .empty-state {
            margin: auto;
            text-align: center;
            color: #888888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 왼쪽 카드 UI -->
    <div class="card">
        <div class="card-image-container">
            <img src="https://media.ffycdn.net/eu/supercell/B9aSwkAt73UKJgmPgSun.png?width=2400" 
                 alt="캐릭터 이미지" 
                 class="card-image"
                 fetchpriority="high"
                 loading="eager">
        </div>
        <div class="nickname-section">
            <label for="nickname" class="nickname-label">닉네임</label>
            <input type="text" id="nickname" class="nickname-input" placeholder="닉네임을 입력하세요">
        </div>
    </div>

    <!-- 나머지 공간을 채우는 실시간 접속자 감지 큰 카드 -->
    <div class="main-container-card">
        <div class="board-header">
            <div class="board-title">실시간 접속자 현황</div>
            <div class="online-count-badge">
                <div class="live-dot"></div>
                <span id="onlineCount">접속중 0명</span>
            </div>
        </div>

        <!-- 동적으로 유저 목록이 렌더링될 컨테이너 -->
        <div class="user-list-container" id="userListContainer">
            <!-- 초기 상태 (데이터 없을 때) -->
            <div class="empty-state">현재 접속한 사용자를 감지하는 중입니다...</div>
        </div>
    </div>

    <!-- 동적 서버 연동용 자바스크립트 코드 -->
    <script>
        /**
         * [동적 서버 연동 가이드]
         * 서버(Node.js, Spring, Python 등)에서 실시간 접속자 데이터를 가져와 
         * #userListContainer 와 #onlineCount를 동적으로 갱신하는 예시 코드입니다.
         * 
         * 1. WebSocket(Socket.io) 또는 Fetch API(setInterval 주기적 호출)를 사용합니다.
         */

        // 가상의 접속자 데이터 렌더링 함수 (서버 API나 소켓 수신 시 이 함수를 호출하세요)
        function renderOnlineUsers(users) {
            const container = document.getElementById('userListContainer');
            const countBadge = document.getElementById('onlineCount');

            // 접속자 수 업데이트
            countBadge.innerText = `접속중 ${users.length}명`;

            if (users.length === 0) {
                container.innerHTML = `<div class="empty-state">현재 접속 중인 사용자가 없습니다.</div>`;
                return;
            }

            // 목록 HTML 생성 및 주입
            container.innerHTML = users.map(user => `
                <div class="user-item">
                    <div class="user-info">
                        <div class="user-avatar">${user.nickname.charAt(0).toUpperCase()}</div>
                        <div>
                            <div class="user-name">${user.nickname}</div>
                            <div class="user-status-text">입장 시간: ${user.joinTime}</div>
                        </div>
                    </div>
                    <span style="font-size: 12px; color: #34a853; font-weight: 600;">● 온라인</span>
                </div>
            `).join('');
        }

        // [예시] 서버 연동 테스트용 더미 데이터 시뮬레이션 (실제 구현 시 제거하고 서버 코드로 대체)
        setTimeout(() => {
            const dummyUsersFromSever = [
                { id: 1, nickname: '브롤스타즈고수', joinTime: '방금 전' },
                { id: 2, nickname: '레온장인', joinTime: '1분 전' },
                { id: 3, nickname: '스타소녀', joinTime: '3분 전' }
            ];
            renderOnlineUsers(dummyUsersFromSever);
        }, 1000);

        /* 
         * [실제 백엔드 연동 템플릿 예시 - Fetch API 폴링 방식]
         * async function fetchOnlineUsers() {
         *     try {
         *         const response = await fetch('/api/online-users');
         *         const data = await response.json();
         *         renderOnlineUsers(data);
         *     } catch (error) {
         *         console.error('접속자 정보 로드 실패:', error);
         *     }
         * }
         * setInterval(fetchOnlineUsers, 3000); // 3초마다 갱신
         */
    </script>
</body>
</html>
