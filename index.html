<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>왼쪽 카드 UI - 캐릭터 및 닉네임</title>
    
    <!-- 브라우저가 이 이미지를 백그라운드에서 가장 먼저 다운로드하도록 사전 지시 (초고속 로딩) -->
    <link rel="preload" as="image" href="https://media.ffycdn.net/eu/supercell/B9aSwkAt73UKJgmPgSun.png?width=2400" fetchpriority="high">

    <style>
        /* 전체 페이지 리셋 및 완전 하얀색 배경 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px;
            font-family: 'Malgun Gothic', sans-serif;
        }

        /* 왼쪽 카드 UI 스타일 */
        .card {
            width: 350px;           
            height: 80%;            
            background-color: #ffffff;
            border-radius: 16px;    
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); 
            border: 1px solid #f0f0f0; 
            padding: 30px 24px;          
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            position: relative;
        }

        /* 카드 중앙에서 살짝 위쪽을 차지하는 이미지 영역 */
        .card-image-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: translateY(-25px); 
        }

        .card-image {
            max-width: 85%;
            max-height: 220px;
            object-fit: contain;
        }

        /* 카드 아래쪽 닉네임 영역 */
        .nickname-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .nickname-label {
            font-size: 13px;
            font-weight: 600;
            color: #555555;
        }

        .nickname-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fafafa;
        }

        .nickname-input:focus {
            border-color: #007bff;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- 왼쪽 카드 UI -->
    <div class="card">
        <!-- 중앙에서 살짝 위쪽 이미지 영역 -->
        <div class="card-image-container">
            <img src="https://media.ffycdn.net/eu/supercell/B9aSwkAt73UKJgmPgSun.png?width=2400" 
                 alt="캐릭터 이미지" 
                 class="card-image"
                 fetchpriority="high"
                 loading="eager"
                 onerror="this.style.display='none'; console.error('이미지 로드 실패');">
        </div>

        <!-- 카드 아래쪽 닉네임 입력 영역 -->
        <div class="nickname-section">
            <label for="nickname" class="nickname-label">닉네임</label>
            <input type="text" id="nickname" class="nickname-input" placeholder="닉네임을 입력하세요">
        </div>
    </div>

</body>
</html>
