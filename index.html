<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미완성</title>
    
    <!-- 이미지 사전 로드 -->
    <link rel="preload" as="image" href="https://media.ffycdn.net/eu/supercell/B9aSwkAt73UKJgmPgSun.png?width=2400" fetchpriority="high">

    <!-- Supabase JS SDK -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = "https://knjblcpgxcixfbzcrrqg.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_Xn2UjMtIkzXQU_6xPlMvrg_Rtc9VY0v";

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // 모바일 브라우저 고유 ID 부여 (로컬스토리지 활용)
        let myId = localStorage.getItem('user_uuid');
        if (!myId) {
            myId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('user_uuid', myId);
        }

        let myNickname = '';

        // Supabase Realtime 채널 생성 (Presence 기능)
        const room = supabase.channel('online-users-room', {
            config: {
                presence: {
                    key: myId,
                },
            },
        });

        // 내 상태(아이디, 닉네임)를 서버에 전송하는 함수
        async function updatePresence() {
            try {
                await room.track({
                    id: myId,
                    nickname: myNickname,
                    onlineAt: new Date().toISOString()
                });
            } catch (err) {
                console.error("Presence update error:", err);
            }
        }

        // 다른 사람이 들어오거나 나갈 때, 이름을 바꿀 때 실시간 동기화
        room.on('presence', { event: 'sync' }, () => {
            const state = room.presenceState();
            renderUserList(state);
        });

        // 채널 접속 성공 시 내 상태 등록
        room.subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
                await updatePresence();
            }
        });

        // 💡 [고장 방지 및 최적화] 타이핑할 때마다 서버가 폭주하지 않도록 0.4초 딜레이(디바운스) 적용
        const nicknameInput = document.getElementById('nickname');
        let typingTimer;
        nicknameInput.addEventListener('input', (e) => {
            myNickname = e.target.value;
            clearTimeout(typingTimer);
            typingTimer = setTimeout(async () => {
                await updatePresence();
            }, 400); // 타이핑을 멈추거나 변경을 마칠 때 서버로 안전하게 전송
        });

        // 🧹 [자원 절약] 페이지를 닫거나 다른 곳으로 이동할 때 서버에 신호 즉시 삭제 요청
        window.addEventListener('beforeunload', () => {
            room.untrack();
        });
        window.addEventListener('pagehide', () => {
            room.untrack();
        });

        // 접속자 목록 화면 렌더링 함수
        function renderUserList(state) {
            const userListContainer = document.getElementById('userListContainer');
            const onlineCountBadge = document.getElementById('onlineCount');

            const allPresences = [];
            Object.values(state).forEach(presences => {
                if (presences && presences.length > 0) {
                    allPresences.push(presences[0]);
                }
            });

            onlineCountBadge.innerText = `접속중 ${allPresences.length}명`;

            if (allPresences.length === 0) {
                userListContainer.innerHTML = `<div class="empty-state">현재 접속 중인 사람이 없습니다.</div>`;
                return;
            }

            userListContainer.innerHTML = allPresences.map(user => {
                // 이름이 비어있으면 "이름 없음"으로 표시
                const displayName = (user.nickname && user.nickname.trim() !== '') ? user.nickname : '이름 없음';
                const initial = displayName.charAt(0).toUpperCase();
                const isMe = user.id === myId ? ' (나)' : '';

                return `
                    <div class="user-item">
                        <div class="user-info">
                            <div class="user-avatar">${initial}</div>
                            <div>
                                <div class="user-name">${displayName}${isMe}</div>
                                <div class="user-status-text">실시간 접속중</div>
                            </div>
                        </div>
                        <span style="font-size: 12px; color: #34a853; font-weight: 600;">● 온라인</span>
                    </div>
                `;
            }).join('');
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 40px;
            gap: 30px; 
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
        }

        /* 왼쪽 카드 UI */
        .card {
            width: 336px;           
            height: 434px;          
            background-color: #ffffff;
            border-radius: 20px;    
            box-shadow: 0 11px 34px rgba(0, 0, 0, 0.08); 
            border: 1px solid #f0f0f0; 
            padding: 22px 20px;     
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            flex-shrink: 0; 
        }

        .card-image-container {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-6px); 
            overflow: hidden;
        }

        .card-image {
            max-width: 75%;
            max-height: 196px;      
            object-fit: contain;
        }

        .nickname-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;               
        }

        .nickname-label {
            font-size: 15px;        
            font-weight: 600;
            color: #555555;
        }

        .nickname-input {
            width: 100%;
            padding: 11px 14px;     
            font-size: 18px;        
            border: 1px solid #ddd;
            border-radius: 8px;     
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fafafa;
        }

        .nickname-input:focus {
            border-color: #007bff;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        /* 오른쪽 큰 카드 영역 (제목 원상복구 완료) */
        .main-container-card {
            flex: 1; 
            height: 434px; 
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 11px 34px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f0;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .board-title {
            font-size: 18px;
            font-weight: bold;
            color: #333333;
        }

        .online-count-badge {
            background-color: #e6f4ea;
            color: #137333;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #34a853;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .user-list-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
        }

        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background-color: #f9f9f9;
            border-radius: 12px;
            border: 1px solid #eeeeee;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background-color: #e2e8f0;
            color: #475569;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .user-name {
            font-size: 15px;
            font-weight: 600;
            color: #333333;
        }

        .user-status-text {
            font-size: 12px;
            color: #888888;
        }

        .empty-state {
            margin: auto;
            text-align: center;
            color: #888888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 왼쪽 카드 UI -->
    <div class="card">
        <div class="card-image-container">
            <img src="https://media.ffycdn.net/eu/supercell/B9aSwkAt73UKJgmPgSun.png?width=2400" 
                 alt="캐릭터 이미지" 
                 class="card-image"
                 fetchpriority="high"
                 loading="eager">
        </div>
        <div class="nickname-section">
            <label for="nickname" class="nickname-label">닉네임</label>
            <input type="text" id="nickname" class="nickname-input" placeholder="이름을 입력하세요">
        </div>
    </div>

    <!-- 오른쪽 카드: 실시간 실제 접속자 현황 (제목 원상복구) -->
    <div class="main-container-card">
        <div class="board-header">
            <div class="board-title">실시간 실제 접속자 현황</div>
            <div class="online-count-badge">
                <div class="live-dot"></div>
                <span id="onlineCount">접속중 0명</span>
            </div>
        </div>

        <div class="user-list-container" id="userListContainer">
            <div class="empty-state">접속자를 감지하는 중...</div>
        </div>
    </div>
</body>
</html>
