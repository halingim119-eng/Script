<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 쌓기나무 실시간 클래스</title>
    
    <!-- 이미지 사전 로드 -->
    <link rel="preload" as="image" id="preloadLink" href="" fetchpriority="high">

    <!-- Supabase JS SDK -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = "https://knjblcpgxcixfbzcrrqg.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_Xn2UjMtIkzXQU_6xPlMvrg_Rtc9VY0v";

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // 모바일 브라우저 고유 ID 부여 (중복 접속자 오류 방지)
        let myId = localStorage.getItem('user_uuid');
        if (!myId) {
            myId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('user_uuid', myId);
        }

        // 🖼️ 이미지 랜덤 선택 리스트 (총 16종)
        const characterImages = [
            "https://media.ffycdn.net/eu/supercell/B9aSwkAt73UKJgmPgSun.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/QnZRLnpy7ckitzeuASFz.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/S6nkFKmpdZs1c8qRUo8f.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/tTtXs4ftdtuBh85yq9tY.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/s83nEEJ4ZKPXzgKjDrF3.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/HDkXgubferFDkbkHJAXo.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/w6fRpxtAdEXsWLjHEzHD.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/aVJ7E8hmdXBjNbT9CHeM.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/m823rLr57CeLZdx2ivfZ.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/6PVSgKBY4KNpkabWr9bj.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/fTRckDCnv8CLTEMDi3tt.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/6jGjY3JAbFrkSx4FaiVH.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/Qmxk7V5tFcmLGeCVueWT.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/XTTrodLDSVQVrjhYbs2Z.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/ACfDodL3WGgMD3ybdHvn.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/7a6mrhbBHByusVgTvkoS.png?width=2400"
        ];

        const selectedImage = characterImages[Math.floor(Math.random() * characterImages.length)];

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('preloadLink').href = selectedImage;
            document.getElementById('cardImage').src = selectedImage;
        });

        let baseNickname = '';
        let isTeacher = false;
        let myNickname = '이름 없음';
        let gameStarted = false;

        // Supabase Realtime 채널 생성
        const room = supabase.channel('online-users-room', {
            config: {
                presence: {
                    key: myId,
                },
            },
        });

        // 닉네임 포맷 처리 함수 (선생님일 경우 강제로 앞에 (선생님) 부착)
        function processNicknameUpdate() {
            const nicknameInput = document.getElementById('nickname');
            if (!nicknameInput) return;

            let rawVal = nicknameInput.value.replace(/^\(선생님\)\s*/, '').trim();
            baseNickname = rawVal;

            if (isTeacher) {
                myNickname = `(선생님) ${baseNickname !== '' ? baseNickname : '선생님'}`;
            } else {
                myNickname = baseNickname !== '' ? baseNickname : '이름 없음';
            }
        }

        // 내 상태 전송 함수
        async function updatePresence() {
            try {
                await room.track({
                    id: myId,
                    nickname: myNickname,
                    gameStarted: gameStarted,
                    onlineAt: new Date().toISOString()
                });
            } catch (err) {
                console.error("Presence update error:", err);
            }
        }

        // UI 모드 (시작/종료) 일괄 적용 함수
        function applyGameUI(started) {
            const normalUI = document.getElementById('normalUI');
            const gameUI = document.getElementById('gameUI');
            const actionButton = document.getElementById('actionButton');

            if (started) {
                normalUI.style.display = 'none';
                gameUI.style.display = 'flex';
                actionButton.innerText = '종료';
                actionButton.classList.add('end-mode');
                actionButton.disabled = !isTeacher;
                if (isTeacher) actionButton.classList.add('active');
                startBlockAnimation();
            } else {
                normalUI.style.display = 'flex';
                gameUI.style.display = 'none';
                actionButton.innerText = '시작';
                actionButton.classList.remove('end-mode');
                if (isTeacher) {
                    actionButton.disabled = false;
                    actionButton.classList.add('active');
                } else {
                    actionButton.disabled = true;
                    actionButton.classList.remove('active');
                }
                stopBlockAnimation();
            }
        }

        // 실시간 동기화 수신 (Presence)
        room.on('presence', { event: 'sync' }, () => {
            const state = room.presenceState();
            renderUserList(state);

            let isAnyGameStarted = false;
            Object.values(state).forEach(presences => {
                if (presences && Array.isArray(presences)) {
                    presences.forEach(user => {
                        if (user && user.gameStarted) {
                            isAnyGameStarted = true;
                        }
                    });
                }
            });

            if (isAnyGameStarted !== gameStarted) {
                gameStarted = isAnyGameStarted;
                applyGameUI(gameStarted);
            }
        });

        // 실시간 브로드캐스트 수신 (시작/종료 명령)
        room.on('broadcast', { event: 'game_toggle' }, ({ payload }) => {
            if (payload && typeof payload.gameStarted === 'boolean') {
                gameStarted = payload.gameStarted;
                applyGameUI(gameStarted);
            }
        });

        // 접속 성공 시 내 상태 업데이트
        room.subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
                await updatePresence();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const nicknameInput = document.getElementById('nickname');
            const teacherCodeInput = document.getElementById('teacherCode');
            const actionButton = document.getElementById('actionButton');

            let typingTimer;

            // 닉네임 입력 이벤트
            nicknameInput.addEventListener('input', (e) => {
                processNicknameUpdate();
                clearTimeout(typingTimer);
                typingTimer = setTimeout(async () => {
                    await updatePresence();
                }, 200);
            });

            nicknameInput.addEventListener('blur', async () => {
                processNicknameUpdate();
                await updatePresence();
            });

            // 선생님 코드 감지 (PANdA)
            teacherCodeInput.addEventListener('input', async (e) => {
                const code = e.target.value.trim();
                isTeacher = (code === 'PANdA');

                processNicknameUpdate();
                applyGameUI(gameStarted);
                await updatePresence();
            });

            // 시작 / 종료 버튼 클릭 이벤트 (선생님 전용)
            actionButton.addEventListener('click', async () => {
                if (!isTeacher) {
                    alert('선생님만 시작/종료할 수 있습니다!');
                    return;
                }

                gameStarted = !gameStarted;

                // 1. 다른 학생들에게 시작/종료 명령 즉시 전달
                try {
                    await room.send({
                        type: 'broadcast',
                        event: 'game_toggle',
                        payload: { gameStarted: gameStarted }
                    });
                } catch(err) {
                    console.error("Broadcast error:", err);
                }

                // 2. 내 상태 및 화면 업데이트
                applyGameUI(gameStarted);
                await updatePresence();
            });
        });

        // 페이지 퇴장 시 접속자 목록에서 즉시 제거
        window.addEventListener('beforeunload', () => { room.untrack(); });
        window.addEventListener('pagehide', () => { room.untrack(); });

        // 접속자 목록 화면 렌더링
        function renderUserList(state) {
            const userListContainer = document.getElementById('userListContainer');
            const onlineCountBadgeText = document.getElementById('onlineCountText');

            const userMap = {};
            Object.values(state).forEach(presences => {
                if (presences && Array.isArray(presences)) {
                    presences.forEach(user => {
                        if (user && user.id) {
                            userMap[user.id] = user;
                        }
                    });
                }
            });

            const allPresences = Object.values(userMap);
            onlineCountBadgeText.innerText = `접속중 ${allPresences.length}명`;

            if (allPresences.length === 0) {
                userListContainer.innerHTML = `<div class="empty-state">현재 접속 중인 사람이 없습니다.</div>`;
                return;
            }

            userListContainer.innerHTML = allPresences.map(user => {
                const displayName = (user.nickname && user.nickname.trim() !== '') ? user.nickname : '이름 없음';
                const initial = displayName.replace('(선생님) ', '').charAt(0).toUpperCase();
                const isMe = user.id === myId ? ' (나)' : '';

                return `
                    <div class="user-item">
                        <div class="user-info">
                            <div class="user-avatar">${initial}</div>
                            <div>
                                <div class="user-name">${displayName}${isMe}</div>
                                <div class="user-status-text">실시간 접속중</div>
                            </div>
                        </div>
                        <span style="font-size: 12px; color: #34a853; font-weight: 600;">● 온라인</span>
                    </div>
                `;
            }).join('');
        }

        // 🧊 논리적 3D 쌓기나무 엔진
        let animId = null;
        let currentBlocks = null;

        function generateValidBlocks() {
            let blocks = [];
            let grid = {};
            let possiblePositions = [];

            for (let x = 0; x < 3; x++) {
                for (let y = 0; y < 3; y++) {
                    possiblePositions.push({x: x, y: y, z: 0});
                }
            }

            while (blocks.length < 10 && possiblePositions.length > 0) {
                let idx = Math.floor(Math.random() * possiblePositions.length);
                let pos = possiblePositions.splice(idx, 1)[0];

                let supported = (pos.z === 0) || grid[`${pos.x},${pos.y},${pos.z-1}`];
                if (supported) {
                    blocks.push(pos);
                    grid[`${pos.x},${pos.y},${pos.z}`] = true;

                    if (pos.z < 2) {
                        possiblePositions.push({x: pos.x, y: pos.y, z: pos.z + 1});
                    }
                }
            }
            return blocks;
        }

        function startBlockAnimation() {
            if (animId) return; // 이미 실행 중이면 중복 실행 방지
            const canvas = document.getElementById('blockCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            if (!currentBlocks) {
                currentBlocks = generateValidBlocks();
            }

            let angle = 0;

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                angle += 0.015;

                const cx = canvas.width / 2;
                const cy = canvas.height / 2 + 30;
                const scale = 36;
                const centerGrid = 1.0; 

                let sortedBlocks = [...currentBlocks].sort((a, b) => {
                    let rxA = (a.x - centerGrid) * Math.cos(angle) - (a.y - centerGrid) * Math.sin(angle);
                    let ryA = (a.x - centerGrid) * Math.sin(angle) + (a.y - centerGrid) * Math.cos(angle);
                    let rxB = (b.x - centerGrid) * Math.cos(angle) - (b.y - centerGrid) * Math.sin(angle);
                    let ryB = (b.x - centerGrid) * Math.sin(angle) + (b.y - centerGrid) * Math.cos(angle);
                    return (rxA + ryA) - (rxB + ryB);
                });

                sortedBlocks.forEach(b => {
                    let rx = b.x - centerGrid;
                    let ry = b.y - centerGrid;
                    let rotX = rx * Math.cos(angle) - ry * Math.sin(angle);
                    let rotY = rx * Math.sin(angle) + ry * Math.cos(angle);

                    let screenX = cx + (rotX - rotY) * scale;
                    let screenY = cy + (rotX + rotY) * (scale * 0.5) - (b.z * scale * 0.9);

                    drawCube(ctx, screenX, screenY, scale);
                });

                animId = requestAnimationFrame(render);
            }

            render();
        }

        function stopBlockAnimation() {
            if (animId) {
                cancelAnimationFrame(animId);
                animId = null;
            }
            currentBlocks = null;
        }

        function drawCube(ctx, x, y, size) {
            const h = size * 0.85;

            // 윗면
            ctx.fillStyle = '#60a5fa';
            ctx.beginPath();
            ctx.moveTo(x, y - h);
            ctx.lineTo(x + size, y - h + size * 0.5);
            ctx.lineTo(x, y - h + size);
            ctx.lineTo(x - size, y - h + size * 0.5);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#2563eb';
            ctx.lineWidth = 1;
            ctx.stroke();

            // 왼쪽면
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.moveTo(x - size, y - h + size * 0.5);
            ctx.lineTo(x, y - h + size);
            ctx.lineTo(x, y + size);
            ctx.lineTo(x - size, y + size * 0.5);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 오른쪽면
            ctx.fillStyle = '#1d4ed8';
            ctx.beginPath();
            ctx.moveTo(x, y - h + size);
            ctx.lineTo(x + size, y - h + size * 0.5);
            ctx.lineTo(x + size, y + size * 0.5);
            ctx.lineTo(x, y + size);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
    </script>

<body>

    <div class="pc-monitor" id="pcMonitor">
        <div class="monitor-header">
            <div class="window-dot dot-red"></div>
            <div class="window-dot dot-yellow"></div>
            <div class="window-dot dot-green"></div>
            <div class="monitor-title-text">3D 쌓기나무 실시간 수업</div>
        </div>

        <div class="desktop-content">
            <!-- 왼쪽 카드 UI -->
            <div class="card">
                <!-- 1. 기본 상태 -->
                <div class="card-normal-section" id="normalUI">
                    <div class="card-image-container">
                        <img id="cardImage" 
                             alt="캐릭터 이미지" 
                             class="card-image"
                             fetchpriority="high"
                             loading="eager">
                    </div>
                    <div class="nickname-section">
                        <label for="nickname" class="nickname-label">닉네임</label>
                        <input type="text" id="nickname" class="nickname-input" placeholder="이름을 입력하세요">
                    </div>
                </div>

                <!-- 2. 게임 상태 (3D 쌓기나무 검토) -->
                <div class="card-game-section" id="gameUI">
                    <div class="game-title-badge">쌓기나무 회전 검토 중</div>
                    <canvas id="blockCanvas" class="block-canvas" width="300" height="340"></canvas>
                </div>

                <!-- 시작 / 종료 버튼 -->
                <button id="actionButton" class="start-btn" disabled>시작</button>
            </div>

            <!-- 오른쪽 카드: 실시간 실제 접속자 현황 -->
            <div class="main-container-card">
                <div class="board-header">
                    <div class="board-title">실시간 실제 접속자 현황</div>
                    <div class="online-count-badge">
                        <div class="live-dot"></div>
                        <span id="onlineCountText">접속중 0명</span>
                        <input type="text" id="teacherCode" class="transparent-code-input" placeholder="코드" title="선생님 코드를 입력하세요">
                    </div>
                </div>

                <div class="user-list-container" id="userListContainer">
                    <div class="empty-state">접속자를 감지하는 중...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function resizeMonitor() {
            const monitor = document.getElementById('pcMonitor');
            const targetWidth = 940;  
            const targetHeight = 560; 
            
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            const scaleX = windowWidth / targetWidth;
            const scaleY = windowHeight / targetHeight;
            let scale = Math.min(scaleX, scaleY) * 0.92;

            monitor.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', resizeMonitor);
        window.addEventListener('load', resizeMonitor);
        resizeMonitor();
    </script>
</body>
</html>
