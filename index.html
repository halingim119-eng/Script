<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 쌓기나무 실시간 클래스</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f1f5f9;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
        }

        .pc-monitor {
            width: 940px;
            height: 560px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid #cbd5e1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform-origin: center center;
            position: relative;
        }

        .monitor-header {
            height: 38px;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 8px;
        }

        .window-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        .monitor-title-text {
            margin-left: auto;
            margin-right: auto;
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
        }

        .desktop-content {
            width: 100%;
            height: 522px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background-color: #ffffff;
        }

        .card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .left-card {
            width: 320px;
            height: 480px;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .card-section {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .card-image-container {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-image {
            max-width: 85%;
            max-height: 200px;
            object-fit: contain;
        }

        .nickname-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nickname-label {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
        }

        .nickname-input {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            background-color: #f8fafc;
        }

        .nickname-input:focus {
            border-color: #2563eb;
            background-color: #ffffff;
        }

        #threeContainer {
            width: 100%;
            height: 330px;
            border-radius: 12px;
            overflow: hidden;
            background-color: #f8fafc;
        }

        .game-title-badge {
            font-size: 13px;
            font-weight: bold;
            color: #1e293b;
            background: #e2e8f0;
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .btn {
            width: 100%;
            padding: 11px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 6px;
        }

        .btn-red { background-color: #ef4444; }
        .btn-red:hover { background-color: #dc2626; }
        .btn-blue { background-color: #2563eb; }
        .btn-blue:hover { background-color: #1d4ed8; }

        .teacher-btn-group {
            width: 100%;
            display: flex;
            gap: 8px;
        }

        .right-card-container {
            flex: 1;
            height: 480px;
            display: flex;
            flex-direction: column;
        }

        .right-card {
            width: 100%;
            height: 100%;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #f1f5f9;
        }

        .board-title {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
        }

        .online-count-badge {
            background-color: #dcfce7;
            color: #15803d;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .transparent-code-input {
            width: 45px;
            border: none;
            background: transparent;
            outline: none;
            font-size: 12px;
            color: #15803d;
            font-weight: 600;
            text-align: center;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
        }

        .user-list-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #f8fafc;
            border-radius: 10px;
            border: 1px solid #f1f5f9;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #334155;
        }

        .game-right-layout {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .tall-card {
            height: 270px;
            display: flex;
            flex-direction: column;
        }

        .short-card {
            height: 196px;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .rank-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background-color: #f8fafc;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .rank-item.selectable {
            cursor: pointer;
            border: 1px solid #cbd5e1;
            background-color: #ffffff;
        }

        .rank-item.selectable:hover {
            background-color: #f1f5f9;
            border-color: #2563eb;
        }

        .rank-badge {
            padding: 2px 8px;
            border-radius: 12px;
            color: white;
            font-size: 11px;
        }
        .rank-1 { background-color: #eab308; }
        .rank-2 { background-color: #94a3b8; }
        .rank-3 { background-color: #b45309; }
        .rank-etc { background-color: #cbd5e1; color: #475569; }

        .quiz-title {
            font-size: 15px;
            font-weight: bold;
            color: #1e293b;
        }

        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .choice-btn {
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            background-color: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .choice-btn:hover {
            background-color: #e2e8f0;
        }

        @keyframes btnGlowAnim {
            0% { box-shadow: 0 0 5px #3b82f6; border-color: #3b82f6; }
            50% { box-shadow: 0 0 15px #60a5fa, 0 0 10px #2563eb; border-color: #2563eb; }
            100% { box-shadow: 0 0 5px #3b82f6; border-color: #3b82f6; }
        }

        .choice-btn.glowing-choice {
            animation: btnGlowAnim 1.2s infinite alternate;
            background-color: #eff6ff !important;
            color: #1d4ed8 !important;
        }

        .choice-btn.correct {
            background-color: #22c55e !important;
            color: white !important;
            border-color: #16a34a !important;
            animation: none !important;
        }

        .choice-btn.wrong {
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #dc2626 !important;
            animation: none !important;
        }

        .feedback-msg {
            font-size: 13px;
            font-weight: bold;
            height: 18px;
        }

        .empty-state {
            margin: auto;
            color: #94a3b8;
            font-size: 13px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .card-container {
            display: flex;
            gap: 20px;
        }

        .reward-card {
            width: 200px;
            height: 290px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            border: 2px solid #e2e8f0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .reward-card:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: #2563eb;
        }

        .reward-card-title {
            font-size: 16px;
            font-weight: bold;
            color: #0f172a;
            text-align: center;
        }

        .reward-card-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        .reward-card-desc {
            font-size: 12px;
            color: #64748b;
            text-align: center;
            word-break: keep-all;
        }

        #tauntOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            overflow: hidden;
        }

        #tauntOverlay img {
            width: 95vw;
            height: 95vh;
            max-width: 1400px;
            max-height: 1400px;
            object-fit: contain;
            transform: scale(1.8);
        }
    </style>
</head>
<body>

    <div class="pc-monitor" id="pcMonitor">
        <div class="monitor-header">
            <div class="window-dot dot-red"></div>
            <div class="window-dot dot-yellow"></div>
            <div class="window-dot dot-green"></div>
            <div class="monitor-title-text">3D 쌓기나무 실시간 수업</div>
        </div>

        <div class="desktop-content">
            <div class="card left-card">
                <div id="normalUI" class="card-section">
                    <div class="card-image-container">
                        <img id="cardImage" alt="캐릭터" class="card-image">
                    </div>
                    <div class="nickname-section">
                        <label for="nickname" class="nickname-label">닉네임</label>
                        <input type="text" id="nickname" class="nickname-input" placeholder="이름을 입력하세요">
                    </div>
                </div>

                <div id="gameUI" class="card-section" style="display:none;">
                    <div class="game-title-badge" id="cameraStatusBadge">3D 관찰 카메라 회전 중</div>
                    <div id="threeContainer"></div>
                </div>

                <div id="teacherControls" class="teacher-btn-group" style="display:none;">
                    <button id="nextBtn" class="btn btn-blue">다음 문제</button>
                    <button id="endBtn" class="btn btn-red">종료</button>
                </div>
                <button id="startBtn" class="btn btn-red" style="display:none;">시작</button>
            </div>

            <div class="right-card-container">
                <div id="defaultUserListUI" class="card right-card">
                    <div class="board-header">
                        <div class="board-title">실시간 실제 접속자 현황</div>
                        <div class="online-count-badge">
                            <div class="live-dot"></div>
                            <span id="onlineCountText">접속중 0명</span>
                            <input type="text" id="teacherCode" class="transparent-code-input" placeholder="코드">
                        </div>
                    </div>
                    <div class="user-list-container" id="userListContainer">
                        <div class="empty-state">접속자를 감지하는 중...</div>
                    </div>
                </div>

                <div id="gameRankingUI" class="game-right-layout" style="display:none;">
                    <div class="card tall-card" id="rankingCard">
                        <div class="board-title" id="rankingTitle">🏆 실시간 랭킹</div>
                        <div class="rank-list" id="rankingList"></div>
                    </div>
                    <div class="card short-card">
                        <div class="quiz-title">쌓기나무는 모두 몇 개일까요?</div>
                        <div class="choice-grid" id="choiceButtons"></div>
                        <div id="feedbackMessage" class="feedback-msg"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="cardModalOverlay">
        <div class="card-container" id="cardContainer"></div>
    </div>

    <div id="tauntOverlay">
        <img src="https://media.tenor.com/dpjhz7THIK8AAAAj/brawl-stars-thumbs-down.gif" alt="야유">
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = "https://knjblcpgxcixfbzcrrqg.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_Xn2UjMtIkzXQU_6xPlMvrg_Rtc9VY0v";
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let myId = localStorage.getItem('user_uuid');
        if (!myId) {
            myId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('user_uuid', myId);
        }

        const characterImages = [
            "https://media.ffycdn.net/eu/supercell/B9aSwkAt73UKJgmPgSun.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/QnZRLnpy7ckitzeuASFz.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/S6nkFKmpdZs1c8qRUo8f.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/tTtXs4ftdtuBh85yq9tY.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/s83nEEJ4ZKPXzgKjDrF3.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/HDkXgubferFDkbkHJAXo.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/w6fRpxtAdEXsWLjHEzHD.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/aVJ7E8hmdXBjNbT9CHeM.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/m823rLr57CeLZdx2ivfZ.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/6PVSgKBY4KNpkabWr9bj.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/fTRckDCnv8CLTEMDi3tt.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/6jGjY3JAbFrkSx4FaiVH.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/Qmxk7V5tFcmLGeCVueWT.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/XTTrodLDSVQVrjhYbs2Z.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/ACfDodL3WGgMD3ybdHvn.png?width=2400",
            "https://media.ffycdn.net/eu/supercell/7a6mrhbBHByusVgTvkoS.png?width=2400"
        ];
        const selectedImage = characterImages[Math.floor(Math.random() * characterImages.length)];
        document.getElementById('cardImage').src = selectedImage;

        let baseNickname = '';
        let isTeacher = false;
        let myNickname = '익명';
        let gameStarted = false;
        let myScore = 0;
        let currentBlocks = [];
        let hasGuessed = false;
        let activeUsers = [];
        let pendingAttackType = null;
        let isTargetSelectMode = false;

        let isCameraFrozen = false;
        let hasTripleScoreMultiplier = false;
        let hasShiningEyesBuff = false;
        let activeShiningEyesRound = false;

        const room = supabase.channel('online-users-room', {
            config: { presence: { key: myId } },
        });

        function syncNickname() {
            const nicknameInput = document.getElementById('nickname');
            if (!nicknameInput) return;

            let val = nicknameInput.value.trim();
            val = val.replace(/^\(선생님\)\s*/, '');
            baseNickname = val;

            if (isTeacher) {
                myNickname = `(선생님) ${baseNickname !== '' ? baseNickname : '선생님'}`;
                nicknameInput.value = myNickname;
            } else {
                myNickname = baseNickname !== '' ? baseNickname : '익명';
            }
            updatePresence();
        }

        async function updatePresence() {
            try {
                await room.track({
                    id: myId,
                    nickname: myNickname,
                    gameStarted: gameStarted,
                    score: myScore,
                    onlineAt: new Date().toISOString()
                });
            } catch (err) {}
        }

        room.on('presence', { event: 'sync' }, () => {
            const state = room.presenceState();
            let userMap = new Map();
            Object.values(state).forEach(presences => {
                if (Array.isArray(presences)) {
                    presences.forEach(u => {
                        if (u && u.id) {
                            userMap.set(u.id, u);
                        }
                    });
                }
            });
            let allUsers = Array.from(userMap.values());
            activeUsers = allUsers;

            let isAnyGameStarted = allUsers.some(u => u.gameStarted);
            if (isAnyGameStarted !== gameStarted && !isTeacher) {
                gameStarted = isAnyGameStarted;
                applyUIState(gameStarted);
            }

            renderUserList(allUsers);
            renderRankingList(allUsers);
        });

        room.on('broadcast', { event: 'game_control' }, ({ payload }) => {
            if (payload.action === 'start' || payload.action === 'next') {
                gameStarted = true;
                currentBlocks = payload.blocks;
                
                activeShiningEyesRound = hasShiningEyesBuff;
                hasShiningEyesBuff = false;

                applyUIState(true);
                rebuildBlocks(currentBlocks);
                setupChoices(currentBlocks.length);
            } else if (payload.action === 'end') {
                gameStarted = false;
                currentBlocks = [];
                activeShiningEyesRound = false;
                hasShiningEyesBuff = false;
                applyUIState(false);
            }
        });

        room.on('broadcast', { event: 'attack_event' }, ({ payload }) => {
            if (payload.targetId === myId) {
                if (payload.type === 'glitch') {
                    triggerGlitchEffect();
                } else if (payload.type === 'taunt') {
                    triggerTauntEffect();
                } else if (payload.type === 'freeze') {
                    triggerFreezeEffect();
                }
            }
        });

        room.subscribe(async (status) => {
            if (status === 'SUBSCRIBED') await updatePresence();
        });

        function applyUIState(isStarted) {
            const normalUI = document.getElementById('normalUI');
            const gameUI = document.getElementById('gameUI');
            const defaultUI = document.getElementById('defaultUserListUI');
            const gameRankingUI = document.getElementById('gameRankingUI');
            const startBtn = document.getElementById('startBtn');
            const teacherControls = document.getElementById('teacherControls');

            if (isStarted) {
                normalUI.style.display = 'none';
                gameUI.style.display = 'flex';
                defaultUI.style.display = 'none';
                gameRankingUI.style.display = 'flex';
                
                if (isTeacher) {
                    startBtn.style.display = 'none';
                    teacherControls.style.display = 'flex';
                }
                initThreeOnce();
            } else {
                normalUI.style.display = 'flex';
                gameUI.style.display = 'none';
                defaultUI.style.display = 'flex';
                gameRankingUI.style.display = 'none';

                if (isTeacher) {
                    startBtn.style.display = 'block';
                    teacherControls.style.display = 'none';
                }
            }
        }

        function renderUserList(users) {
            const container = document.getElementById('userListContainer');
            const countText = document.getElementById('onlineCountText');
            countText.innerText = `접속중 ${users.length}명`;

            if (users.length === 0) {
                container.innerHTML = `<div class="empty-state">접속자가 없습니다.</div>`;
                return;
            }

            container.innerHTML = users.map(u => {
                const isMe = u.id === myId ? ' (나)' : '';
                return `
                    <div class="user-item">
                        <span class="user-name">${u.nickname || '익명'}${isMe}</span>
                        <span style="font-size: 12px; color: #22c55e; font-weight: 600;">● 온라인</span>
                    </div>
                `;
            }).join('');
        }

        function renderRankingList(users) {
            const container = document.getElementById('rankingList');
            const title = document.getElementById('rankingTitle');

            if (isTargetSelectMode) {
                title.innerHTML = `<span style="color: #ef4444;">🎯 공격할 상대방을 클릭하세요!</span>`;

                container.innerHTML = users.map((u) => {
                    const isMe = u.id === myId;
                    const itemClass = isMe ? 'rank-item' : 'rank-item selectable';
                    const targetBadge = isMe ? '<span style="color: #94a3b8; font-size: 11px;">(나)</span>' : '<span style="color: #ef4444; font-size: 11px; font-weight: bold;">[지목하기]</span>';
                    
                    return `
                        <div class="${itemClass}" data-userid="${u.id}">
                            <div>
                                <span>${u.nickname || '익명'}</span>
                            </div>
                            ${targetBadge}
                        </div>
                    `;
                }).join('');

                container.querySelectorAll('.selectable').forEach(el => {
                    el.addEventListener('click', async () => {
                        const targetId = el.getAttribute('data-userid');
                        if (targetId && pendingAttackType) {
                            await room.send({
                                type: 'broadcast',
                                event: 'attack_event',
                                payload: { targetId: targetId, type: pendingAttackType }
                            });
                        }
                        isTargetSelectMode = false;
                        pendingAttackType = null;
                        renderRankingList(activeUsers);
                    });
                });
            } else {
                title.innerHTML = `🏆 실시간 랭킹`;

                let sorted = [...users].sort((a, b) => (b.score || 0) - (a.score || 0));

                container.innerHTML = sorted.map((u, idx) => {
                    let badgeClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : 'rank-etc';
                    let rankText = idx < 3 ? `${idx + 1}등` : `${idx + 1}등`;
                    return `
                        <div class="rank-item">
                            <div>
                                <span class="rank-badge ${badgeClass}">${rankText}</span>
                                <span style="margin-left: 6px;">${u.nickname || '익명'}</span>
                            </div>
                            <span style="color: #64748b; font-size: 12px;">${u.score || 0}점</span>
                        </div>
                    `;
                }).join('');
            }
        }

        function generateValidBlocks() {
            let blocks = [];
            let grid = {};
            let targetCount = Math.floor(Math.random() * 5) + 5;

            let startX = Math.floor(Math.random() * 2);
            let startY = Math.floor(Math.random() * 2);
            blocks.push({ x: startX, y: startY, z: 0 });
            grid[`${startX},${startY},0`] = true;

            while (blocks.length < targetCount) {
                let candidates = [];
                for (let b of blocks) {
                    let neighbors = [
                        { x: b.x + 1, y: b.y, z: b.z },
                        { x: b.x - 1, y: b.y, z: b.z },
                        { x: b.x, y: b.y + 1, z: b.z },
                        { x: b.x, y: b.y - 1, z: b.z },
                        { x: b.x, y: b.y, z: b.z + 1 },
                        { x: b.x, y: b.y, z: b.z - 1 }
                    ];

                    for (let n of neighbors) {
                        if (n.x >= 0 && n.x < 3 && n.y >= 0 && n.y < 3 && n.z >= 0 && n.z < 3) {
                            let key = `${n.x},${n.y},${n.z}`;
                            if (!grid[key]) {
                                if (n.z === 0 || grid[`${n.x},${n.y},${n.z - 1}`]) {
                                    if (!candidates.some(c => c.x === n.x && c.y === n.y && c.z === n.z)) {
                                        candidates.push(n);
                                    }
                                }
                            }
                        }
                    }
                }

                if (candidates.length === 0) break;
                let next = candidates[Math.floor(Math.random() * candidates.length)];
                blocks.push(next);
                grid[`${next.x},${next.y},${next.z}`] = true;
            }

            return blocks;
        }

        function setupChoices(correctCount) {
            const container = document.getElementById('choiceButtons');
            const feedback = document.getElementById('feedbackMessage');
            container.innerHTML = '';
            feedback.innerText = '';
            hasGuessed = false;
            
            toggleOutline(activeShiningEyesRound);

            let choices = new Set([correctCount]);
            while (choices.size < 4) {
                let delta = (Math.random() < 0.7) ? (Math.random() < 0.5 ? 1 : -1) : (Math.random() < 0.5 ? 2 : -2);
                let val = correctCount + delta;
                if (val > 0) choices.add(val);
            }

            let arr = Array.from(choices).sort(() => Math.random() - 0.5);

            arr.forEach(num => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                if (activeShiningEyesRound) {
                    btn.classList.add('glowing-choice');
                }
                btn.innerText = `${num}개`;
                btn.addEventListener('click', () => {
                    if (hasGuessed || isTeacher) return;
                    hasGuessed = true;
                    toggleOutline(true);

                    if (num === correctCount) {
                        btn.classList.add('correct');
                        let gainScore = 10;
                        if (hasTripleScoreMultiplier) {
                            gainScore = 30;
                            hasTripleScoreMultiplier = false;
                            feedback.innerText = `정답입니다! ⚡벼락치기 발동 (+30점)!`;
                        } else {
                            feedback.innerText = '정답입니다! 카드 보상을 선택하세요.';
                        }
                        feedback.style.color = '#22c55e';
                        myScore += gainScore;
                        updatePresence();
                        setTimeout(() => openCardModal(), 500);
                    } else {
                        btn.classList.add('wrong');
                        feedback.innerText = `틀렸습니다! (정답: ${correctCount}개)`;
                        feedback.style.color = '#ef4444';
                    }
                });
                container.appendChild(btn);
            });
        }

        function generateCardOptions() {
            const coinAmounts = [5, 7, 10];
            const chosenCoin = coinAmounts[Math.floor(Math.random() * coinAmounts.length)];
            let coinImg = "";
            if (chosenCoin === 5) coinImg = "https://media.ffycdn.net/eu/supercell/XMEic2GRdS2qq7GJaEiB.png?width=2400";
            else if (chosenCoin === 7) coinImg = "https://media.ffycdn.net/eu/supercell/TGQBtafzmsdeiJwZSmpo.png?width=2400";
            else coinImg = "https://media.ffycdn.net/eu/supercell/ET4DYhvXCLzJPiw96NtX.png?width=2400";

            const pool = [
                {
                    type: 'coin',
                    title: `코인 ${chosenCoin}개`,
                    img: coinImg,
                    desc: `점수 +${chosenCoin}점을 즉시 획득합니다.`,
                    val: chosenCoin
                },
                {
                    type: 'confusion',
                    title: '혼란 카드',
                    img: 'https://media1.tenor.com/m/ZINlqqwHYQ4AAAAC/brawl-stars-brawl-stars-emoji.gif',
                    desc: '상대방을 지목하여 2초간 화면에 글리치를 생성합니다.'
                },
                {
                    type: 'taunt',
                    title: '괴롭히기 카드',
                    img: 'https://media.tenor.com/dpjhz7THIK8AAAAj/brawl-stars-thumbs-down.gif',
                    desc: '상대방 화면을 2.5초 동안 거대한 이미지로 가립니다.'
                },
                {
                    type: 'freeze',
                    title: '얼음 카드',
                    img: 'https://media.ffycdn.net/eu/supercell/6UFbyzBNqp1V5z9EASqM.png?width=2400',
                    desc: '상대방을 지목하여 3초간 쌓기나무 회전을 멈춥니다.'
                },
                {
                    type: 'lightning',
                    title: '벼락 치기 카드',
                    img: 'https://media.ffycdn.net/eu/supercell/Cz9rD81f7Qrva9kzgZvA.png?width=2400',
                    desc: '다음 문제를 맞히면 얻는 점수가 3배(30점)로 폭증합니다.'
                },
                {
                    type: 'shining_eyes',
                    title: '빛나는 눈 카드',
                    img: 'https://media.ffycdn.net/eu/supercell/Y7xeUH3uBvNkQBzSXkA6.png?width=2400',
                    desc: '다음 라운드에 쌓기나무가 반투명해지고 윤곽선과 정답 버튼이 빛납니다.'
                }
            ];

            return pool.sort(() => Math.random() - 0.5).slice(0, 3);
        }

        function openCardModal() {
            const modal = document.getElementById('cardModalOverlay');
            const container = document.getElementById('cardContainer');
            container.innerHTML = '';

            const cards = generateCardOptions();

            cards.forEach(card => {
                const el = document.createElement('div');
                el.className = 'reward-card';
                el.innerHTML = `
                    <div class="reward-card-title">${card.title}</div>
                    <img class="reward-card-img" src="${card.img}" alt="${card.title}">
                    <div class="reward-card-desc">${card.desc}</div>
                `;
                el.addEventListener('click', () => {
                    modal.classList.remove('active');
                    handleCardSelect(card);
                });
                container.appendChild(el);
            });

            modal.classList.add('active');
        }

        function handleCardSelect(card) {
            if (card.type === 'coin') {
                myScore += card.val;
                updatePresence();
            } else if (card.type === 'confusion' || card.type === 'taunt' || card.type === 'freeze') {
                if (card.type === 'confusion') pendingAttackType = 'glitch';
                else if (card.type === 'taunt') pendingAttackType = 'taunt';
                else if (card.type === 'freeze') pendingAttackType = 'freeze';
                
                isTargetSelectMode = true;
                renderRankingList(activeUsers);
            } else if (card.type === 'lightning') {
                hasTripleScoreMultiplier = true;
            } else if (card.type === 'shining_eyes') {
                hasShiningEyesBuff = true;
            }
        }

        function triggerGlitchEffect() {
            if (!scene || !glitchGroup) return;

            while (glitchGroup.children.length > 0) {
                glitchGroup.remove(glitchGroup.children[0]);
            }
            glitchMeshes = [];

            const count = Math.floor(Math.random() * 8) + 5;
            const geo = new THREE.BoxGeometry(1.0, 1.0, 1.0);

            for (let i = 0; i < count; i++) {
                const mat = new THREE.MeshStandardMaterial({
                    color: Math.random() * 0xffffff,
                    transparent: true,
                    opacity: 0.85
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(
                    (Math.random() * 4) - 1,
                    Math.random() * 3,
                    (Math.random() * 4) - 1
                );
                glitchGroup.add(mesh);
                glitchMeshes.push(mesh);
            }

            setTimeout(() => {
                while (glitchGroup.children.length > 0) {
                    glitchGroup.remove(glitchGroup.children[0]);
                }
                glitchMeshes = [];
            }, 2000);
        }

        function triggerTauntEffect() {
            const overlay = document.getElementById('tauntOverlay');
            overlay.style.display = 'flex';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 2500);
        }

        function triggerFreezeEffect() {
            isCameraFrozen = true;
            const badge = document.getElementById('cameraStatusBadge');
            if (badge) badge.innerText = "❄️ 카메라가 3초간 얼어붙었습니다!";
            setTimeout(() => {
                isCameraFrozen = false;
                if (badge) badge.innerText = "3D 관찰 카메라 회전 중";
            }, 3000);
        }

        let scene, camera, renderer, blockGroup, outlineGroup, glitchGroup;
        let glitchMeshes = [];
        let cameraAngle = 0;
        let isThreeInitialized = false;

        function initThreeOnce() {
            if (isThreeInitialized) return;
            isThreeInitialized = true;

            const container = document.getElementById('threeContainer');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf8fafc);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            blockGroup = new THREE.Group();
            outlineGroup = new THREE.Group();
            glitchGroup = new THREE.Group();

            scene.add(blockGroup);
            scene.add(outlineGroup);
            scene.add(glitchGroup);

            function animate() {
                requestAnimationFrame(animate);
                
                if (!isCameraFrozen) {
                    cameraAngle += 0.012;
                }
                
                const radius = 8.5;
                camera.position.x = 1 + radius * Math.cos(cameraAngle);
                camera.position.z = 1 + radius * Math.sin(cameraAngle);
                camera.position.y = 5.5;
                camera.lookAt(1, 0.8, 1);

                if (glitchMeshes.length > 0) {
                    glitchMeshes.forEach(m => {
                        m.material.color.setHex(Math.random() * 0xffffff);
                    });
                }

                renderer.render(scene, camera);
            }
            animate();
        }

        function rebuildBlocks(blocks) {
            if (!blockGroup || !outlineGroup) return;

            while(blockGroup.children.length > 0) blockGroup.remove(blockGroup.children[0]);
            while(outlineGroup.children.length > 0) outlineGroup.remove(outlineGroup.children[0]);

            const boxGeo = new THREE.BoxGeometry(1.0, 1.0, 1.0);
            
            const isTransparent = activeShiningEyesRound;
            const boxMat = new THREE.MeshStandardMaterial({ 
                color: 0x3b82f6, 
                roughness: 0.3, 
                metalness: 0.1,
                transparent: isTransparent,
                opacity: isTransparent ? 0.6 : 1.0
            });

            const edgesGeo = new THREE.EdgesGeometry(boxGeo);
            const lineMat = new THREE.LineBasicMaterial({ 
                color: isTransparent ? 0x00ffff : 0x00ffcc, 
                linewidth: 2, 
                depthTest: false 
            });

            blocks.forEach(b => {
                const mesh = new THREE.Mesh(boxGeo, boxMat);
                mesh.position.set(b.x, b.z, b.y);
                blockGroup.add(mesh);

                const line = new THREE.LineSegments(edgesGeo, lineMat);
                line.position.set(b.x, b.z, b.y);
                line.visible = activeShiningEyesRound;
                outlineGroup.add(line);
            });
        }

        function toggleOutline(visible) {
            if (outlineGroup) {
                outlineGroup.children.forEach(c => { c.visible = visible; });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const nicknameInput = document.getElementById('nickname');
            const teacherCodeInput = document.getElementById('teacherCode');
            const startBtn = document.getElementById('startBtn');
            const nextBtn = document.getElementById('nextBtn');
            const endBtn = document.getElementById('endBtn');

            nicknameInput.addEventListener('input', syncNickname);
            nicknameInput.addEventListener('blur', syncNickname);

            teacherCodeInput.addEventListener('input', (e) => {
                if (e.target.value.trim() === 'PANdA') {
                    isTeacher = true;
                    syncNickname();
                    startBtn.style.display = gameStarted ? 'none' : 'block';
                    if (gameStarted) teacherControls.style.display = 'flex';
                }
            });

            startBtn.addEventListener('click', async () => {
                if (!isTeacher) return;
                gameStarted = true;
                currentBlocks = generateValidBlocks();
                applyUIState(true);
                rebuildBlocks(currentBlocks);
                setupChoices(currentBlocks.length);

                await room.send({
                    type: 'broadcast',
                    event: 'game_control',
                    payload: { action: 'start', blocks: currentBlocks }
                });
                await updatePresence();
            });

            nextBtn.addEventListener('click', async () => {
                if (!isTeacher) return;
                currentBlocks = generateValidBlocks();
                rebuildBlocks(currentBlocks);
                setupChoices(currentBlocks.length);

                await room.send({
                    type: 'broadcast',
                    event: 'game_control',
                    payload: { action: 'next', blocks: currentBlocks }
                });
            });

            endBtn.addEventListener('click', async () => {
                if (!isTeacher) return;
                gameStarted = false;
                currentBlocks = [];
                applyUIState(false);

                await room.send({
                    type: 'broadcast',
                    event: 'game_control',
                    payload: { action: 'end' }
                });
                await updatePresence();
            });
        });

        function resizeMonitor() {
            const monitor = document.getElementById('pcMonitor');
            const scaleX = window.innerWidth / 960;
            const scaleY = window.innerHeight / 580;
            let scale = Math.min(scaleX, scaleY) * 0.95;
            monitor.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', resizeMonitor);
        window.addEventListener('load', resizeMonitor);
    </script>
