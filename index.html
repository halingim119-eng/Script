<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미완성</title>
    
    <!-- 이미지 사전 로드 -->
    <link rel="preload" as="image" href="https://media.ffycdn.net/eu/supercell/B9aSwkAt73UKJgmPgSun.png?width=2400" fetchpriority="high">

    <!-- Supabase JS SDK -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = "https://knjblcpgxcixfbzcrrqg.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_Xn2UjMtIkzXQU_6xPlMvrg_Rtc9VY0v";

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // 모바일 브라우저 고유 ID 부여 (로컬스토리지 활용)
        let myId = localStorage.getItem('user_uuid');
        if (!myId) {
            myId = 'user_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('user_uuid', myId);
        }

        let baseNickname = '';
        let isTeacher = false;
        let myNickname = '';

        // Supabase Realtime 채널 생성 (Presence 기능)
        const room = supabase.channel('online-users-room', {
            config: {
                presence: {
                    key: myId,
                },
            },
        });

        // 내 상태(아이디, 닉네임)를 서버에 전송하는 함수
        async function updatePresence() {
            try {
                await room.track({
                    id: myId,
                    nickname: myNickname,
                    onlineAt: new Date().toISOString()
                });
            } catch (err) {
                console.error("Presence update error:", err);
            }
        }

        // 다른 사람이 들어오거나 나갈 때, 이름을 바꿀 때 실시간 동기화
        room.on('presence', { event: 'sync' }, () => {
            const state = room.presenceState();
            renderUserList(state);
        });

        // 채널 접속 성공 시 내 상태 등록
        room.subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
                await updatePresence();
            }
        });

        // 닉네임과 선생님 코드 조합하여 닉네임 완성 및 전송 함수
        function processNicknameUpdate() {
            const prefix = isTeacher ? '(선생님) ' : '';
            myNickname = prefix + (baseNickname.trim() !== '' ? baseNickname : '이름 없음');
        }

        const nicknameInput = document.getElementById('nickname');
        const teacherCodeInput = document.getElementById('teacherCode');
        const startButton = document.getElementById('startButton');

        let typingTimer;

        // 닉네임 입력 이벤트 (실시간 반영 및 디바운스 적용)
        nicknameInput.addEventListener('input', (e) => {
            baseNickname = e.target.value;
            processNicknameUpdate();
            clearTimeout(typingTimer);
            typingTimer = setTimeout(async () => {
                await updatePresence();
            }, 300);
        });

        // 💡 [버그 수정] 엔터를 안 누르고 바깥을 누르거나 포커스가 해제될 때(blur)도 즉시 반영되도록 처리
        nicknameInput.addEventListener('blur', async () => {
            baseNickname = nicknameInput.value;
            processNicknameUpdate();
            clearTimeout(typingTimer);
            await updatePresence();
        });

        // 엔터키 누를 때 즉시 전송
        nicknameInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                baseNickname = nicknameInput.value;
                processNicknameUpdate();
                clearTimeout(typingTimer);
                await updatePresence();
                nicknameInput.blur();
            }
        });

        // 투명한 선생님 코드 입력칸 이벤트 (PANdA 감지 및 버튼 활성화 관리)
        teacherCodeInput.addEventListener('input', async (e) => {
            const code = e.target.value.trim();
            isTeacher = (code === 'PANdA');
            
            // PANdA가 맞으면 시작 버튼 활성화, 아니면 비활성화
            if (isTeacher) {
                startButton.disabled = false;
                startButton.classList.add('active');
            } else {
                startButton.disabled = true;
                startButton.classList.remove('active');
            }

            processNicknameUpdate();
            await updatePresence();
        });

        // 시작 버튼 클릭 시 즉시 전송
        startButton.addEventListener('click', async () => {
            if (startButton.disabled) return;
            baseNickname = nicknameInput.value;
            processNicknameUpdate();
            clearTimeout(typingTimer);
            await updatePresence();
            alert('선생님 모드로 시작되었습니다!');
        });

        // 🧹 [자원 절약] 페이지를 닫거나 다른 곳으로 이동할 때 서버에 신호 즉시 삭제 요청
        window.addEventListener('beforeunload', () => {
            room.untrack();
        });
        window.addEventListener('pagehide', () => {
            room.untrack();
        });

        // 접속자 목록 화면 렌더링 함수
        function renderUserList(state) {
            const userListContainer = document.getElementById('userListContainer');
            const onlineCountBadgeText = document.getElementById('onlineCountText');

            const allPresences = [];
            Object.values(state).forEach(presences => {
                if (presences && presences.length > 0) {
                    allPresences.push(presences[0]);
                }
            });

            onlineCountBadgeText.innerText = `접속중 ${allPresences.length}명`;

            if (allPresences.length === 0) {
                userListContainer.innerHTML = `<div class="empty-state">현재 접속 중인 사람이 없습니다.</div>`;
                return;
            }

            userListContainer.innerHTML = allPresences.map(user => {
                const displayName = (user.nickname && user.nickname.trim() !== '') ? user.nickname : '이름 없음';
                const initial = displayName.charAt(0).toUpperCase();
                const isMe = user.id === myId ? ' (나)' : '';

                return `
                    <div class="user-item">
                        <div class="user-info">
                            <div class="user-avatar">${initial}</div>
                            <div>
                                <div class="user-name">${displayName}${isMe}</div>
                                <div class="user-status-text">실시간 접속중</div>
                            </div>
                        </div>
                        <span style="font-size: 12px; color: #34a853; font-weight: 600;">● 온라인</span>
                    </div>
                `;
            }).join('');
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
        }

        /* 컴퓨터 화면 모양의 직사각형 모니터 프레임 */
        .pc-monitor {
            width: 920px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform-origin: center center;
        }

        /* 모니터 상단 바 */
        .monitor-header {
            height: 38px;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 8px;
        }

        .window-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        .monitor-title-text {
            margin-left: auto;
            margin-right: auto;
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
        }

        /* 컴퓨터 화면 레이아웃 내용물 */
        .desktop-content {
            width: 900px;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 23px;
            background-color: #ffffff;
        }

        /* 왼쪽 카드 UI */
        .card {
            width: 336px;           
            height: 454px;          
            background-color: #ffffff;
            border-radius: 20px;    
            box-shadow: 0 11px 34px rgba(0, 0, 0, 0.08); 
            border: 1px solid #f0f0f0; 
            padding: 22px 20px;     
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
            flex-shrink: 0; 
        }

        .card-image-container {
            width: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-4px); 
            overflow: hidden;
        }

        .card-image {
            max-width: 85%;
            max-height: 210px; /* 이미지 크기를 조금 더 확대 */
            object-fit: contain;
        }

        .nickname-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;               
        }

        .nickname-label {
            font-size: 15px;        
            font-weight: 600;
            color: #555555;
        }

        .nickname-input {
            width: 100%;
            padding: 10px 14px;     
            font-size: 16px;        
            border: 1px solid #ddd;
            border-radius: 8px;     
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fafafa;
        }

        .nickname-input:focus {
            border-color: #007bff;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        /* 시작 버튼 스타일 (기본 비활성화 상태) */
        .start-btn {
            width: 100%;
            padding: 11px;
            background-color: #cccccc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: not-allowed;
            transition: background-color 0.2s;
            margin-top: 4px;
        }

        /* PANdA가 입력되어 활성화되었을 때의 스타일 */
        .start-btn.active {
            background-color: #e63946; /* 선생님 모드 강조 컬러 (빨간계열) 또는 #007bff */
            cursor: pointer;
        }
        .start-btn.active:hover {
            background-color: #d62828;
        }

        /* 오른쪽 큰 카드 영역 */
        .main-container-card {
            flex: 1; 
            height: 454px; 
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 11px 34px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f0;
            padding: 30px;
            display: flex;
            flex-direction: column;
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .board-title {
            font-size: 18px;
            font-weight: bold;
            color: #333333;
        }

        /* 접속자 표시 영역 (투명 입력칸 포함) */
        .online-count-badge {
            background-color: #e6f4ea;
            color: #137333;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 접속자 뱃지 안의 투명한 입력칸 */
        .transparent-code-input {
            width: 45px;
            border: none;
            background: transparent;
            outline: none;
            font-size: 12px;
            color: #137333;
            font-weight: 600;
        }
        .transparent-code-input::placeholder {
            color: transparent;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #34a853;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .user-list-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 5px;
        }

        .user-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background-color: #f9f9f9;
            border-radius: 12px;
            border: 1px solid #eeeeee;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background-color: #e2e8f0;
            color: #475569;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .user-name {
            font-size: 15px;
            font-weight: 600;
            color: #333333;
        }

        .user-status-text {
            font-size: 12px;
            color: #888888;
        }

        .empty-state {
            margin: auto;
            text-align: center;
            color: #888888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- 컴퓨터 화면 모양의 직사각형 모니터 프레임 -->
    <div class="pc-monitor" id="pcMonitor">
        <div class="monitor-header">
            <div class="window-dot dot-red"></div>
            <div class="window-dot dot-yellow"></div>
            <div class="window-dot dot-green"></div>
            <div class="monitor-title-text">컴퓨터 화면 모드</div>
        </div>

        <div class="desktop-content">
            <!-- 왼쪽 카드 UI -->
            <div class="card">
                <div class="card-image-container">
                    <img src="https://media.ffycdn.net/eu/supercell/B9aSwkAt73UKJgmPgSun.png?width=2400" 
                         alt="캐릭터 이미지" 
                         class="card-image"
                         fetchpriority="high"
                         loading="eager">
                </div>
                <div class="nickname-section">
                    <label for="nickname" class="nickname-label">닉네임</label>
                    <input type="text" id="nickname" class="nickname-input" placeholder="이름을 입력하세요">
                    <!-- 시작 버튼 (처음엔 비활성화 상태) -->
                    <button id="startButton" class="start-btn" disabled>시작</button>
                </div>
            </div>

            <!-- 오른쪽 카드: 실시간 실제 접속자 현황 -->
            <div class="main-container-card">
                <div class="board-header">
                    <div class="board-title">실시간 실제 접속자 현황</div>
                    <div class="online-count-badge">
                        <div class="live-dot"></div>
                        <span id="onlineCountText">접속중 0명</span>
                        <!-- 투명한 선생님 코드 입력칸 -->
                        <input type="text" id="teacherCode" class="transparent-code-input" placeholder="">
                    </div>
                </div>

                <div class="user-list-container" id="userListContainer">
                    <div class="empty-state">접속자를 감지하는 중...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 모바일 화면 크기에 맞춰 PC 모니터 프레임 전체를 자동으로 축소/확대하는 스크립트
        function resizeMonitor() {
            const monitor = document.getElementById('pcMonitor');
            const targetWidth = 940;  
            const targetHeight = 560; 
            
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            const scaleX = windowWidth / targetWidth;
            const scaleY = windowHeight / targetHeight;
            let scale = Math.min(scaleX, scaleY) * 0.92;

            monitor.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', resizeMonitor);
        window.addEventListener('load', resizeMonitor);
        resizeMonitor();
    </script>
</body>
</html>
